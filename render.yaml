# Preview web de Calcula tu Huella V2.1.x.
# Objetivo: permitir UAT/navegación online desde el branch activo sin instalar nada.
# No sustituye la infraestructura productiva certificada: el almacenamiento local
# de archivos de este preview es efímero y DEPLOYMENT_STRICT permanece desactivado.

services:
  - type: web
    name: calcula-tu-huella-arendon7-preview
    runtime: docker
    plan: free
    region: virginia
    branch: feature/v2-1-0-brand-provenance
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: calcula-tu-huella-preview-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://calcula-tu-huella-arendon7-preview.onrender.com
      - key: TRUSTED_HOSTS
        value: calcula-tu-huella-arendon7-preview.onrender.com,localhost,127.0.0.1
      - key: SEED_DEMO
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: EMAIL_BACKEND
        value: disabled
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DEPLOYMENT_STRICT
        value: "false"
      - key: OPEN_BROWSER
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: STRUCTURED_LOGGING
        value: "true"

# Base persistente y aislada para UAT. Se fija PostgreSQL 17 porque es la versión
# sobre la que se certificaron migraciones legacy→head, restore y runtime V2.1.
# Los documentos cargados siguen siendo efímeros hasta conectar almacenamiento externo.
databases:
  - name: calcula-tu-huella-preview-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: calculatuhuella_preview
    user: calculatuhuella_preview
