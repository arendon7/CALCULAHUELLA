groups:
  - name: calcula-tu-huella
    rules:
      - alert: CalculaTuHuellaDown
        expr: up{job="calcula-tu-huella"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Calcula tu Huella no responde"
          description: "Prometheus no puede consultar /metrics durante 2 minutos."
      - alert: CalculaTuHuellaHigh5xx
        expr: increase(cth_http_errors_5xx_total[10m]) > 5
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Errores 5xx elevados"
          description: "Se detectaron más de 5 errores 5xx durante 10 minutos."
