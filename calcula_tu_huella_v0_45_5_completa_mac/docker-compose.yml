services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calculatuhuella}
      POSTGRES_USER: ${POSTGRES_USER:-calculatuhuella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calculatuhuella} -d ${POSTGRES_DB:-calculatuhuella}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-calculatuhuella}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calculatuhuella}
      INSTANCE_DIR: /app/instance
      HOST: 0.0.0.0
      PORT: 8765
      OPEN_BROWSER: 0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/instance
    expose:
      - "8765"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-calculatuhuella}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calculatuhuella}
      INSTANCE_DIR: /app/instance
      APP_ENV: production
      SEED_DEMO: "false"
      SCHEDULER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/instance
    command: ["sh", "-c", "alembic upgrade head && python scripts/run_automations.py"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
