services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: calculatuhuella
      POSTGRES_USER: calculatuhuella
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - trial_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculatuhuella -d calculatuhuella"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - trial_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set trial http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing trial/calcula-tu-huella
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://calculatuhuella:${POSTGRES_PASSWORD}@postgres:5432/calculatuhuella
      INSTANCE_DIR: /app/instance
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_HTTPS_ONLY: "true"
      PUBLIC_BASE_URL: https://localhost:8443
      TRUSTED_HOSTS: localhost,127.0.0.1,app
      SEED_DEMO: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ORGANIZATION: Greenatics Ensayo
      STORAGE_BACKEND: s3
      S3_BUCKET: calcula-tu-huella
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      EMAIL_BACKEND: disabled
      PAYMENT_BACKEND: manual
      CSRF_ENABLED: "true"
      STRUCTURED_LOGGING: "true"
      AUDIT_CHAIN_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
      ALERT_ORGANIZATION_ID: "1"
      DEPLOYMENT_STRICT: "true"
      OBJECT_STORAGE_HEALTH_URL: http://minio:9000/minio/health/ready
      PROMETHEUS_HEALTH_URL: http://prometheus:9090/-/ready
      ALERTMANAGER_HEALTH_URL: http://alertmanager:9093/-/ready
      GRAFANA_HEALTH_URL: http://grafana:3000/api/health
      EXTERNAL_PROBE_TIMEOUT_SECONDS: "5"
      SCHEDULER_ENABLED: "false"
      OPEN_BROWSER: "0"
      HOST: 0.0.0.0
      PORT: "8765"
    volumes:
      - trial_app:/app/instance
    expose:
      - "8765"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile.trial:/etc/caddy/Caddyfile:ro
      - trial_caddy_data:/data
      - trial_caddy_config:/config

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__METRICS_TOKEN__|$${METRICS_TOKEN}|g" /etc/prometheus/prometheus.template.yml > /tmp/prometheus.yml &&
        /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus.template.yml:/etc/prometheus/prometheus.template.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - trial_prometheus:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    environment:
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__ALERT_WEBHOOK_SECRET__|$${ALERT_WEBHOOK_SECRET}|g" /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml &&
        /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - trial_alertmanager:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - trial_grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  trial_postgres:
  trial_minio:
  trial_app:
  trial_caddy_data:
  trial_caddy_config:
  trial_prometheus:
  trial_alertmanager:
  trial_grafana:
