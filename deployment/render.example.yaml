services:
  - type: web
    name: calcula-tu-huella-demo
    runtime: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: calcula-tu-huella-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: OPEN_BROWSER
        value: "0"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DEPLOYMENT_STRICT
        value: "false"

databases:
  - name: calcula-tu-huella-db
    plan: starter
    databaseName: calculatuhuella
    user: calculatuhuella
