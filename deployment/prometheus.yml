global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: calcula-tu-huella
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: REEMPLAZAR_METRICS_TOKEN
    static_configs:
      - targets: ["app:8765"]
