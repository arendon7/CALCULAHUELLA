[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-config --strict-markers
markers =
    smoke: pruebas rápidas de disponibilidad, seguridad y rutas críticas
    integration: pruebas con persistencia, exportaciones o servicios integrados
    slow: pruebas de certificación, respaldo o restauración
    acceptance: pruebas de aceptación multiempresa, continuidad y concurrencia
