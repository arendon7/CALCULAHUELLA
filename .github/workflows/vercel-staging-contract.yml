name: V2.1 · Serverless staging runtime contract

on:
  push:
    branches:
      - feature/v2-1-0-brand-provenance
    paths:
      - "api/**"
      - "app/**"
      - "migrations/**"
      - "requirements*.txt"
      - "scripts/vercel_staging_contract.py"
      - "scripts/postgres_legacy_migration_gate.py"
      - "scripts/alembic_revision_authority.py"
      - "tests/test_vercel_staging_adapter.py"
      - "tests/test_migration_legacy_compat.py"
      - "tests/test_v200_postgres_schema_compatibility.py"
      - "tests/test_v200_postgres_methodology_schema.py"
      - "tests/test_v2621_serverless_migration_head_authority.py"
      - "vercel.json"
      - ".github/workflows/vercel-staging-contract.yml"
  pull_request:
    branches:
      - feature/v2-1-0-brand-provenance
    paths:
      - "api/**"
      - "app/**"
      - "migrations/**"
      - "requirements*.txt"
      - "scripts/vercel_staging_contract.py"
      - "scripts/postgres_legacy_migration_gate.py"
      - "scripts/alembic_revision_authority.py"
      - "tests/test_vercel_staging_adapter.py"
      - "tests/test_migration_legacy_compat.py"
      - "tests/test_v200_postgres_schema_compatibility.py"
      - "tests/test_v200_postgres_methodology_schema.py"
      - "tests/test_v2621_serverless_migration_head_authority.py"
      - "vercel.json"
      - ".github/workflows/vercel-staging-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-staging-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: FastAPI serverless contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cth_legacy_gate
          POSTGRES_USER: cth
          POSTGRES_PASSWORD: cth_gate_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cth -d cth_legacy_gate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      SERVERLESS_STAGING_ARTIFACT_DIR: serverless-staging-artifacts
      POSTGRES_LEGACY_DATABASE_URL: postgresql+psycopg://cth:cth_gate_password@127.0.0.1:5432/cth_legacy_gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar aplicación y dependencias de gate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Verificar adaptador y compatibilidad Alembic
        run: |
          pytest -q tests/test_vercel_staging_adapter.py
          pytest -q tests/test_migration_legacy_compat.py
          pytest -q tests/test_v200_postgres_schema_compatibility.py tests/test_v200_postgres_methodology_schema.py
          pytest -q tests/test_v2621_serverless_migration_head_authority.py

      - name: Certificar upgrade legado sobre PostgreSQL 17
        run: python -m scripts.postgres_legacy_migration_gate

      - name: Ejecutar FastAPI desde api.index:app
        run: python -m scripts.vercel_staging_contract

      - name: Publicar evidencia serverless
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serverless-staging-contract
          path: serverless-staging-artifacts/
          if-no-files-found: error
          retention-days: 14
