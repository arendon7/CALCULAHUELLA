name: Actualizar manifiesto arranque Render

on:
  push:
    branches: [main]
    paths:
      - start_prod.sh
      - .github/workflows/refresh-render-startup-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar hash de start_prod.sh
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFIESTO_SHA256_CANONICO.txt')
          target = Path('start_prod.sh')
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              current, rel = line.split('  ', 1)
              entries[rel] = current
          entries['start_prod.sh'] = digest
          manifest.write_text(
              ''.join(f'{entries[rel]}  {rel}\n' for rel in sorted(entries)),
              encoding='utf-8',
          )
          PY
      - name: Verificar manifiesto completo
        shell: bash
        run: python tools/verify_canonical.py
      - name: Publicar manifiesto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFIESTO_SHA256_CANONICO.txt
          if git diff --cached --quiet; then
            echo "El manifiesto ya estaba actualizado."
            exit 0
          fi
          git commit -m "chore: actualizar manifiesto del arranque Render"
          git push origin HEAD:main
