name: V2.60.12 · Product Readiness regression patcher

on:
  push:
    branches:
      - fix/v2-60-12-product-readiness-regressions

permissions:
  contents: write

jobs:
  patch-historical-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-60-12-product-readiness-regressions
          fetch-depth: 0

      - name: Patch only stale V0.16 regression contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_app.py')
          text = path.read_text(encoding='utf-8')

          service_start = text.index('def test_v016_service_order_lifecycle():')
          service_end = text.index('\n\ndef test_v016_recurring_charge_creates_billing_document():', service_start)
          service_replacement = '''def test_v016_service_order_lifecycle():
              with TestClient(app) as client:
                  login(client, "consultor@calculatuhuella.local")
                  response = client.post(
                      "/operacion-comercial/ordenes/nueva",
                      data={
                          "organization_id": "1", "contract_id": "", "reference": "OS-TEST-2026-001",
                          "title": "Entrega técnica de prueba", "service_type": "Informe", "description": "Validación automática",
                          "planned_start": "2026-08-01", "planned_end": "2026-08-31", "owner": "Consultoría",
                          "acceptance_criteria": "Informe aprobado", "notes": "Prueba",
                      },
                      follow_redirects=False,
                  )
                  assert response.status_code == 303
                  with SessionLocal() as session:
                      order = session.scalar(select(ServiceOrder).where(ServiceOrder.reference == "OS-TEST-2026-001"))
                      order_id = order.id

                  # V2.60.12: acceptance cannot fabricate delivery evidence in
                  # the same write. The rejected shortcut must leave the order
                  # untouched before the valid lifecycle is exercised.
                  shortcut = client.post(
                      f"/operacion-comercial/ordenes/{order_id}/estado",
                      data={"status": "Aceptada", "notes": "Intento sin entrega persistida"},
                      follow_redirects=False,
                  )
                  assert shortcut.status_code == 409
                  with SessionLocal() as session:
                      persisted = session.get(ServiceOrder, order_id)
                      assert persisted.status == "Planeada"
                      assert persisted.delivered_at is None
                      assert persisted.accepted_at is None

                  executing = client.post(
                      f"/operacion-comercial/ordenes/{order_id}/estado",
                      data={"status": "En ejecución", "notes": "Trabajo iniciado"},
                      follow_redirects=False,
                  )
                  assert executing.status_code == 303
                  delivered = client.post(
                      f"/operacion-comercial/ordenes/{order_id}/estado",
                      data={"status": "Entregada", "notes": "Entrega técnica persistida"},
                      follow_redirects=False,
                  )
                  assert delivered.status_code == 303
                  with SessionLocal() as session:
                      persisted = session.get(ServiceOrder, order_id)
                      assert persisted.status == "Entregada"
                      assert persisted.delivered_at is not None
                      assert persisted.accepted_at is None

                  accepted = client.post(
                      f"/operacion-comercial/ordenes/{order_id}/estado",
                      data={"status": "Aceptada", "notes": "Aceptada por el cliente"},
                      follow_redirects=False,
                  )
                  assert accepted.status_code == 303
              with SessionLocal() as session:
                  order = session.get(ServiceOrder, order_id)
                  assert order.status == "Aceptada"
                  assert order.delivered_at is not None
                  assert order.accepted_at is not None
          '''
          # Dedent the embedded replacement while preserving the source's
          # top-level function indentation.
          import textwrap
          service_replacement = textwrap.dedent(service_replacement)
          text = text[:service_start] + service_replacement.rstrip() + text[service_end:]

          collection_start = text.index('def test_v016_collection_action_can_close_and_mark_invoice_paid():')
          collection_end = text.index('\n\ndef test_v017_seeded_customer_success_data_exists():', collection_start)
          collection_replacement = '''def test_v016_collection_action_can_close_and_mark_invoice_paid():
              with SessionLocal() as session:
                  # Own a deterministic invoice whose complete economic total is
                  # authoritative. V2.60.12 must not infer a paid total from an
                  # arbitrary legacy/base-before-tax seeded record.
                  invoice = BillingInvoice(
                      organization_id=1,
                      reference="INV-V016-TOTAL-KNOWN",
                      period_start=date(2026, 8, 1),
                      period_end=date(2026, 8, 31),
                      amount=119000,
                      status="Pendiente",
                      issued_at=date(2026, 8, 1),
                      due_date=date(2026, 8, 15),
                      charge_type="Prueba de cartera",
                      amount_semantics="total_with_tax",
                      net_amount=100000,
                      tax_rate_snapshot=19,
                      tax_amount=19000,
                      total_amount=119000,
                      source_reference="V016-COLLECTION",
                      classification_note="Total de prueba autoritativo para validar cierre de cartera.",
                  )
                  session.add(invoice)
                  session.commit()
                  invoice_id = invoice.id
              with TestClient(app) as client:
                  login(client, "consultor@calculatuhuella.local")
                  response = client.post(
                      "/operacion-comercial/cartera/nueva",
                      data={
                          "invoice_id": str(invoice_id), "action_type": "Acuerdo de pago", "channel": "Correo",
                          "recipient": "tesoreria@empresa.test", "due_at": "2026-08-10", "notes": "Confirmar transferencia",
                      },
                      follow_redirects=False,
                  )
                  assert response.status_code == 303
                  with SessionLocal() as session:
                      action = session.scalar(select(CollectionAction).where(CollectionAction.invoice_id == invoice_id).order_by(CollectionAction.id.desc()))
                      action_id = action.id
                  response = client.post(
                      f"/operacion-comercial/cartera/{action_id}/completar",
                      data={"result": "Pago confirmado y conciliado", "invoice_status": "Pagada"},
                      follow_redirects=False,
                  )
                  assert response.status_code == 303
              with SessionLocal() as session:
                  action = session.get(CollectionAction, action_id)
                  invoice = session.get(BillingInvoice, invoice_id)
                  assert action.status == "Completada"
                  assert action.completed_at is not None
                  assert invoice.status == "Pagada"
                  assert invoice.paid_at is not None
          '''
          collection_replacement = textwrap.dedent(collection_replacement)
          text = text[:collection_start] + collection_replacement.rstrip() + text[collection_end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched contracts and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v26012-pr-regression-patcher.yml
          git add tests/test_app.py
          git diff --cached --check
          git commit -m "Align historical Product Readiness tests with lifecycle truth"
          git push origin HEAD:fix/v2-60-12-product-readiness-regressions
