name: Materialize V1.8 climate disclosure routing

on:
  push:
    branches: [refactor/v1-8-0-strategic-surfaces]
    paths:
      - .github/workflows/materialize-v18-climate-disclosure-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-8-0-strategic-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Climate Disclosure HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _require_climate_disclosure_view(user: dict[str, object]) -> None:\n'
          route_marker = '@app.get("/divulgacion-climatica", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/consolidacion", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(route_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('climate disclosure boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 11:
              raise SystemExit(f"expected 11 climate disclosure routes, found {block.count('@app.')}")
          route_start = block.index(route_marker)
          helper_block = block[:route_start].rstrip() + '\n'
          route_block = block[route_start:].rstrip() + '\n'

          header = '''from __future__ import annotations\n\nfrom datetime import UTC, date, datetime\nfrom io import BytesIO\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse, Response\nfrom openpyxl import Workbook\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .climate_disclosure import board_summary, build_board_pdf, disclosure_summary, scenario_comparison\nfrom .database import add_audit, get_db\nfrom .db.models import (\n    ClimateBoardBriefing,\n    ClimateBoardDecision,\n    ClimateDisclosureRequirement,\n    ClimateDisclosureStatement,\n    ClimateScenarioDefinition,\n    Inventory,\n    Organization,\n)\n\n\n'''
          indented_routes = ''.join(('    ' + line if line.strip() else line) for line in route_block.splitlines(keepends=True))
          module = header + helper_block + '\n\ndef register_climate_disclosure_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n) -> None:\n' + indented_routes
          Path('app/climate_disclosure_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .climate_risk_web import register_climate_risk_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('Climate Risk import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .climate_disclosure_web import register_climate_disclosure_routes\n', 1)
          register_anchor = '''register_climate_risk_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('Climate Risk registration anchor missing')
          registration = '''register_climate_disclosure_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nCLIMATE_DISCLOSURE_ROUTES = {\n    ("GET", "/divulgacion-climatica"),\n    ("POST", "/divulgacion-climatica/escenarios/nuevo"),\n    ("POST", "/divulgacion-climatica/escenarios/{scenario_id}/actualizar"),\n    ("POST", "/divulgacion-climatica/declaracion"),\n    ("POST", "/divulgacion-climatica/requisitos/nuevo"),\n    ("POST", "/divulgacion-climatica/requisitos/{requirement_id}/actualizar"),\n    ("POST", "/divulgacion-climatica/comite"),\n    ("POST", "/divulgacion-climatica/decisiones/nueva"),\n    ("POST", "/divulgacion-climatica/decisiones/{decision_id}/estado"),\n    ("GET", "/divulgacion-climatica/exportar.xlsx"),\n    ("GET", "/divulgacion-climatica/comite.pdf"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v180_climate_disclosure_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/climate_disclosure_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/divulgacion-climatica"' not in main_source\n    assert '@app.post("/divulgacion-climatica/' not in main_source\n    assert "register_climate_disclosure_routes(" in main_source\n    assert module_source.count("@app.") == 11\n    assert "def _require_climate_disclosure_view" in module_source\n    assert '@app.get("/consolidacion"' not in module_source\n    for authority in ("scenario_comparison", "disclosure_summary", "board_summary", "build_board_pdf"):\n        assert authority in module_source\n\n\ndef test_v180_climate_disclosure_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in CLIMATE_DISCLOSURE_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == CLIMATE_DISCLOSURE_ROUTES\n    assert len(actual) == len(CLIMATE_DISCLOSURE_ROUTES)\n\n\ndef test_v180_climate_disclosure_client_stays_read_only():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        page = client.get("/divulgacion-climatica")\n        assert page.status_code == 200\n        denied = client.post(\n            "/divulgacion-climatica/escenarios/nuevo",\n            data={\n                "name": "Escenario denegado V1.8",\n                "code": "DEN-V18",\n                "scenario_type": "Combinado",\n                "physical_multiplier": "1",\n                "transition_multiplier": "1",\n                "opportunity_multiplier": "1",\n                "probability_weight": "0",\n            },\n            follow_redirects=False,\n        )\n        assert denied.status_code == 403\n'''
          Path('tests/test_v180_climate_disclosure_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.8 · Climate Disclosure HTTP\n\n## Autoridad\n\n`app/climate_disclosure_web.py` pasa a ser la autoridad HTTP de once contratos para escenarios, declaración climática, requisitos, comité directivo, decisiones y exportaciones XLSX/PDF.\n\n## Dominio preservado\n\n`app/climate_disclosure.py` continúa siendo la autoridad de `scenario_comparison`, `disclosure_summary`, `board_summary` y `build_board_pdf`. No se alteran ponderaciones de escenarios, límites de sensibilidad, score de divulgación, contenido del board pack ni hash documental.\n\n## Gobierno y permisos\n\nLa lectura continúa disponible para `view_climate_disclosure` o `manage_climate_disclosure`; las mutaciones exigen `manage_climate_disclosure` y los estados aprobados mantienen la capacidad adicional `approve`. Los registros siguen aislados por organización.\n\n## Gates\n\nLos contratos históricos V0.20 protegen escenarios, límites de supuestos, requisitos, decisiones, XLSX, board pack PDF/hash y duplicados. El contrato V1.8 protege autoridad HTTP, unicidad y permisos.\n'''
          Path('docs/architecture/V1_8_CLIMATE_DISCLOSURE_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/climate_disclosure_web.py app/main.py tests/test_v180_climate_disclosure_routing.py
          git diff --check
      - name: Targeted V1.8 Climate Disclosure authority
        run: pytest -q tests/test_v180_climate_disclosure_routing.py
      - name: Historical V0.20 Climate Disclosure contracts
        run: pytest -q tests/test_app.py -k "v020"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Climate Disclosure routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/climate_disclosure_web.py app/main.py tests/test_v180_climate_disclosure_routing.py docs/architecture/V1_8_CLIMATE_DISCLOSURE_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract climate disclosure HTTP"
          git push origin HEAD:refactor/v1-8-0-strategic-surfaces
