name: V2.0 · Materializar autoridad de etapa

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-stage-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      SEED_DEMO: "true"
      SCHEDULER_ENABLED: "0"
      STRUCTURED_LOGGING: "0"
      PBKDF2_ITERATIONS: "10000"
      INSTANCE_DIR: /tmp/cth-stage-authority-v20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Separar autoridad de progreso y etapa
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          database = Path('app/database.py')
          text = database.read_text(encoding='utf-8')
          old = '''    inventory.progress = round(sum(progresses) / len(progresses)) if progresses else 0\n    if not inventory.locked and inventory.status != "Cerrado":\n        inventory.current_stage = "Recolección" if inventory.progress < 100 else "Cálculo"\n'''
          new = '''    inventory.progress = round(sum(progresses) / len(progresses)) if progresses else 0\n    generic_stages = {"", "Recolección", "Cálculo"}\n    current_stage = str(inventory.current_stage or "")\n    if not inventory.locked and inventory.status != "Cerrado" and current_stage in generic_stages:\n        inventory.current_stage = "Recolección" if inventory.progress < 100 else "Cálculo"\n'''
          if text.count(old) != 1:
              raise SystemExit('Bloque de autoridad de etapa no encontrado exactamente una vez')
          database.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_v200_refresh_progress.py')
          source = tests.read_text(encoding='utf-8')
          marker = '''def test_inventory_progress_refresh_preserves_closed_stage() -> None:\n'''
          if source.count(marker) != 1:
              raise SystemExit('Test de etapa cerrada no encontrado')
          addition = '''\n\ndef test_inventory_progress_refresh_preserves_correction_stage() -> None:\n    with SessionLocal() as session:\n        inventory = session.scalar(\n            select(Inventory)\n            .where(Inventory.name == "Inventario corporativo 2025")\n            .options(selectinload(Inventory.sources))\n        )\n        assert inventory is not None\n        inventory.status = "Borrador"\n        inventory.locked = False\n        inventory.current_stage = "Corrección"\n        for source in inventory.sources:\n            source.progress = 100\n        session.flush()\n\n        refresh_inventory_progress(session, inventory)\n\n        assert inventory.progress == 100\n        assert inventory.current_stage == "Corrección"\n\n'''
          tests.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
          python -m py_compile app/database.py
          rm -rf "${INSTANCE_DIR}"
          pytest -q \
            tests/test_v160_inventory_lifecycle.py::test_closed_inventory_requires_new_version_for_corrections \
            tests/test_v200_refresh_progress.py
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-stage-authority.yml
          git add app/database.py tests/test_v200_refresh_progress.py
          git commit -m "fix(v2.0): preserve lifecycle stage while refreshing progress"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
