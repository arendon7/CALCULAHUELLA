name: Actualizar manifiesto hotfix Render

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/runtime_python.sh
      - app/storage.py
      - app/db/models/core.py
      - migrations/versions/20260806_0037_expand_password_hash.py
      - .github/workflows/refresh-render-hotfix-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar hashes modificados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFIESTO_SHA256_CANONICO.txt')
          targets = {
              'Dockerfile': Path('Dockerfile'),
              'scripts/runtime_python.sh': Path('scripts/runtime_python.sh'),
              'app/storage.py': Path('app/storage.py'),
              'app/db/models/core.py': Path('app/db/models/core.py'),
              'migrations/versions/20260806_0037_expand_password_hash.py': Path('migrations/versions/20260806_0037_expand_password_hash.py'),
          }
          hashes = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in targets.items()}
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split('  ', 1)
              entries[rel] = digest
          entries.update(hashes)
          manifest.write_text(
              ''.join(f'{entries[rel]}  {rel}\n' for rel in sorted(entries)),
              encoding='utf-8',
          )
          PY
      - name: Publicar manifiesto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFIESTO_SHA256_CANONICO.txt
          if git diff --cached --quiet; then
            echo "El manifiesto ya estaba actualizado."
            exit 0
          fi
          git commit -m "chore: actualizar manifiesto del hotfix PostgreSQL"
          git push origin HEAD:main
