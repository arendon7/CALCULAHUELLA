name: Actualizar manifiesto hotfix Render

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start_prod.sh
      - scripts/runtime_python.sh
      - app/storage.py
      - app/db/models/core.py
      - app/db/models/governance.py
      - migrations/versions/20260806_0037_expand_password_hash.py
      - migrations/versions/20260806_0038_expand_methodology_document_status.py
      - tests/test_postgresql_seed_lengths.py
      - .github/workflows/refresh-render-hotfix-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar hashes modificados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFIESTO_SHA256_CANONICO.txt')
          target_names = [
              'Dockerfile',
              'start_prod.sh',
              'scripts/runtime_python.sh',
              'app/storage.py',
              'app/db/models/core.py',
              'app/db/models/governance.py',
              'migrations/versions/20260806_0037_expand_password_hash.py',
              'migrations/versions/20260806_0038_expand_methodology_document_status.py',
              'tests/test_postgresql_seed_lengths.py',
          ]
          targets = {name: Path(name) for name in target_names}
          missing = [name for name, path in targets.items() if not path.is_file()]
          if missing:
              raise SystemExit(f'Archivos requeridos ausentes: {missing}')
          hashes = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in targets.items()}
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split('  ', 1)
              entries[rel] = digest
          entries.update(hashes)
          manifest.write_text(
              ''.join(f'{entries[rel]}  {rel}\n' for rel in sorted(entries)),
              encoding='utf-8',
          )
          PY
      - name: Verificar manifiesto completo
        shell: bash
        run: python tools/verify_canonical.py
      - name: Publicar manifiesto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFIESTO_SHA256_CANONICO.txt
          if git diff --cached --quiet; then
            echo "El manifiesto ya estaba actualizado."
            exit 0
          fi
          git commit -m "chore: cerrar manifiesto del hotfix Render"
          git push origin HEAD:main
