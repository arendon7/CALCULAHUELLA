name: Materialize V1.7 customer success routing

on:
  push:
    branches: [refactor/v1-7-0-domain-surfaces]
    paths:
      - .github/workflows/materialize-v17-customer-success-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-7-0-domain-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract customer success HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _require_customer_success_view(user: dict[str, object]) -> None:\n'
          route_marker = '@app.get("/exito-cliente", response_class=HTMLResponse)\n'
          end_marker = 'def _require_impact_view(user: dict[str, object]) -> None:\n'
          if source.count(start_marker) != 1 or source.count(route_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('customer success boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 8:
              raise SystemExit(f"expected 8 customer success routes, found {block.count('@app.')}")
          route_start = block.index(route_marker)
          helper_block = block[:route_start].rstrip() + '\n'
          route_block = block[route_start:].rstrip() + '\n'

          header = '''from __future__ import annotations\n\nfrom datetime import UTC, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .customer_success import account_metrics, refresh_account_health, sync_renewal_opportunity\nfrom .database import add_audit, get_db\nfrom .db.models import (\n    AccountHealthSnapshot,\n    CustomerSuccessProfile,\n    Inventory,\n    RenewalOpportunity,\n    SuccessCommitment,\n    ValueMilestone,\n)\n\n\n'''
          indented_routes = ''.join(('    ' + line if line.strip() else line) for line in route_block.splitlines(keepends=True))
          module = header + helper_block + '\n\ndef register_customer_success_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n) -> None:\n' + indented_routes
          Path('app/customer_success_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .commercial_operations_web import register_commercial_operations_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('commercial operations import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .customer_success_web import register_customer_success_routes\n', 1)
          register_anchor = '''register_commercial_operations_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date, format_number\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('commercial operations registration anchor missing')
          registration = '''register_customer_success_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nCUSTOMER_SUCCESS_ROUTES = {\n    ("GET", "/exito-cliente"),\n    ("POST", "/exito-cliente/perfil"),\n    ("POST", "/exito-cliente/salud/recalcular"),\n    ("POST", "/exito-cliente/hitos/nuevo"),\n    ("POST", "/exito-cliente/hitos/{milestone_id}/estado"),\n    ("POST", "/exito-cliente/compromisos/nuevo"),\n    ("POST", "/exito-cliente/compromisos/{commitment_id}/estado"),\n    ("POST", "/exito-cliente/renovacion/{renewal_id}/actualizar"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v170_customer_success_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/customer_success_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/exito-cliente"' not in main_source\n    assert '@app.post("/exito-cliente/' not in main_source\n    assert "register_customer_success_routes(" in main_source\n    assert module_source.count("@app.") == 8\n    assert "def _require_customer_success_view" in module_source\n    assert "def _require_impact_view" not in module_source\n    assert "refresh_account_health" in module_source\n    assert "sync_renewal_opportunity" in module_source\n\n\ndef test_v170_customer_success_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in CUSTOMER_SUCCESS_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == CUSTOMER_SUCCESS_ROUTES\n    assert len(actual) == len(CUSTOMER_SUCCESS_ROUTES)\n\n\ndef test_v170_customer_success_view_and_mutation_permissions_remain_intact():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        page = client.get("/exito-cliente")\n        assert page.status_code == 200\n        assert "Salud y éxito de la cuenta" in page.text\n        denied = client.post("/exito-cliente/salud/recalcular", follow_redirects=False)\n        assert denied.status_code == 403\n'''
          Path('tests/test_v170_customer_success_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.7 · Customer Success HTTP\n\n## Autoridad\n\n`app/customer_success_web.py` pasa a ser la autoridad HTTP de ocho contratos de éxito del cliente: vista de cuenta, perfil, recálculo de salud, hitos, compromisos y estrategia de renovación.\n\n## Dominio preservado\n\n`app/customer_success.py` continúa siendo la autoridad de `account_metrics`, `refresh_account_health` y `sync_renewal_opportunity`. El refactor no modifica ponderaciones, puntajes, reglas de riesgo ni probabilidad de renovación.\n\n## Acceso y aislamiento\n\nLa vista sigue disponible para roles con `view_customer_success` o `manage_customer_success`; las mutaciones exigen `manage_customer_success`. Hitos, compromisos, inventarios y renovaciones siguen restringidos a la organización activa.\n\n## Gates\n\nLos contratos históricos V0.17 protegen datos semilla, lectura del cliente, actualización de perfil/salud, ciclo de hitos, ciclo de compromisos y estrategia de renovación. El contrato V1.7 protege autoridad HTTP, unicidad y permisos de lectura/escritura.\n'''
          Path('docs/architecture/V1_7_CUSTOMER_SUCCESS_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/customer_success_web.py app/main.py tests/test_v170_customer_success_routing.py
          git diff --check
      - name: Targeted V1.7 customer success authority
        run: pytest -q tests/test_v170_customer_success_routing.py
      - name: Historical V0.17 customer success contracts
        run: pytest -q tests/test_app.py -k "v017"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit customer success routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/customer_success_web.py app/main.py tests/test_v170_customer_success_routing.py docs/architecture/V1_7_CUSTOMER_SUCCESS_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract customer success HTTP"
          git push origin HEAD:refactor/v1-7-0-domain-surfaces
