name: One-shot · Remote staging certification

on:
  push:
    branches:
      - ops/remote-staging-cert-a20688c9

permissions:
  contents: read

jobs:
  certify:
    name: Render staging · contrato remoto no destructivo
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_BASE_URL: https://calcula-tu-huella-arendon7-preview.onrender.com
      REMOTE_STAGING_ARTIFACT_DIR: remote-staging-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar cliente HTTP pinneado
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx==0.28.1
      - name: Certificar staging remoto sin mutar datos
        run: python -m scripts.remote_staging_contract
      - name: Publicar evidencia remota
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-staging-live-evidence-a20688c9
          path: remote-staging-artifacts/
          if-no-files-found: warn
          retention-days: 14
