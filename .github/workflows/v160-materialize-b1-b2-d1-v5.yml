name: V1.6 · materializar B1 B2 D1 · v5 diferencial

on:
  push:
    branches:
      - refactor/v1-6-0-consolidation
    paths:
      - .github/workflows/v160-materialize-b1-b2-d1-v5.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Capturar baseline real de suite completa
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/cth-baseline HEAD
          pushd /tmp/cth-baseline
          set +e
          python -m pytest -q > /tmp/cth-baseline.log 2>&1
          BASELINE_RC=$?
          set -e
          popd
          grep '^FAILED ' /tmp/cth-baseline.log | sed 's/^FAILED //' | sed 's/ - .*//' | sort -u > /tmp/cth-baseline-failed.txt || true
          echo "Baseline pytest rc: $BASELINE_RC"
          echo "Fallos baseline: $(wc -l < /tmp/cth-baseline-failed.txt)"
          cat /tmp/cth-baseline-failed.txt

      - name: Aplicar refactors y reconciliación de contratos
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            docs/architecture/patches/V1_6_B1_PUBLIC_ROUTES_CANONICAL.patch \
            docs/architecture/patches/V1_6_B2_AUTH_ROUTES_CANONICAL.patch \
            docs/architecture/patches/V1_6_D1_AUDIT_EXTRACTION_CANONICAL.patch \
            docs/architecture/patches/V1_6_TEST_CONTRACT_RECONCILIATION.patch
          do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Verificar alcance y reducción de deuda
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED=$'app/database.py\napp/main.py\ntests/test_app.py\ntests/test_v160_public_canonical_eight_stages.py'
          printf 'Archivos modificados:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$(wc -l < app/main.py)" -le 4569
          test "$(wc -l < app/database.py)" -le 2096
          python -m compileall -q app tests
          python scripts/audit_architecture.py --enforce

      - name: Regresión dirigida B1 B2 D1 y contratos públicos
        run: |
          python -m pytest -q \
            tests/test_app.py \
            tests/test_v024_security_hardening.py \
            tests/test_iteration18_public_contract.py \
            tests/test_v0461_consolidation_audit.py \
            tests/test_v160_architecture_governance.py \
            tests/test_v160_landing_diagnosis_handoff.py \
            tests/test_v160_public_canonical_eight_stages.py

      - name: Smoke integral
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300

      - name: Suite completa diferencial sin regresiones nuevas
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q > /tmp/cth-after.log 2>&1
          AFTER_RC=$?
          set -e
          grep '^FAILED ' /tmp/cth-after.log | sed 's/^FAILED //' | sed 's/ - .*//' | sort -u > /tmp/cth-after-failed.txt || true
          BASELINE_COUNT=$(wc -l < /tmp/cth-baseline-failed.txt)
          AFTER_COUNT=$(wc -l < /tmp/cth-after-failed.txt)
          echo "After pytest rc: $AFTER_RC"
          echo "Baseline failures: $BASELINE_COUNT"
          echo "After failures: $AFTER_COUNT"
          echo "Fallos después del refactor:"
          cat /tmp/cth-after-failed.txt
          NEW_FAILURES="$(comm -13 /tmp/cth-baseline-failed.txt /tmp/cth-after-failed.txt)"
          if [ -n "$NEW_FAILURES" ]; then
            echo "NUEVAS REGRESIONES DETECTADAS:"
            printf '%s\n' "$NEW_FAILURES"
            exit 1
          fi
          test "$AFTER_COUNT" -le "$BASELINE_COUNT"

      - name: Materializar solamente con todos los gates verdes
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force /tmp/cth-baseline || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/database.py tests/test_app.py tests/test_v160_public_canonical_eight_stages.py
          git commit -m "refactor(v1.6): materializar B1+B2+D1 y reconciliar contratos"
          git push origin HEAD:refactor/v1-6-0-consolidation
