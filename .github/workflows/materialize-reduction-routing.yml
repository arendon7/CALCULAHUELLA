name: Materialize reduction routing

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-reduction-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract reduction HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path("app/main.py")
          source = main_path.read_text(encoding="utf-8")
          start_marker = '@app.post("/reduccion/metas/nueva")\n'
          end_marker = '@app.get("/cadena-valor", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("reduction route boundaries are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + "\n"
          route_count = block.count("@app.")
          if route_count != 8:
              raise SystemExit(f"expected 8 reduction routes, found {route_count}")

          header = '''from __future__ import annotations\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse, Response\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .analytics import reduction_summary\nfrom .database import EmissionTarget, Inventory, ReductionAction, add_audit, get_db\nfrom .reduction_portfolio import build_portfolio_workbook, portfolio_json, portfolio_summary\n\n\ndef register_reduction_routes(\n    app,\n    templates,\n    common_context,\n    require_user,\n    ensure_capability,\n    set_flash,\n    parse_date,\n    get_inventory,\n    get_source_for_user,\n    ensure_inventory_editable,\n    inventory_metrics,\n) -> None:\n'''
          indented = "".join(("    " + line if line.strip() else line) for line in block.splitlines(keepends=True))
          Path("app/reduction_web.py").write_text(header + indented, encoding="utf-8")

          source = source[:start] + source[end:]
          import_anchor = "from .reports_web import register_report_routes\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("reports_web import anchor missing")
          source = source.replace(import_anchor, import_anchor + "from .reduction_web import register_reduction_routes\n", 1)
          register_anchor = '''register_report_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, get_inventory\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit("report route registration anchor missing")
          register = register_anchor + '''register_reduction_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash,\n    parse_date, get_inventory, get_source_for_user, ensure_inventory_editable, inventory_metrics,\n)\n'''
          source = source.replace(register_anchor, register, 1)
          main_path.write_text(source, encoding="utf-8")

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nREDUCTION_ROUTES = {\n    ("POST", "/reduccion/metas/nueva"),\n    ("POST", "/reduccion/metas/{target_id}/actualizar"),\n    ("POST", "/reduccion/metas/{target_id}/sincronizar"),\n    ("POST", "/reduccion/acciones/nueva"),\n    ("POST", "/reduccion/acciones/{action_id}/actualizar"),\n    ("GET", "/reduccion"),\n    ("GET", "/api/reduccion/resumen"),\n    ("GET", "/reduccion/exportar.xlsx"),\n}\n\n\ndef _login(client: TestClient) -> None:\n    response = client.post(\n        "/login",\n        data={"email": "consultor@calculatuhuella.local", "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v160_reduction_routes_have_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/reduction_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/reduccion"' not in main_source\n    assert '@app.post("/reduccion/' not in main_source\n    assert 'register_reduction_routes(' in main_source\n    assert module_source.count("@app.") == 8\n    assert "portfolio_summary" in module_source\n    assert "from .reporting" not in module_source\n\n\ndef test_v160_reduction_route_contract_is_unique_and_complete():\n    actual = []\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path and (path.startswith("/reduccion") or path.startswith("/api/reduccion")):\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == REDUCTION_ROUTES\n    assert len(actual) == len(REDUCTION_ROUTES)\n\n\ndef test_v160_reporting_and_reduction_surfaces_coexist_after_extraction():\n    with TestClient(app) as client:\n        _login(client)\n        assert client.get("/reportes").status_code == 200\n        assert client.get("/reportes/consultoria").status_code == 200\n        assert client.get("/reduccion").status_code == 200\n        assert client.get("/api/reduccion/resumen").status_code == 200\n'''
          Path("tests/test_v160_reduction_routing.py").write_text(test, encoding="utf-8")

          doc = '''# V1.6 · Reporting / reduction routing\n\n## Estado previo\n\nLa superficie HTTP de reporting ya tiene autoridad en `app/reports_web.py`. Ocho rutas de reducción continuaban embebidas en `app/main.py`.\n\n## Corte materializado\n\n- Las 8 rutas `/reduccion*` pasan a `app/reduction_web.py`.\n- `app/main.py` conserva únicamente el registro del módulo y las fachadas/helpers compartidos que ya existían.\n- La lógica de portafolio permanece en `app/reduction_portfolio.py`.\n- La generación de informes permanece en `app/reports_web.py`, `app/reporting.py`, `app/report_consulting.py` y servicios/repositorios existentes.\n- No se modifican fórmulas, emisiones, factores, GWP, cálculos, estados de aprobación ni contenido de reportes.\n\n## Contratos\n\n1. Exactamente 8 rutas HTTP de reducción, sin duplicados.\n2. `/reportes` y `/reportes/consultoria` siguen operativos.\n3. `/reduccion` y `/api/reduccion/resumen` siguen operativos.\n4. Suite V0.48 protege semántica del portafolio y exportación.\n5. Suite V0.55 protege reporting consultivo.\n6. Suite completa, arquitectura y smoke deben quedar verdes antes del commit.\n'''
          Path("docs/architecture/V1_6_REPORTING_REDUCTION_ROUTING.md").write_text(doc, encoding="utf-8")
          PY
          python -m py_compile app/main.py app/reduction_web.py tests/test_v160_reduction_routing.py
          git diff --check
      - name: Targeted routing contracts
        run: >-
          pytest -q
          tests/test_v160_reduction_routing.py
          tests/test_v048_reduction_portfolio.py
          tests/test_v055_consulting_reports.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit reduction routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/reduction_web.py tests/test_v160_reduction_routing.py docs/architecture/V1_6_REPORTING_REDUCTION_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract reduction HTTP surface"
          git push origin HEAD:refactor/v1-6-0-consolidation
