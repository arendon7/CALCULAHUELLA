name: Diagnose reporting C1

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/diagnose-reporting-c1.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Reapply exact C1 workspace patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/materialize-reporting-c1.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'materialize-reporting-c1-inline.py', 'exec'), {})
          PY
          git diff --check
      - name: Full pytest with diagnostic annotation
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee /tmp/pytest-c1.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-c1.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-12000:]
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=C1 full regression failure::{escaped}')
          PY
          fi
          exit "$status"
