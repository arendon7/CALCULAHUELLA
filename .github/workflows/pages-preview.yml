name: Publicar vista previa estática

on:
  push:
    branches:
      - integration/canonical
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      SESSION_SECRET: pages-preview-session-secret
      DATABASE_URL: sqlite+pysqlite:///./instance/pages-preview.sqlite3
      SEED_DEMO: "true"
      OPEN_BROWSER: "0"
      CSRF_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      DEPLOYMENT_STRICT: "false"
      SESSION_HTTPS_ONLY: "false"
      HOST: 127.0.0.1
      PORT: "8765"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: Preparar base demo
        run: |
          mkdir -p instance
          rm -f instance/pages-preview.sqlite3
          python -m alembic upgrade head

      - name: Iniciar aplicación
        run: |
          python run.py > instance/pages-preview.log 2>&1 &
          echo $! > instance/pages-preview.pid
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat instance/pages-preview.log
            exit 1
          fi

      - name: Construir snapshot
        run: |
          python scripts/preview/build_static_preview.py \
            --base-url http://127.0.0.1:8765 \
            --output _site \
            --commit "${GITHUB_SHA}" \
            --branch "${GITHUB_REF_NAME}"
          test -f _site/index.html
          test -f _site/login/index.html
          test -f _site/preview-status.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
