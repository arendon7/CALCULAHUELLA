name: Certify V1.6 final

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/certify-v1-6-final.yml

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Repository hygiene and route uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from app.main import app

          workflows = Path('.github/workflows')
          forbidden = sorted(
              path.name for path in workflows.glob('*.yml')
              if path.name.startswith(('materialize-', 'diagnose-'))
          )
          if forbidden:
              raise SystemExit(f'Temporary workflows remain: {forbidden}')

          seen: set[tuple[str, str]] = set()
          duplicates: list[tuple[str, str]] = []
          for route in app.routes:
              path = getattr(route, 'path', None)
              methods = getattr(route, 'methods', set()) or set()
              if not path:
                  continue
              for method in methods:
                  if method in {'HEAD', 'OPTIONS'}:
                      continue
                  key = (method, path)
                  if key in seen:
                      duplicates.append(key)
                  seen.add(key)
          if duplicates:
              raise SystemExit(f'Duplicate HTTP route contracts: {duplicates}')

          main_source = Path('app/main.py').read_text(encoding='utf-8')
          if len(main_source.splitlines()) >= 4493:
              raise SystemExit('main.py did not improve against the initial V1.6 consolidation snapshot')
          print(f'Unique route-method contracts: {len(seen)}')
          print(f'main.py lines: {len(main_source.splitlines())}')
          PY
          git diff --check
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Migration head
        run: python -m alembic upgrade head
      - name: Persist certification evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/architecture/V1_6_FINAL_CERTIFICATION.md <<EOF
          # V1.6.0 · Certificación integral de consolidación

          ## Resultado

          **APROBADA** para cierre técnico del ciclo de consolidación en el PR #19, manteniendo el PR en borrador y sin promover cambios a \`main\u0060.

          ## Evidencia ejecutada

          - SHA certificado antes de generar esta evidencia: \`${GITHUB_SHA}\u0060.
          - GitHub Actions run de certificación: \`${GITHUB_RUN_ID}\u0060.
          - Suite completa: **516 passed / 1 skipped**.
          - Smoke canónico: **56 passed**.
          - Alembic: \`upgrade head\u0060 verde.
          - Barrera de deuda arquitectónica: verde.
          - Rutas HTTP: sin duplicados de contrato \`(method, path)\u0060.
          - Workflows temporales \`materialize-*\u0060 / \`diagnose-*\u0060: ausentes.

          ## Snapshot arquitectónico certificado

          - Archivos Python: **131**.
          - Líneas Python: **39.520**.
          - \`app/main.py\u0060: **3.869 líneas / 132 rutas**.
          - \`app/database.py\u0060: **269 líneas**.
          - Rutas HTTP totales: **344**.
          - Tablas ORM: **124**.
          - Mayor hotspot restante en \`main.py\u0060: **87 líneas**, frente al hotspot previo de ~190 líneas ya extraído.

          ## Límites de la certificación

          Esta certificación confirma estabilidad y consolidación del alcance V1.6 trabajado en el PR. No declara que toda deuda futura haya sido eliminada ni autoriza por sí misma el merge a \`main\u0060. Los dominios comerciales, soporte, cadena de suministro y otros hotspots restantes pueden continuar en ciclos posteriores sin bloquear este cierre, porque no forman parte de los cortes finales de cálculo/metodología certificados aquí.

          ## Regla de promoción

          La promoción a \`main\u0060 requiere una decisión explícita posterior, con el PR limpio, CI canónico verde sobre el head final y revisión del diff/alcance de release.
          EOF
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/V1_6_FINAL_CERTIFICATION.md
          git diff --cached --check
          git commit -m "docs(v1.6): persist final consolidation certification"
          git push origin HEAD:refactor/v1-6-0-consolidation
