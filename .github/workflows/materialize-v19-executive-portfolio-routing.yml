name: Materialize V1.9 executive portfolio routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-executive-portfolio-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Executive Portfolio HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/direccion-ejecutiva", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/cumplimiento", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('executive portfolio boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 1:
              raise SystemExit(f"expected 1 executive portfolio route, found {block.count('@app.')}")
          if '_compliance_score(' not in block:
              raise SystemExit('shared compliance score dependency missing')

          header = '''from __future__ import annotations\n\nfrom fastapi import Depends, Request\nfrom fastapi.responses import HTMLResponse\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import get_db\nfrom .db.models import (\n    ComplianceAssessment, DocumentControlRecord, EmissionSource, Inventory,\n    OrganizationMembership, ReductionAction, ReviewObservation,\n)\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_executive_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, _compliance_score\n) -> None:\n' + indented
          Path('app/executive_portfolio_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .portfolio_web import register_portfolio_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('portfolio import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .executive_portfolio_web import register_executive_portfolio_routes\n', 1)
          register_anchor = '''register_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('portfolio registration anchor missing')
          registration = '''register_executive_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, _compliance_score\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login", data={"email": email, "password": "Demo2026!"}, follow_redirects=False\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_executive_portfolio_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/executive_portfolio_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/direccion-ejecutiva"' not in main_source\n    assert "register_executive_portfolio_routes(" in main_source\n    assert module_source.count("@app.") == 1\n    assert "_compliance_score" in module_source\n    assert "OrganizationMembership" in module_source\n    assert '@app.get("/cumplimiento"' not in module_source\n\n\ndef test_v190_executive_portfolio_route_contract_is_unique():\n    actual = []\n    for route in app.routes:\n        if getattr(route, "path", None) == "/direccion-ejecutiva":\n            actual.extend(method for method in (getattr(route, "methods", set()) or set()) if method == "GET")\n    assert actual == ["GET"]\n\n\ndef test_v190_executive_portfolio_access_remains_capability_bound():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/direccion-ejecutiva").status_code == 403\n        client.post("/logout")\n        _login(client, "consultor@calculatuhuella.local")\n        assert client.get("/direccion-ejecutiva").status_code == 200\n'''
          Path('tests/test_v190_executive_portfolio_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Executive Portfolio HTTP\n\n## Autoridad\n\n`app/executive_portfolio_web.py` pasa a ser la autoridad HTTP de `/direccion-ejecutiva`.\n\n## Dependencia transitoria consciente\n\nLa ruta consume `_compliance_score` por inyección porque ese helper sigue compartido con `/cumplimiento`. No se duplica ni se mueve todavía; el siguiente corte de Compliance retirará esa dependencia residual de `main.py`.\n\n## Semántica preservada\n\nSe mantienen emisiones del último inventario, cumplimiento, observaciones abiertas, reducción esperada, número de documentos y agregados de portafolio para todas las organizaciones accesibles.\n\n## Gate\n\nV0.13 protege que ambas organizaciones demo continúen presentes y que el indicador de cumplimiento promedio se renderice. El contrato V1.9 protege autoridad HTTP, unicidad y permisos.\n'''
          Path('docs/architecture/V1_9_EXECUTIVE_PORTFOLIO_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/executive_portfolio_web.py app/main.py tests/test_v190_executive_portfolio_routing.py
          git diff --check
      - name: Targeted V1.9 Executive Portfolio authority
        run: pytest -q tests/test_v190_executive_portfolio_routing.py
      - name: Historical V0.13 executive portfolio contract
        run: pytest -q tests/test_app.py -k "v013_executive_portfolio_contains_both_organizations"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Executive Portfolio routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/executive_portfolio_web.py app/main.py tests/test_v190_executive_portfolio_routing.py docs/architecture/V1_9_EXECUTIVE_PORTFOLIO_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract executive portfolio HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
