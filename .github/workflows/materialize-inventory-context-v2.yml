name: Materialize inventory context V2

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-inventory-context-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply reviewed inventory context extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          materializer = Path('.github/workflows/materialize-inventory-context.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          start = materializer.index(opening) + len(opening)
          end = materializer.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(materializer[start:end]), 'inventory-context-v1.py', 'exec'), {})
          PY
          python -m py_compile app/inventory_context.py app/main.py tests/test_v160_inventory_context.py
          git diff --check
      - name: Targeted inventory context contracts
        run: >-
          pytest -q
          tests/test_v160_inventory_context.py
          tests/test_v160_user_context.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit inventory context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inventory_context.py app/main.py tests/test_v160_inventory_context.py docs/architecture/V1_6_INVENTORY_CONTEXT.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(inventory): extract shared context authority"
          git push origin HEAD:refactor/v1-6-0-consolidation
