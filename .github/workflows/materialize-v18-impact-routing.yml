name: Materialize V1.8 impact intelligence routing

on:
  push:
    branches: [refactor/v1-8-0-strategic-surfaces]
    paths:
      - .github/workflows/materialize-v18-impact-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-8-0-strategic-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Impact Intelligence HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _require_impact_view(user: dict[str, object]) -> None:\n'
          route_marker = '@app.get("/inteligencia-impacto", response_class=HTMLResponse)\n'
          end_marker = 'def _require_climate_risk_view(user: dict[str, object]) -> None:\n'
          if source.count(start_marker) != 1 or source.count(route_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('impact boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 5:
              raise SystemExit(f"expected 5 impact routes, found {block.count('@app.')}")
          route_start = block.index(route_marker)
          helper_block = block[:route_start].rstrip() + '\n'
          route_block = block[route_start:].rstrip() + '\n'

          header = '''from __future__ import annotations\n\nfrom io import BytesIO\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse, Response\nfrom openpyxl import Workbook\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .database import add_audit, get_db\nfrom .db.models import BenchmarkReference, ImpactSnapshot, Organization\nfrom .impact_intelligence import compare_benchmarks, impact_metrics, portfolio_comparison, refresh_impact_snapshot\n\n\n'''
          indented_routes = ''.join(('    ' + line if line.strip() else line) for line in route_block.splitlines(keepends=True))
          module = header + helper_block + '\n\ndef register_impact_intelligence_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n) -> None:\n' + indented_routes
          Path('app/impact_intelligence_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .saas_admin_web import register_saas_admin_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('SaaS admin import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .impact_intelligence_web import register_impact_intelligence_routes\n', 1)
          register_anchor = '''register_saas_admin_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('SaaS admin registration anchor missing')
          registration = '''register_impact_intelligence_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nIMPACT_ROUTES = {\n    ("GET", "/inteligencia-impacto"),\n    ("POST", "/inteligencia-impacto/recalcular"),\n    ("POST", "/inteligencia-impacto/benchmarks/nuevo"),\n    ("POST", "/inteligencia-impacto/benchmarks/{reference_id}/estado"),\n    ("GET", "/inteligencia-impacto/exportar.xlsx"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v180_impact_intelligence_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/impact_intelligence_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/inteligencia-impacto"' not in main_source\n    assert '@app.post("/inteligencia-impacto/' not in main_source\n    assert "register_impact_intelligence_routes(" in main_source\n    assert module_source.count("@app.") == 5\n    assert "def _require_impact_view" in module_source\n    assert "def _require_climate_risk_view" not in module_source\n    assert "impact_metrics" in module_source\n    assert "refresh_impact_snapshot" in module_source\n    assert "compare_benchmarks" in module_source\n    assert "portfolio_comparison" in module_source\n\n\ndef test_v180_impact_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in IMPACT_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == IMPACT_ROUTES\n    assert len(actual) == len(IMPACT_ROUTES)\n\n\ndef test_v180_impact_client_stays_read_only():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        page = client.get("/inteligencia-impacto")\n        assert page.status_code == 200\n        denied = client.post("/inteligencia-impacto/recalcular", follow_redirects=False)\n        assert denied.status_code == 403\n'''
          Path('tests/test_v180_impact_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.8 · Impact Intelligence HTTP\n\n## Autoridad\n\n`app/impact_intelligence_web.py` pasa a ser la autoridad HTTP de cinco contratos: panel de impacto, recálculo de snapshot, alta de benchmark, cambio de estado de benchmark y exportación XLSX.\n\n## Dominio preservado\n\n`app/impact_intelligence.py` continúa siendo la autoridad de `impact_metrics`, `refresh_impact_snapshot`, `compare_benchmarks` y `portfolio_comparison`. No se alteran puntajes, intensidades, cobertura de evidencia, ahorro, reducción esperada ni reglas de comparación.\n\n## Acceso\n\nLa lectura continúa disponible para `view_impact` o `manage_impact`; las mutaciones exigen `manage_impact`. Benchmarks y snapshots siguen limitados a la organización activa.\n\n## Gates\n\nLos contratos históricos V0.18 protegen semilla, lectura cliente, recálculo, creación/archivo de benchmark y exportación Excel. El contrato V1.8 protege autoridad HTTP, unicidad y lectura sin permisos de mutación.\n'''
          Path('docs/architecture/V1_8_IMPACT_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/impact_intelligence_web.py app/main.py tests/test_v180_impact_routing.py
          git diff --check
      - name: Targeted V1.8 impact authority
        run: pytest -q tests/test_v180_impact_routing.py
      - name: Historical V0.18 impact contracts
        run: pytest -q tests/test_app.py -k "v018"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Impact Intelligence routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/impact_intelligence_web.py app/main.py tests/test_v180_impact_routing.py docs/architecture/V1_8_IMPACT_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract impact intelligence HTTP"
          git push origin HEAD:refactor/v1-8-0-strategic-surfaces
