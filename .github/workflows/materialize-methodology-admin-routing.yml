name: Materialize methodology admin routing

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-methodology-admin-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract methodology administration HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path("app/main.py")
          source = main_path.read_text(encoding="utf-8")
          start_marker = '@app.get("/metodologia", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/analisis", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("methodology admin route boundaries are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + "\n"
          if block.count("@app.") != 4:
              raise SystemExit(f"expected 4 methodology admin routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nimport math\nfrom datetime import UTC, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .calculations import normalize_factor_output\nfrom .database import add_audit, get_db\nfrom .db.models import (\n    EmissionFactor,\n    EmissionFactorVersion,\n    Gas,\n    UnitConversion,\n    UnitDefinition,\n)\n\n\ndef register_methodology_admin_routes(\n    app,\n    templates,\n    common_context,\n    require_user,\n    ensure_capability,\n    set_flash,\n    allowed_units,\n) -> None:\n    ALLOWED_UNITS = allowed_units\n'''
          indented = "".join(("    " + line if line.strip() else line) for line in block.splitlines(keepends=True))
          Path("app/methodology_admin_web.py").write_text(header + indented, encoding="utf-8")

          source = source[:start] + source[end:]
          import_anchor = "from .calculation_web import register_calculation_routes\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("calculation import anchor missing")
          source = source.replace(
              import_anchor,
              import_anchor + "from .methodology_admin_web import register_methodology_admin_routes\n",
              1,
          )
          register_anchor = '''register_calculation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash,\n    get_inventory, ensure_inventory_editable,\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit("calculation registration anchor missing")
          source = source.replace(
              register_anchor,
              register_anchor + '''register_methodology_admin_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, ALLOWED_UNITS\n)\n''',
              1,
          )
          main_path.write_text(source, encoding="utf-8")

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nfrom app.db.base import SessionLocal\nfrom app.db.models import EmissionFactor, EmissionFactorVersion, Gas, UnitConversion\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nMETHODOLOGY_ADMIN_ROUTES = {\n    ("GET", "/metodologia"),\n    ("POST", "/metodologia/factores/nuevo"),\n    ("POST", "/metodologia/factores/{version_id}/estado"),\n    ("POST", "/metodologia/conversiones/nueva"),\n}\n\n\ndef _login(client: TestClient, email: str = "consultor@calculatuhuella.local") -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v160_methodology_admin_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/methodology_admin_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/metodologia"' not in main_source\n    assert '@app.post("/metodologia/factores/nuevo"' not in main_source\n    assert '@app.post("/metodologia/factores/{version_id}/estado"' not in main_source\n    assert '@app.post("/metodologia/conversiones/nueva"' not in main_source\n    assert "register_methodology_admin_routes(" in main_source\n    assert module_source.count("@app.") == 4\n    assert "normalize_factor_output" in module_source\n    assert "def normalize_factor_output(" not in module_source\n\n\ndef test_v160_methodology_admin_route_contract_is_unique_and_complete():\n    actual = []\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in {item[1] for item in METHODOLOGY_ADMIN_ROUTES}:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == METHODOLOGY_ADMIN_ROUTES\n    assert len(actual) == len(METHODOLOGY_ADMIN_ROUTES)\n\n\ndef test_v160_methodology_page_and_factor_validation_remain_operational():\n    with TestClient(app) as client:\n        _login(client)\n        page = client.get("/metodologia")\n        assert page.status_code == 200\n        with SessionLocal() as session:\n            gas = session.scalar(select(Gas).order_by(Gas.id))\n            assert gas is not None\n            gas_id = gas.id\n        invalid = client.post(\n            "/metodologia/factores/nuevo",\n            data={\n                "name": "Factor inválido V1.6",\n                "activity_type": "Prueba",\n                "gas_id": gas_id,\n                "value": "1",\n                "input_unit": "unidad-no-autorizada",\n                "output_unit": "kg gas",\n                "version": "1.0",\n                "source_organization": "Prueba",\n                "publication_year": "2026",\n            },\n            follow_redirects=False,\n        )\n        assert invalid.status_code == 400\n        assert "Unidad no autorizada" in invalid.text\n\n\ndef test_v160_methodology_conversion_contract_remains_dimension_safe():\n    with SessionLocal() as session:\n        before = list(session.scalars(select(UnitConversion)))\n        existing_count = len(before)\n    with TestClient(app) as client:\n        _login(client)\n        invalid = client.post(\n            "/metodologia/conversiones/nueva",\n            data={\n                "from_unit": "kg",\n                "to_unit": "kWh",\n                "multiplier": "1",\n                "source": "Prueba incompatible",\n            },\n            follow_redirects=False,\n        )\n        assert invalid.status_code == 400\n    with SessionLocal() as session:\n        assert len(list(session.scalars(select(UnitConversion)))) == existing_count\n        assert session.scalar(select(EmissionFactor).where(EmissionFactor.name == "Factor inválido V1.6")) is None\n        assert session.scalar(\n            select(EmissionFactorVersion).join(EmissionFactor).where(EmissionFactor.name == "Factor inválido V1.6")\n        ) is None\n'''
          Path("tests/test_v160_methodology_admin_routing.py").write_text(test, encoding="utf-8")

          doc = '''# V1.6 · Methodology / Calculation Boundary · Methodology Administration\n\n## Corte\n\nLas cuatro rutas administrativas históricas de metodología pasan a `app/methodology_admin_web.py`:\n\n- `GET /metodologia`;\n- creación de factor;\n- cambio de estado de versión de factor;\n- creación/actualización de conversión.\n\nLos módulos especializados `methodology_web.py`, `factor_library_web.py` y `methodology_closure_web.py` permanecen intactos.\n\n## Regla crítica\n\nEl corte es de **propiedad HTTP**. `normalize_factor_output`, modelos, valores GWP, motor de cálculo, conversiones persistidas y reglas de aprobación conservan su implementación previa.\n\n## Contratos\n\n1. Cuatro rutas únicas y operativas.\n2. Unidad no autorizada sigue devolviendo HTTP 400.\n3. Conversión entre dimensiones incompatibles sigue bloqueada.\n4. El rol Cliente continúa sin acceso a `/metodologia`.\n5. Suite completa, arquitectura y smoke verdes antes del commit.\n'''
          Path("docs/architecture/V1_6_METHODOLOGY_ADMIN_BOUNDARY.md").write_text(doc, encoding="utf-8")
          PY
          python -m py_compile app/methodology_admin_web.py app/main.py tests/test_v160_methodology_admin_routing.py
          git diff --check
      - name: Targeted methodology contracts
        run: >-
          pytest -q
          tests/test_v160_methodology_admin_routing.py
          tests/test_v049_landing_windows_factor_dialogue.py
          tests/test_v050_support_and_factor_governance.py
          tests/test_app.py -k "factor or methodology or conversion or role_restriction"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit methodology admin routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/methodology_admin_web.py app/main.py tests/test_v160_methodology_admin_routing.py docs/architecture/V1_6_METHODOLOGY_ADMIN_BOUNDARY.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract methodology administration boundary"
          git push origin HEAD:refactor/v1-6-0-consolidation
