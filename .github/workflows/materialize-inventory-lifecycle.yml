name: Materialize inventory lifecycle

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-inventory-lifecycle.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract inventory lifecycle service
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path("app/main.py")
          source = main_path.read_text(encoding="utf-8")
          start_marker = "def next_inventory_version(version: str) -> str:\n"
          end_marker = '@app.exception_handler(401)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("inventory lifecycle boundaries are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + "\n"
          if block.count("def next_inventory_version(") != 1 or block.count("def clone_inventory_version(") != 1:
              raise SystemExit("inventory lifecycle function inventory is unexpected")

          header = '''from __future__ import annotations\n\nimport re\nimport secrets\n\nfrom sqlalchemy.orm import Session\n\nfrom .calculations import recalculate_inventory\nfrom .database import refresh_progress\nfrom .db.models import (\n    ActivityData,\n    ActivityIndicator,\n    EmissionSource,\n    EmissionTarget,\n    EvidenceDocument,\n    Inventory,\n    InventoryFacility,\n    ReductionAction,\n    ReductionScenario,\n    ReductionScenarioAction,\n    ReviewObservation,\n    SourceFactorAssignment,\n    SupplierCampaign,\n    SupplierDataRequest,\n    SupplierResponse,\n)\n\n\n'''
          Path("app/inventory_lifecycle.py").write_text(header + block, encoding="utf-8")

          source = source[:start] + source[end:]
          import_anchor = '''from .inventory_context import (\n    ensure_inventory_editable,\n    get_inventory,\n    get_source_for_user,\n    inventory_metrics,\n)\n'''
          if source.count(import_anchor) != 1:
              raise SystemExit("inventory context import anchor missing")
          source = source.replace(
              import_anchor,
              import_anchor + '''from .inventory_lifecycle import clone_inventory_version, next_inventory_version\n''',
              1,
          )
          main_path.write_text(source, encoding="utf-8")

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom sqlalchemy import select\n\nimport app.inventory_lifecycle as lifecycle\nimport app.main as main_module\nfrom app.db.base import SessionLocal\nfrom app.db.models import Inventory, ReviewObservation\nfrom app.inventory_context import get_inventory\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_v160_inventory_lifecycle_has_dedicated_authority_and_compatible_imports():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    lifecycle_source = (ROOT / "app/inventory_lifecycle.py").read_text(encoding="utf-8")\n    assert "def next_inventory_version(" not in main_source\n    assert "def clone_inventory_version(" not in main_source\n    assert "def next_inventory_version(" in lifecycle_source\n    assert "def clone_inventory_version(" in lifecycle_source\n    assert "from .main import" not in lifecycle_source\n    assert main_module.next_inventory_version is lifecycle.next_inventory_version\n    assert main_module.clone_inventory_version is lifecycle.clone_inventory_version\n\n\ndef test_v160_next_inventory_version_preserves_historical_contract():\n    assert lifecycle.next_inventory_version("") == "1.0-r1"\n    assert lifecycle.next_inventory_version("1.0") == "1.0-r1"\n    assert lifecycle.next_inventory_version("1.0-r1") == "1.0-r2"\n    assert lifecycle.next_inventory_version("v2026-r9") == "v2026-r10"\n\n\ndef test_v160_clone_inventory_version_preserves_structure_and_original():\n    with SessionLocal() as session:\n        original_stub = session.scalar(select(Inventory).order_by(Inventory.id))\n        assert original_stub is not None\n        original = get_inventory(\n            session, {"organization_id": original_stub.organization_id}, original_stub.id\n        )\n        original_status = original.status\n        original_locked = original.locked\n        original_version = original.version\n        source_count = len(original.sources)\n        facility_count = len(original.facility_links)\n        action_count = len(original.reduction_actions)\n        target_count = len(original.targets)\n\n        user = {\n            "email": "admin@calculatuhuella.local",\n            "name": "Administrador Demo",\n        }\n        cloned = lifecycle.clone_inventory_version(session, original, user, "Corrección controlada V1.6")\n        session.flush()\n\n        assert cloned.id != original.id\n        assert cloned.organization_id == original.organization_id\n        assert cloned.parent_inventory_id == original.id\n        assert cloned.version == lifecycle.next_inventory_version(original_version)\n        assert cloned.status == "Borrador"\n        assert cloned.current_stage == "Corrección"\n        assert cloned.locked is False\n        assert len(cloned.sources) == source_count\n        assert len(cloned.facility_links) == facility_count\n        assert len(cloned.reduction_actions) == action_count\n        assert len(cloned.targets) == target_count\n        observation = session.scalar(\n            select(ReviewObservation).where(ReviewObservation.inventory_id == cloned.id)\n        )\n        assert observation is not None\n        assert observation.severity == "Mayor"\n        assert "Corrección controlada V1.6" in observation.description\n\n        assert original.status == original_status\n        assert original.locked == original_locked\n        assert original.version == original_version\n        session.rollback()\n\n\ndef test_v160_review_surface_receives_extracted_lifecycle_service():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    assert "review_gate_summary, clone_inventory_version," in main_source\n    assert "from .inventory_lifecycle import clone_inventory_version, next_inventory_version" in main_source\n'''
          Path("tests/test_v160_inventory_lifecycle.py").write_text(test, encoding="utf-8")

          doc = '''# V1.6 · Inventory Lifecycle\n\n## Objetivo\n\nSeparar de `main.py` la creación de una nueva versión corregible a partir de un inventario cerrado, sin alterar rutas, reglas de aprobación ni cálculo.\n\n## Autoridad nueva\n\n`app/inventory_lifecycle.py` contiene:\n\n- `next_inventory_version`;\n- `clone_inventory_version`.\n\n`review_web.py` continúa recibiendo `clone_inventory_version` por la misma inyección existente desde `main.py`.\n\n## Semántica preservada\n\n- el inventario original no se modifica;\n- la nueva versión referencia `parent_inventory_id`;\n- versión `-rN` avanza de manera determinista;\n- estado nuevo `Borrador`, etapa `Corrección`, `locked=False`;\n- se copian sedes, fuentes, asignaciones, evidencias, datos de actividad, indicadores, acciones, metas, escenarios y campañas de proveedores según la implementación previa;\n- se registra una observación `Mayor` con el motivo de reapertura;\n- `refresh_progress` y `recalculate_inventory` siguen siendo las autoridades existentes: no se duplican fórmulas ni reglas.\n\n## Límites\n\nNo se modifican `/control/inventario/reabrir`, aprobación/cierre, modelos, migraciones, factores, GWP ni fórmulas.\n'''
          Path("docs/architecture/V1_6_INVENTORY_LIFECYCLE.md").write_text(doc, encoding="utf-8")
          PY
          python -m py_compile app/inventory_lifecycle.py app/main.py tests/test_v160_inventory_lifecycle.py
          git diff --check
      - name: Targeted inventory lifecycle contracts
        run: >-
          pytest -q
          tests/test_v160_inventory_lifecycle.py
          tests/test_v160_inventory_context.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Migration head
        run: python -m alembic upgrade head
      - name: Commit inventory lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inventory_lifecycle.py app/main.py tests/test_v160_inventory_lifecycle.py docs/architecture/V1_6_INVENTORY_LIFECYCLE.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(inventory): extract lifecycle versioning service"
          git push origin HEAD:refactor/v1-6-0-consolidation
