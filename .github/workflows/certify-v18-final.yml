name: Certify V1.8 final architecture

on:
  push:
    branches: [refactor/v1-8-0-strategic-surfaces]
    paths:
      - .github/workflows/certify-v18-final.yml

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      SEED_DEMO: "false"
      INSTANCE_DIR: /tmp/calculahuella-v18-cert-instance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-8-0-strategic-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Repository hygiene and canonical structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/calculahuella-v18-canonical-check
          mkdir -p /tmp/calculahuella-v18-canonical-check
          rsync -a --exclude='.git/' ./ /tmp/calculahuella-v18-canonical-check/
          (
            cd /tmp/calculahuella-v18-canonical-check
            python tools/verify_canonical.py --skip-manifest
          )
          git diff --check
          python - <<'PY'
          from pathlib import Path

          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.yml'))
          expected = sorted([
              'ci.yml',
              'iteration4-stabilization.yml',
              'package-mac-selfcontained.yml',
              'pages.yml',
              'certify-v18-final.yml',
          ])
          if workflows != expected:
              raise SystemExit(f'workflow hygiene failed: {workflows}')
          forbidden = [name for name in workflows if 'materialize' in name or 'diagnos' in name]
          if forbidden:
              raise SystemExit(f'temporary workflow residue: {forbidden}')
          print('Workflow hygiene OK:', ', '.join(workflows))
          PY
      - name: HTTP contract uniqueness and residual ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          routes = []
          dynamic = []
          for file in Path('app').glob('*.py'):
              tree = ast.parse(file.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for dec in node.decorator_list:
                      if not isinstance(dec, ast.Call) or not isinstance(dec.func, ast.Attribute):
                          continue
                      if not isinstance(dec.func.value, ast.Name) or dec.func.value.id != 'app':
                          continue
                      method = dec.func.attr.upper()
                      if method not in {'GET', 'POST', 'PUT', 'PATCH', 'DELETE'}:
                          continue
                      if not dec.args or not isinstance(dec.args[0], ast.Constant) or not isinstance(dec.args[0].value, str):
                          dynamic.append((str(file), node.name, method))
                          continue
                      routes.append((method, dec.args[0].value, str(file), node.name))

          if dynamic:
              raise SystemExit(f'dynamic route declarations require review: {dynamic}')
          seen = {}
          duplicates = []
          for method, path, file, function in routes:
              key = (method, path)
              if key in seen:
                  duplicates.append((key, seen[key], (file, function)))
              else:
                  seen[key] = (file, function)
          if duplicates:
              raise SystemExit(f'duplicate HTTP contracts: {duplicates}')
          if len(routes) != 344:
              raise SystemExit(f'expected 344 HTTP contracts, found {len(routes)}')

          main_text = Path('app/main.py').read_text(encoding='utf-8')
          main_lines = len(main_text.splitlines())
          main_routes = sum(1 for _, _, file, _ in routes if file == 'app/main.py')
          if main_lines > 1583:
              raise SystemExit(f'app/main.py grew beyond V1.8 ceiling: {main_lines}')
          if main_routes > 49:
              raise SystemExit(f'app/main.py HTTP route count grew beyond V1.8 ceiling: {main_routes}')
          print(f'HTTP uniqueness OK: {len(routes)} contracts')
          print(f'app/main.py ceiling OK: {main_lines} lines / {main_routes} HTTP routes')
          PY
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q | tee /tmp/v18-full.txt
      - name: Architecture debt gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_architecture.py --enforce | tee /tmp/v18-architecture.txt
      - name: Canonical smoke tier
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_test_tier.py smoke --durations 10 --timeout 300 | tee /tmp/v18-smoke.txt
      - name: Alembic from empty instance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$INSTANCE_DIR"
          mkdir -p "$INSTANCE_DIR"
          python -m alembic upgrade head
      - name: Persist V1.8 certification act
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          full = Path('/tmp/v18-full.txt').read_text(encoding='utf-8', errors='replace')
          smoke = Path('/tmp/v18-smoke.txt').read_text(encoding='utf-8', errors='replace')
          architecture = Path('/tmp/v18-architecture.txt').read_text(encoding='utf-8', errors='replace')

          full_match = re.search(r'([0-9]+ passed(?:, [0-9]+ skipped)?) in', full)
          smoke_match = re.search(r'([0-9]+ passed(?:, [0-9]+ deselected)?) in', smoke)
          main_match = re.search(r'`app/main.py`: ([0-9]+) líneas · ([0-9]+) rutas', architecture)
          total_routes_match = re.search(r'Rutas HTTP: ([0-9]+)', architecture)
          python_files_match = re.search(r'Archivos Python: ([0-9]+)', architecture)
          python_lines_match = re.search(r'Líneas Python: ([0-9]+)', architecture)
          tables_match = re.search(r'Tablas ORM: ([0-9]+)', architecture)
          if not all([full_match, smoke_match, main_match, total_routes_match, python_files_match, python_lines_match, tables_match]):
              raise SystemExit('could not parse certification evidence')

          input_sha = os.environ['GITHUB_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          doc = f'''# V1.8.0 · Acta de certificación integral\n\n## Resultado\n\n**CERTIFICADO TÉCNICAMENTE.** La consolidación V1.8 completó sus superficies estratégicas planificadas sin modificar `main` ni promover la rama certificada.\n\n## Identidad de la ejecución\n\n- Rama: `refactor/v1-8-0-strategic-surfaces`\n- PR: `#21`\n- Baseline V1.7: `d015f21af67bc834d72b1dd6cd97d6082efe04c5`\n- SHA de entrada a certificación: `{input_sha}`\n- GitHub Actions run: `{run_id}`\n\n## Gates ejecutados en esta certificación\n\n- estructura canónica: PASS;\n- higiene de workflows: PASS;\n- unicidad de método + ruta: PASS;\n- regresión completa: **{full_match.group(1)}**;\n- barrera de deuda arquitectónica: PASS;\n- smoke canónico: **{smoke_match.group(1)}**;\n- Alembic desde instancia vacía: PASS.\n\n## Snapshot arquitectónico\n\n- archivos Python: **{python_files_match.group(1)}**;\n- líneas Python: **{python_lines_match.group(1)}**;\n- rutas HTTP: **{total_routes_match.group(1)}**;\n- tablas ORM: **{tables_match.group(1)}**;\n- `app/main.py`: **{main_match.group(1)} líneas / {main_match.group(2)} rutas**;\n- `app/database.py`: **269 líneas**.\n\n## Alcance V1.8 certificado\n\n1. Impact Intelligence HTTP.\n2. Climate Risk HTTP.\n3. Climate Disclosure HTTP.\n4. Consolidation / Release Governance HTTP.\n\nLas autoridades de negocio existentes permanecen en `impact_intelligence.py`, `climate_risk.py`, `climate_disclosure.py`, `consolidation.py` y `architecture.py`. No se cambiaron factores, GWP, fórmulas de huella, motor de cálculo ni semántica de reporting.\n\n## Deuda residual deliberadamente diferida\n\nDashboard/analítica, escenarios, verificación, automatizaciones, cuenta de servicio/suscripción, onboarding, configuración de plataforma, control documental y otras superficies transversales se difieren a un ciclo apilado V1.9 para evitar ampliar artificialmente el alcance certificado.\n\n## Paso de higiene posterior\n\nDespués de esta acta debe eliminarse `certify-v18-final.yml` y ejecutarse el CI canónico una última vez sobre el SHA limpio. La certificación no autoriza por sí sola fusión a V1.7 ni a `main`; el PR permanece draft hasta una decisión explícita de promoción.\n'''
          Path('docs/architecture/V1_8_CERTIFICATION.md').write_text(doc, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/V1_8_CERTIFICATION.md
          git diff --cached --check
          git commit -m "docs(v1.8): persist integral certification act"
          git push origin HEAD:refactor/v1-8-0-strategic-surfaces
