name: Materialize V1.7 commercial operations routing

on:
  push:
    branches: [refactor/v1-7-0-domain-surfaces]
    paths:
      - .github/workflows/materialize-v17-commercial-operations-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-7-0-domain-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract commercial operations HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _contract_signature_hash(contract: ServiceContract, signed_by: str, signed_email: str, signed_at: datetime) -> str:\n'
          route_marker = '@app.get("/operacion-comercial", response_class=HTMLResponse)\n'
          end_marker = 'def _require_customer_success_view(user: dict[str, object]) -> None:\n'
          if source.count(start_marker) != 1 or source.count(route_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('commercial operations boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 11:
              raise SystemExit(f"expected 11 commercial operations routes, found {block.count('@app.')}")
          route_start = block.index(route_marker)
          helper_block = block[:route_start].rstrip() + '\n'
          route_block = block[route_start:].rstrip() + '\n'

          header = '''from __future__ import annotations\n\nimport hashlib\nfrom datetime import UTC, date, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import add_audit, get_db\nfrom .db.models import (\n    BillingDocumentRecord,\n    BillingInvoice,\n    CollectionAction,\n    CommercialProposal,\n    Organization,\n    OrganizationSubscription,\n    ServiceContract,\n    ServiceOrder,\n)\n\n\n'''
          indented_routes = ''.join(('    ' + line if line.strip() else line) for line in route_block.splitlines(keepends=True))
          module = header + helper_block + '\n\ndef register_commercial_operations_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date, format_number\n) -> None:\n' + indented_routes
          Path('app/commercial_operations_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .payment_web import register_payment_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('payment import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .commercial_operations_web import register_commercial_operations_routes\n', 1)
          register_anchor = 'register_payment_routes(app, templates)\n'
          if source.count(register_anchor) != 1:
              raise SystemExit('payment registration anchor missing')
          registration = '''register_commercial_operations_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date, format_number\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nCOMMERCIAL_OPERATIONS_ROUTES = {\n    ("GET", "/operacion-comercial"),\n    ("POST", "/operacion-comercial/contratos/nuevo"),\n    ("POST", "/operacion-comercial/contratos/{contract_id}/firmar"),\n    ("POST", "/operacion-comercial/contratos/{contract_id}/estado"),\n    ("POST", "/operacion-comercial/contratos/{contract_id}/renovar"),\n    ("POST", "/operacion-comercial/ordenes/nueva"),\n    ("POST", "/operacion-comercial/ordenes/{order_id}/estado"),\n    ("POST", "/operacion-comercial/cobros/recurrente"),\n    ("POST", "/operacion-comercial/cartera/nueva"),\n    ("POST", "/operacion-comercial/cartera/{action_id}/completar"),\n    ("POST", "/operacion-comercial/documentos/{document_id}/actualizar"),\n}\n\n\ndef _login(client: TestClient) -> None:\n    response = client.post(\n        "/login",\n        data={"email": "consultor@calculatuhuella.local", "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v170_commercial_operations_have_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/commercial_operations_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/operacion-comercial"' not in main_source\n    assert '@app.post("/operacion-comercial/' not in main_source\n    assert "register_commercial_operations_routes(" in main_source\n    assert module_source.count("@app.") == 11\n    assert "def _contract_signature_hash" in module_source\n    assert "def _contract_reference" in module_source\n    assert "def _order_reference" in module_source\n    assert "def _require_customer_success_view" not in module_source\n\n\ndef test_v170_commercial_operations_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in COMMERCIAL_OPERATIONS_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == COMMERCIAL_OPERATIONS_ROUTES\n    assert len(actual) == len(COMMERCIAL_OPERATIONS_ROUTES)\n\n\ndef test_v170_commercial_operations_page_remains_available():\n    with TestClient(app) as client:\n        _login(client)\n        response = client.get("/operacion-comercial")\n        assert response.status_code == 200\n        assert "Calcula tu Huella" in response.text\n'''
          Path('tests/test_v170_commercial_operations_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.7 · Commercial Operations HTTP\n\n## Autoridad\n\n`app/commercial_operations_web.py` pasa a ser la autoridad HTTP de operación comercial posterior a la propuesta y al pago. El corte incluye 11 rutas para contratos, órdenes de servicio, cobros recurrentes, cartera y documentos de cobro.\n\n## Helpers cohesionados\n\nTambién se mueven `_contract_signature_hash`, `_contract_reference` y `_order_reference`, porque solo sirven a este contexto. Customer Success permanece fuera del corte.\n\n## Semántica preservada\n\nNo se cambian estados, reglas de firma, renovación, referencias, importes, creación de documentos internos de cobro, gestión de cartera ni auditoría. `format_number`, `parse_date`, permisos y contexto común siguen inyectados desde la composición principal.\n\n## Gates\n\nLos tests históricos V0.16 protegen semilla comercial, firma, renovación, ciclo de órdenes, cobro recurrente y cierre de cartera. El contrato V1.7 protege autoridad HTTP, unicidad de rutas y disponibilidad de la pantalla.\n'''
          Path('docs/architecture/V1_7_COMMERCIAL_OPERATIONS_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/commercial_operations_web.py app/main.py tests/test_v170_commercial_operations_routing.py
          git diff --check
      - name: Targeted V1.7 commercial operations authority
        run: pytest -q tests/test_v170_commercial_operations_routing.py
      - name: Historical V0.16 revenue operations
        run: pytest -q tests/test_app.py -k "v016"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit commercial operations routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/commercial_operations_web.py app/main.py tests/test_v170_commercial_operations_routing.py docs/architecture/V1_7_COMMERCIAL_OPERATIONS_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract commercial operations HTTP"
          git push origin HEAD:refactor/v1-7-0-domain-surfaces
