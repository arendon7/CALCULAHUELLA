name: Aplanar fuente extraída

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/flatten-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatten-v0-45-5-main
  cancel-in-progress: false

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplanar y limpiar
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='calcula_tu_huella_v0_45_5_completa_mac'
          test -d "$SOURCE"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.DS_Store' \
            "$SOURCE"/ ./

          rm -rf "$SOURCE" __MACOSX
          rm -f calcula_tu_huella_v0_45_5_completa_mac.zip
          find . -type f \( -name '*.sh' -o -name '*.command' \) -exec chmod +x {} +

      - name: Confirmar estructura raíz
        shell: bash
        run: |
          set -euo pipefail
          test -f run.py
          test -f app/main.py
          test -d migrations
          test -d tests
          test ! -e __MACOSX
          test ! -e calcula_tu_huella_v0_45_5_completa_mac

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: consolidar árbol fuente v0.45.5 en la raíz'
          git push origin HEAD:main
