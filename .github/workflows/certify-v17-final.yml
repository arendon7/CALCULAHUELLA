name: Certify V1.7 final architecture

on:
  push:
    branches: [refactor/v1-7-0-domain-surfaces]
    paths:
      - .github/workflows/certify-v17-final.yml

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      SEED_DEMO: "false"
      INSTANCE_DIR: /tmp/calculahuella-v17-cert-instance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-7-0-domain-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Repository hygiene and canonical structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/calculahuella-v17-canonical-check
          mkdir -p /tmp/calculahuella-v17-canonical-check
          rsync -a --exclude='.git/' ./ /tmp/calculahuella-v17-canonical-check/
          (
            cd /tmp/calculahuella-v17-canonical-check
            python tools/verify_canonical.py --skip-manifest
          )
          git diff --check
          python - <<'PY'
          from pathlib import Path

          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.yml'))
          expected = sorted([
              'ci.yml',
              'iteration4-stabilization.yml',
              'package-mac-selfcontained.yml',
              'pages.yml',
              'certify-v17-final.yml',
          ])
          if workflows != expected:
              raise SystemExit(f'workflow hygiene failed: {workflows}')
          forbidden = [name for name in workflows if 'materialize' in name or 'diagnos' in name]
          if forbidden:
              raise SystemExit(f'temporary workflow residue: {forbidden}')
          print('Workflow hygiene OK:', ', '.join(workflows))
          PY
      - name: HTTP contract uniqueness and residual ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          routes = []
          dynamic = []
          for file in Path('app').glob('*.py'):
              tree = ast.parse(file.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for dec in node.decorator_list:
                      if not isinstance(dec, ast.Call) or not isinstance(dec.func, ast.Attribute):
                          continue
                      if not isinstance(dec.func.value, ast.Name) or dec.func.value.id != 'app':
                          continue
                      method = dec.func.attr.upper()
                      if method not in {'GET', 'POST', 'PUT', 'PATCH', 'DELETE'}:
                          continue
                      if not dec.args or not isinstance(dec.args[0], ast.Constant) or not isinstance(dec.args[0].value, str):
                          dynamic.append((str(file), node.name, method))
                          continue
                      routes.append((method, dec.args[0].value, str(file), node.name))

          if dynamic:
              raise SystemExit(f'dynamic route declarations require review: {dynamic}')
          seen = {}
          duplicates = []
          for method, path, file, function in routes:
              key = (method, path)
              if key in seen:
                  duplicates.append((key, seen[key], (file, function)))
              else:
                  seen[key] = (file, function)
          if duplicates:
              raise SystemExit(f'duplicate HTTP contracts: {duplicates}')
          if len(routes) != 344:
              raise SystemExit(f'expected 344 HTTP contracts, found {len(routes)}')

          main_text = Path('app/main.py').read_text(encoding='utf-8')
          main_lines = len(main_text.splitlines())
          main_routes = main_text.count('@app.')
          if main_lines > 2224:
              raise SystemExit(f'app/main.py grew beyond V1.7 ceiling: {main_lines}')
          if main_routes > 81:
              raise SystemExit(f'app/main.py route count grew beyond V1.7 ceiling: {main_routes}')
          print(f'HTTP uniqueness OK: {len(routes)} contracts')
          print(f'app/main.py ceiling OK: {main_lines} lines / {main_routes} routes')
          PY
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q | tee /tmp/v17-full.txt
      - name: Architecture debt gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_architecture.py --enforce | tee /tmp/v17-architecture.txt
      - name: Canonical smoke tier
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_test_tier.py smoke --durations 10 --timeout 300 | tee /tmp/v17-smoke.txt
      - name: Alembic from empty instance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$INSTANCE_DIR"
          mkdir -p "$INSTANCE_DIR"
          python -m alembic upgrade head
      - name: Persist V1.7 certification act
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          full = Path('/tmp/v17-full.txt').read_text(encoding='utf-8', errors='replace')
          smoke = Path('/tmp/v17-smoke.txt').read_text(encoding='utf-8', errors='replace')
          architecture = Path('/tmp/v17-architecture.txt').read_text(encoding='utf-8', errors='replace')

          full_match = re.search(r'([0-9]+ passed(?:, [0-9]+ skipped)?) in', full)
          smoke_match = re.search(r'([0-9]+ passed(?:, [0-9]+ deselected)?) in', smoke)
          main_match = re.search(r'`app/main.py`: ([0-9]+) líneas · ([0-9]+) rutas', architecture)
          total_routes_match = re.search(r'Rutas HTTP: ([0-9]+)', architecture)
          python_files_match = re.search(r'Archivos Python: ([0-9]+)', architecture)
          python_lines_match = re.search(r'Líneas Python: ([0-9]+)', architecture)
          tables_match = re.search(r'Tablas ORM: ([0-9]+)', architecture)
          if not all([full_match, smoke_match, main_match, total_routes_match, python_files_match, python_lines_match, tables_match]):
              raise SystemExit('could not parse certification evidence')

          input_sha = os.environ['GITHUB_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          doc = f'''# V1.7.0 · Acta de certificación integral\n\n## Resultado\n\n**CERTIFICADO TÉCNICAMENTE.** La consolidación V1.7 completó sus cortes planificados sin modificar la rama `main` ni promover la rama certificada.\n\n## Identidad de la ejecución\n\n- Rama: `refactor/v1-7-0-domain-surfaces`\n- PR: `#20`\n- Baseline V1.6: `092122afec70bb32f825d087b89a0401249f438a`\n- SHA de entrada a certificación: `{input_sha}`\n- GitHub Actions run: `{run_id}`\n\n## Gates ejecutados en esta certificación\n\n- estructura canónica: PASS;\n- higiene de workflows: PASS;\n- unicidad de método + ruta: PASS;\n- regresión completa: **{full_match.group(1)}**;\n- barrera de deuda arquitectónica: PASS;\n- smoke canónico: **{smoke_match.group(1)}**;\n- Alembic desde instancia vacía: PASS.\n\n## Snapshot arquitectónico\n\n- archivos Python: **{python_files_match.group(1)}**;\n- líneas Python: **{python_lines_match.group(1)}**;\n- rutas HTTP: **{total_routes_match.group(1)}**;\n- tablas ORM: **{tables_match.group(1)}**;\n- `app/main.py`: **{main_match.group(1)} líneas / {main_match.group(2)} rutas**;\n- `app/database.py`: 269 líneas.\n\n## Alcance V1.7 certificado\n\n1. Supply Chain / Scope 3 HTTP.\n2. Support HTTP.\n3. Commercial Proposal HTTP.\n4. Proposal Acceptance / Payments HTTP.\n5. Commercial Operations HTTP.\n6. Customer Success HTTP.\n7. SaaS Administration HTTP.\n\nLa lógica de negocio existente permanece en sus autoridades de dominio. No se cambiaron factores, GWP, fórmulas de huella, motor de cálculo ni semántica de reporting.\n\n## Deuda residual deliberadamente diferida\n\nV1.7 cierra con `app/main.py` todavía como composition root parcial. Impact Intelligence, Climate Risk/Disclosure, consolidación/release governance y otras superficies transversales se difieren a un ciclo apilado posterior para evitar ampliar artificialmente el alcance certificado.\n\n## Paso de higiene posterior\n\nDespués de esta acta debe eliminarse `certify-v17-final.yml` y ejecutarse el CI canónico una última vez sobre el SHA limpio. La certificación no autoriza por sí sola fusión a `main`; el PR permanece draft hasta una decisión explícita de promoción.\n'''
          Path('docs/architecture/V1_7_CERTIFICATION.md').write_text(doc, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/V1_7_CERTIFICATION.md
          git diff --cached --check
          git commit -m "docs(v1.7): persist integral certification act"
          git push origin HEAD:refactor/v1-7-0-domain-surfaces
