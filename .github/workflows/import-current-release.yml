name: Importar entrega canónica actual

on:
  push:
    branches:
      - integration/canonical
    paths:
      - "migration/inbox/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-release-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolver archivo esperado
        id: release
        run: |
          filename="$(python - <<'PY'
          import json
          print(json.load(open('migration/current-release.json', encoding='utf-8'))['archive']['filename'])
          PY
          )"
          path="migration/inbox/$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          if [[ -f "$path" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No se encontró $path; no se modifica el árbol."
          fi

      - name: Verificar e importar
        if: steps.release.outputs.found == 'true'
        run: |
          python scripts/migration/verify_current_release.py "${{ steps.release.outputs.path }}" \
            --json-output migration/CURRENT_RELEASE_VERIFICATION.json
          python scripts/migration/import_current_release.py "${{ steps.release.outputs.path }}" \
            --report migration/CURRENT_RELEASE_IMPORT.json
          rm -f "${{ steps.release.outputs.path }}"

      - name: Instalar dependencias importadas
        if: steps.release.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt
            python -m pip install pytest
          fi

      - name: Validar runtime importado
        if: steps.release.outputs.found == 'true'
        env:
          APP_ENV: test
          SESSION_SECRET: canonical-import-validation
          DATABASE_URL: sqlite+pysqlite:///./instance/canonical-import.sqlite3
          SEED_DEMO: "true"
          OPEN_BROWSER: "0"
          CSRF_ENABLED: "false"
          SCHEDULER_ENABLED: "false"
          DEPLOYMENT_STRICT: "false"
        run: |
          python -m compileall -q app scripts tests migration/tests run.py
          find . -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -r -n1 bash -n
          mkdir -p instance
          rm -f instance/canonical-import.sqlite3
          python -m alembic upgrade head
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from sqlalchemy import inspect
          from app.config import settings
          from app.database import Base, engine
          from app.main import app, templates

          contract = json.load(open('migration/current-release.json', encoding='utf-8'))
          expected = contract['runtime_contract']
          validation = contract.get('validation', {})
          names = sorted(templates.env.list_templates())
          physical_tables = inspect(engine).get_table_names()
          for name in names:
              templates.env.get_template(name)

          assert settings.version == contract['release'], (settings.version, contract['release'])
          assert len(app.routes) == expected['routes'], len(app.routes)
          assert len(Base.metadata.tables) == expected['orm_models'], len(Base.metadata.tables)
          assert len(physical_tables) == expected['physical_tables_after_migration'], physical_tables
          assert len(names) == expected['jinja_templates'], len(names)

          for asset in contract['required_brand_assets']:
              assert list(Path('app/static').glob(f'**/img/brand/{asset}')), asset

          evidence_path = Path(validation['evidence_file'])
          assert evidence_path.is_file(), evidence_path
          digest = hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          assert digest == validation['evidence_sha256'], (digest, validation['evidence_sha256'])
          assert contract['production_authorized'] is False
          print(
              f"Release {settings.version}: {len(app.routes)} rutas · "
              f"{len(Base.metadata.tables)} modelos · {len(physical_tables)} tablas · "
              f"{len(names)} plantillas · evidencia {digest}"
          )
          PY
          current="$(python -m alembic current 2>/dev/null | tr -d '\r')"
          head="$(python - <<'PY'
          import json
          print(json.load(open('migration/current-release.json', encoding='utf-8'))['runtime_contract']['alembic_head'])
          PY
          )"
          echo "$current" | grep -q "$head"
          test -f platform/windows/OVERLAY_MANIFEST.json

      - name: Ejecutar suite importada en procesos aislados
        if: steps.release.outputs.found == 'true'
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          contract = json.load(open('migration/current-release.json', encoding='utf-8'))
          expected_files = contract.get('validation', {}).get('test_files')
          selected = sorted(Path('tests').glob('test_*.py'))
          if not selected:
              raise SystemExit('No se localizaron archivos de pruebas de la entrega')
          if expected_files is not None and len(selected) != int(expected_files):
              raise SystemExit(
                  f"Archivos de prueba esperados: {expected_files}; encontrados: {len(selected)}"
              )
          for index, path in enumerate(selected, start=1):
              print(f"[{index}/{len(selected)}] {path}", flush=True)
              subprocess.run(
                  [sys.executable, '-m', 'pytest', '-q', str(path)],
                  check=True,
              )
          PY
          python -m pytest -q migration/tests
          docker build -t calcula-tu-huella:canonical-import .

      - name: Confirmar árbol importado
        if: steps.release.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La importación no produjo cambios."
            exit 0
          fi
          version="$(python - <<'PY'
          import json
          print(json.load(open('migration/current-release.json', encoding='utf-8'))['display_release'])
          PY
          )"
          git commit -m "feat: importar fuente canónica ${version}"
          git push origin HEAD:integration/canonical
