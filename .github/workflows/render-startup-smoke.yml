name: Smoke de arranque Render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-startup-smoke.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-prod.txt
      - name: Levantar aplicación con start_prod.sh
        shell: bash
        env:
          APP_ENV: demo
          SEED_DEMO: "true"
          STORAGE_BACKEND: local
          DATABASE_URL: sqlite:////tmp/calculahuella-render-smoke.sqlite3
          INSTANCE_DIR: /tmp/calculahuella-render-instance
          CTH_ALLOW_SYSTEM_PYTHON: "true"
          DEPLOYMENT_STRICT: "false"
          WEB_CONCURRENCY: "1"
          HOST: 0.0.0.0
          PORT: "8765"
          SESSION_HTTPS_ONLY: "false"
        run: |
          set -euo pipefail
          export CTH_PYTHON_BIN="$(command -v python)"
          chmod +x start_prod.sh
          ./start_prod.sh > /tmp/calculahuella-start.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/calculahuella-start.log' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8765/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "La aplicación terminó antes de abrir el puerto."
              exit 1
            fi
            sleep 1
          done
          echo "La aplicación no abrió el puerto dentro de 45 segundos."
          exit 1
