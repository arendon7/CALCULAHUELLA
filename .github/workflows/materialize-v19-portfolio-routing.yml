name: Materialize V1.9 portfolio routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-portfolio-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Portfolio HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/portafolio", response_class=HTMLResponse)\n'
          end_marker = 'def _compliance_score(rows: list[ComplianceAssessment]) -> int:\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('portfolio boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 3:
              raise SystemExit(f"expected 3 portfolio routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import add_audit, get_db\nfrom .db.models import Organization, OrganizationMembership\nfrom .product_experience import demo_story_for\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n) -> None:\n' + indented
          Path('app/portfolio_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .notifications_web import register_notification_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('notifications import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .portfolio_web import register_portfolio_routes\n', 1)
          register_anchor = '''register_notification_routes(\n    app, templates, common_context, require_user, set_flash\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('notifications registration anchor missing')
          registration = '''register_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nPORTFOLIO_ROUTES = {\n    ("GET", "/portafolio"),\n    ("POST", "/portafolio/cambiar/{organization_id}"),\n    ("POST", "/portafolio/nueva"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_portfolio_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/portfolio_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/portafolio"' not in main_source\n    assert '@app.post("/portafolio/' not in main_source\n    assert "register_portfolio_routes(" in main_source\n    assert module_source.count("@app.") == 3\n    assert "OrganizationMembership" in module_source\n    assert 'request.session["active_org_id"]' in module_source\n    assert "manage_org" in module_source\n    assert "_compliance_score" not in module_source\n\n\ndef test_v190_portfolio_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in PORTFOLIO_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == PORTFOLIO_ROUTES\n    assert len(actual) == len(PORTFOLIO_ROUTES)\n\n\ndef test_v190_portfolio_read_access_remains_capability_bound():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/portafolio").status_code == 403\n        client.post("/logout")\n        _login(client, "consultor@calculatuhuella.local")\n        assert client.get("/portafolio").status_code == 200\n'''
          Path('tests/test_v190_portfolio_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Portfolio HTTP\n\n## Autoridad\n\n`app/portfolio_web.py` pasa a ser la autoridad HTTP de tres contratos multiempresa: vista de portafolio, cambio de organización activa y creación de organización.\n\n## Semántica preservada\n\nSe conserva selección de inventario más reciente, `demo_story`, validación de membresía activa, `active_org_id`, auditoría del cambio de contexto y creación de membresía `Administrador` para la organización nueva.\n\n## Permisos\n\nLa vista requiere `manage_portfolio`. La creación mantiene la barrera adicional `manage_org`; por tanto, acceso al portafolio no equivale a permiso para crear organizaciones.\n\n## Gates\n\nLos contratos históricos protegen cambio de contexto multiempresa y alta de organización/membresía. El contrato V1.9 protege autoridad HTTP, unicidad y acceso por capacidad.\n'''
          Path('docs/architecture/V1_9_PORTFOLIO_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/portfolio_web.py app/main.py tests/test_v190_portfolio_routing.py
          git diff --check
      - name: Targeted V1.9 Portfolio authority
        run: pytest -q tests/test_v190_portfolio_routing.py
      - name: Historical portfolio contracts
        run: pytest -q tests/test_app.py -k "portfolio_switches_organization_context or admin_can_create_new_organization_and_membership"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Portfolio routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/portfolio_web.py app/main.py tests/test_v190_portfolio_routing.py docs/architecture/V1_9_PORTFOLIO_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract portfolio HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
