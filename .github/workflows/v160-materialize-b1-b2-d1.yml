name: V1.6 · materializar B1 B2 D1

on:
  push:
    branches:
      - refactor/v1-6-0-consolidation
    paths:
      - .github/workflows/v160-materialize-b1-b2-d1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar patches validados antes de aplicar
        shell: bash
        run: |
          set -euo pipefail
          git apply --check docs/architecture/patches/V1_6_B1_PUBLIC_ROUTES_VALIDATED.patch
          git apply docs/architecture/patches/V1_6_B1_PUBLIC_ROUTES_VALIDATED.patch
          git apply --check docs/architecture/patches/V1_6_B2_AUTH_ROUTES_VALIDATED.patch
          git apply docs/architecture/patches/V1_6_B2_AUTH_ROUTES_VALIDATED.patch
          git apply --check docs/architecture/patches/V1_6_D1_AUDIT_EXTRACTION_VALIDATED.patch
          git apply docs/architecture/patches/V1_6_D1_AUDIT_EXTRACTION_VALIDATED.patch

      - name: Verificar alcance exacto del refactor
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED=$'app/database.py\napp/main.py'
          printf 'Archivos modificados:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          python -m compileall -q app
          python scripts/audit_architecture.py --enforce

      - name: Regresión dirigida B1+B2+D1
        run: |
          python -m pytest -q \
            tests/test_app.py \
            tests/test_v024_security_hardening.py \
            tests/test_v154_landing_csp.py \
            tests/test_v155_final_demo_audit.py \
            tests/test_iteration18_public_contract.py \
            tests/test_v0461_consolidation_audit.py

      - name: Smoke integral
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300

      - name: Materializar solamente si todo quedó verde
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/database.py
          git commit -m "refactor(v1.6): materializar B1+B2+D1 validados"
          git push origin HEAD:refactor/v1-6-0-consolidation
