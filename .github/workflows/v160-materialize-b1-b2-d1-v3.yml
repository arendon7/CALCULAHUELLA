name: V1.6 · materializar B1 B2 D1 · v3

on:
  push:
    branches:
      - refactor/v1-6-0-consolidation
    paths:
      - .github/workflows/v160-materialize-b1-b2-d1-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Aplicar exclusivamente patches canónicos
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            docs/architecture/patches/V1_6_B1_PUBLIC_ROUTES_CANONICAL.patch \
            docs/architecture/patches/V1_6_B2_AUTH_ROUTES_CANONICAL.patch \
            docs/architecture/patches/V1_6_D1_AUDIT_EXTRACTION_CANONICAL.patch
          do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Verificar alcance y reducción de deuda
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED=$'app/database.py\napp/main.py'
          test "$ACTUAL" = "$EXPECTED"
          test "$(wc -l < app/main.py)" -le 4569
          test "$(wc -l < app/database.py)" -le 2096
          python -m compileall -q app
          python scripts/audit_architecture.py --enforce

      - name: Regresión dirigida disponible en GitHub
        run: |
          python -m pytest -q \
            tests/test_app.py \
            tests/test_v024_security_hardening.py \
            tests/test_iteration18_public_contract.py \
            tests/test_v0461_consolidation_audit.py \
            tests/test_v160_architecture_governance.py \
            tests/test_v160_landing_diagnosis_handoff.py \
            tests/test_v160_public_canonical_eight_stages.py

      - name: Smoke integral
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300

      - name: Materializar solamente con todos los gates verdes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/database.py
          git commit -m "refactor(v1.6): materializar B1+B2+D1 validados"
          git push origin HEAD:refactor/v1-6-0-consolidation
