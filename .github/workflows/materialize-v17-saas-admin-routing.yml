name: Materialize V1.7 SaaS administration routing

on:
  push:
    branches: [refactor/v1-7-0-domain-surfaces]
    paths:
      - .github/workflows/materialize-v17-saas-admin-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-7-0-domain-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract SaaS administration HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/administracion-saas", response_class=HTMLResponse)\n'
          end_marker = 'def _lead_complexity(employees_band: str, facilities_count: int, desired_scopes: str, has_previous_inventory: bool, objective: str, urgency: str) -> tuple[int, str]:\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('SaaS admin boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 4:
              raise SystemExit(f"expected 4 SaaS administration routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nimport re\nfrom datetime import UTC, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import add_audit, get_db\nfrom .db.models import BillingInvoice, Organization, OrganizationSubscription, ServicePlan\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_saas_admin_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n) -> None:\n' + indented
          Path('app/saas_admin_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .customer_success_web import register_customer_success_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('customer success import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .saas_admin_web import register_saas_admin_routes\n', 1)
          register_anchor = '''register_customer_success_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('customer success registration anchor missing')
          registration = '''register_saas_admin_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nfrom app.database import BillingInvoice, OrganizationSubscription, ServicePlan, SessionLocal\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nSAAS_ROUTES = {\n    ("GET", "/administracion-saas"),\n    ("POST", "/administracion-saas/planes/nuevo"),\n    ("POST", "/administracion-saas/suscripciones/{subscription_id}/actualizar"),\n    ("POST", "/administracion-saas/facturas/{invoice_id}/estado"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v170_saas_admin_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/saas_admin_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/administracion-saas"' not in main_source\n    assert '@app.post("/administracion-saas/' not in main_source\n    assert "register_saas_admin_routes(" in main_source\n    assert module_source.count("@app.") == 4\n    assert "manage_saas" in module_source\n    assert "_lead_complexity" not in module_source\n\n\ndef test_v170_saas_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in SAAS_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == SAAS_ROUTES\n    assert len(actual) == len(SAAS_ROUTES)\n\n\ndef test_v170_saas_admin_permissions_remain_restricted():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        response = client.get("/administracion-saas")\n        assert response.status_code == 403\n\n\ndef test_v170_saas_subscription_and_invoice_updates_remain_persistent():\n    with SessionLocal() as session:\n        subscription = session.scalar(select(OrganizationSubscription).order_by(OrganizationSubscription.id))\n        assert subscription is not None\n        plan = session.scalar(select(ServicePlan).where(ServicePlan.id != subscription.plan_id).order_by(ServicePlan.id))\n        if plan is None:\n            plan = session.get(ServicePlan, subscription.plan_id)\n        assert plan is not None\n        invoice = session.scalar(select(BillingInvoice).order_by(BillingInvoice.id))\n        assert invoice is not None\n        subscription_id, plan_id, invoice_id = subscription.id, plan.id, invoice.id\n\n    with TestClient(app) as client:\n        _login(client, "admin@calculatuhuella.local")\n        updated = client.post(\n            f"/administracion-saas/suscripciones/{subscription_id}/actualizar",\n            data={\n                "plan_id": str(plan_id),\n                "status": "Activa",\n                "billing_cycle": "Mensual",\n                "custom_monthly_fee": "123456",\n                "renewal_date": "2027-01-15",\n                "notes": "Prueba V1.7",\n            },\n            follow_redirects=False,\n        )\n        assert updated.status_code == 303\n        paid = client.post(\n            f"/administracion-saas/facturas/{invoice_id}/estado",\n            data={"status": "Pagada"},\n            follow_redirects=False,\n        )\n        assert paid.status_code == 303\n\n    with SessionLocal() as session:\n        subscription = session.get(OrganizationSubscription, subscription_id)\n        invoice = session.get(BillingInvoice, invoice_id)\n        assert subscription.plan_id == plan_id\n        assert subscription.status == "Activa"\n        assert subscription.billing_cycle == "Mensual"\n        assert subscription.custom_monthly_fee == 123456\n        assert subscription.renewal_date.isoformat() == "2027-01-15"\n        assert invoice.status == "Pagada"\n        assert invoice.paid_at is not None\n'''
          Path('tests/test_v170_saas_admin_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.7 · SaaS Administration HTTP\n\n## Autoridad\n\n`app/saas_admin_web.py` pasa a ser la autoridad HTTP de cuatro contratos administrativos: panel SaaS, creación de plan, actualización de suscripción y actualización del estado de cobro.\n\n## Alcance\n\nEl corte no mueve `/cuenta-servicio`, onboarding, diagnóstico comercial ni pagos. Tampoco cambia límites de planes, estados de suscripción, ciclos de cobro o semántica de `BillingInvoice`.\n\n## Permisos\n\nLas cuatro rutas continúan exigiendo `manage_saas`. La actualización de suscripción conserva plan, estado, ciclo, tarifa personalizada, renovación y notas; la actualización de cobro conserva la marca temporal de pago.\n\n## Gates\n\nEl test histórico `test_saas_admin_can_create_plan` protege creación de planes. El contrato V1.7 protege autoridad HTTP, unicidad, denegación para cliente y persistencia de actualización de suscripción/cobro.\n'''
          Path('docs/architecture/V1_7_SAAS_ADMIN_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/saas_admin_web.py app/main.py tests/test_v170_saas_admin_routing.py
          git diff --check
      - name: Targeted V1.7 SaaS administration authority
        run: pytest -q tests/test_v170_saas_admin_routing.py
      - name: Historical SaaS plan contract
        run: pytest -q tests/test_app.py -k "saas_admin_can_create_plan"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit SaaS administration routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/saas_admin_web.py app/main.py tests/test_v170_saas_admin_routing.py docs/architecture/V1_7_SAAS_ADMIN_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract SaaS administration HTTP"
          git push origin HEAD:refactor/v1-7-0-domain-surfaces
