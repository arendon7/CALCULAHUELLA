name: Importar versión canónica

on:
  push:
    branches:
      - migration/canonical-v1.0.0
    paths:
      - canonical-upload.zip

permissions:
  contents: write

concurrency:
  group: canonical-import
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar rama de migración
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar archivo recibido
        shell: bash
        run: |
          set -euo pipefail
          test -f canonical-upload.zip
          echo "d4a877a7a4894be0d7f83b83f8a7e4a963112e30c57111b10b013de06c9f929c  canonical-upload.zip" | sha256sum --check --strict

      - name: Extraer versión canónica
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/calculahuella-canonica
          mkdir -p /tmp/calculahuella-canonica
          unzip -q canonical-upload.zip -d /tmp/calculahuella-canonica
          SOURCE="$(find /tmp/calculahuella-canonica -type f -name CANONICAL_RELEASE.md -printf '%h\n' | head -n 1)"
          test -n "$SOURCE"
          test -d "$SOURCE/app"
          test -d "$SOURCE/migrations"
          test -d "$SOURCE/site"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Sustituir contenido antiguo
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE"/. .

      - name: Verificar versión canónica
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_canonical.py
          python -m compileall -q app migrations scripts tools
          test "$(cat VERSION)" = "1.0.0"
          test -f render.yaml
          test -f .github/workflows/pages.yml

      - name: Publicar rama canónica reconstruida
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: importar V1.0.0 canónica completa"
          git push origin HEAD:migration/canonical-v1.0.0
