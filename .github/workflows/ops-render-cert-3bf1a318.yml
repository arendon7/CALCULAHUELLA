name: One-shot · Render certification · 3bf1a318

on:
  push:
    branches:
      - ops/render-cert-3bf1a318

permissions:
  contents: read
  actions: read

jobs:
  certify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PRODUCT_SHA: 3bf1a318ae9ff2fbc197b549068768b013e00b77
      PRODUCT_READINESS_RUN_ID: "32200249634"
      STAGING_BASE_URL: https://calcula-tu-huella-arendon7-preview.onrender.com
      REMOTE_STAGING_ARTIFACT_DIR: remote-staging-artifacts
      REMOTE_STAGING_STARTUP_TIMEOUT_SECONDS: "180"
      REMOTE_STAGING_REQUEST_TIMEOUT_SECONDS: "20"
      REMOTE_STAGING_POLL_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esperar Product Readiness exacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["PRODUCT_READINESS_RUN_ID"]
          expected = os.environ["EXPECTED_PRODUCT_SHA"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          deadline = time.monotonic() + 1800
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cth-render-cert",
          }
          while True:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              if payload.get("head_sha") != expected:
                  raise SystemExit(f"Readiness pertenece a {payload.get('head_sha')}, no a {expected}")
              status = payload.get("status")
              conclusion = payload.get("conclusion")
              print(f"Product Readiness: {status} / {conclusion}", flush=True)
              if status == "completed":
                  if conclusion != "success":
                      raise SystemExit(f"Product Readiness terminó {conclusion}")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("Timeout esperando Product Readiness")
              time.sleep(15)
          PY

      - name: Esperar deploy Render con huella funcional V2.45
        run: |
          mkdir -p "$REMOTE_STAGING_ARTIFACT_DIR"
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          base = os.environ["STAGING_BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_PRODUCT_SHA"]
          route = "/inventarios/{inventory_id}/fuentes/{source_id}"
          deadline = time.monotonic() + 1800
          attempts = 0
          last = "sin respuesta"
          while True:
              attempts += 1
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=20) as response:
                      health = json.load(response)
                  with urllib.request.urlopen(base + "/openapi.json", timeout=20) as response:
                      openapi = json.load(response)
                  healthy = health.get("status") == "ok" and health.get("environment") == "staging"
                  fingerprint = route in openapi.get("paths", {})
                  print(f"Render intento {attempts}: health={healthy} v2.45={fingerprint}", flush=True)
                  if healthy and fingerprint:
                      evidence = {
                          "expected_product_sha": expected,
                          "base_url": base,
                          "health": health,
                          "openapi_route_fingerprint": route,
                          "attempts": attempts,
                          "certified_at_epoch": int(time.time()),
                      }
                      Path(os.environ["REMOTE_STAGING_ARTIFACT_DIR"], "deploy-fingerprint.json").write_text(
                          json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8"
                      )
                      break
                  last = f"health={health!r}, fingerprint={fingerprint}"
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
                  print(last, flush=True)
              if time.monotonic() >= deadline:
                  raise SystemExit(f"Timeout esperando Render: {last}")
              time.sleep(20)
          PY

      - name: Instalar cliente HTTP mínimo
        run: python -m pip install httpx==0.28.1

      - name: Ejecutar contrato remoto no destructivo
        run: python -m scripts.remote_staging_contract

      - name: Publicar evidencia remota
        uses: actions/upload-artifact@v4
        with:
          name: render-cert-3bf1a318
          path: remote-staging-artifacts/
          if-no-files-found: error
          retention-days: 14
