name: Materialize V1.7 support routing

on:
  push:
    branches: [refactor/v1-7-0-domain-surfaces]
    paths:
      - .github/workflows/materialize-v17-support-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-7-0-domain-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract support HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path("app/main.py")
          source = main_path.read_text(encoding="utf-8")
          start_marker = '@app.get("/soporte", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/administracion-saas", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("support route boundaries are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + "\n"
          if block.count("@app.") != 6:
              raise SystemExit(f"expected 6 support routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom datetime import UTC, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .config import settings\nfrom .database import add_audit, get_db\nfrom .db.models import ActivityData, EmissionSource, Inventory, SupportTicket\nfrom .notifications import notify_roles\nfrom .support_workflow import (\n    CLOSED_STATUSES,\n    OPEN_STATUSES,\n    add_support_message,\n    ensure_reference,\n    response_deadline,\n    route_assignment,\n    status_class,\n    support_summary,\n    ticket_context,\n    ticket_overdue,\n    ticket_waiting_days,\n)\n\n\ndef register_support_routes(\n    app,\n    templates,\n    common_context,\n    require_user,\n    ensure_capability,\n    set_flash,\n    parse_date,\n) -> None:\n'''
          indented = "".join(("    " + line if line.strip() else line) for line in block.splitlines(keepends=True))
          Path("app/support_web.py").write_text(header + indented, encoding="utf-8")

          source = source[:start] + source[end:]
          import_anchor = "from .supply_chain_web import register_supply_chain_routes\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("supply chain import anchor missing")
          source = source.replace(
              import_anchor,
              import_anchor + "from .support_web import register_support_routes\n",
              1,
          )
          register_anchor = '''register_supply_chain_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash,\n    parse_date, get_inventory, ensure_inventory_editable, safe_filename,\n    ALLOWED_UPLOAD_EXTENSIONS, MAX_UPLOAD_SIZE,\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit("supply-chain registration anchor missing")
          source = source.replace(
              register_anchor,
              register_anchor + '''register_support_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n''',
              1,
          )
          main_path.write_text(source, encoding="utf-8")

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nSUPPORT_ROUTES = {\n    ("GET", "/soporte"),\n    ("GET", "/soporte/{ticket_id}"),\n    ("POST", "/soporte/nuevo"),\n    ("POST", "/soporte/{ticket_id}/mensajes"),\n    ("POST", "/soporte/{ticket_id}/actualizar"),\n    ("GET", "/api/soporte/resumen"),\n}\n\n\ndef _login(client: TestClient, email: str = "admin@calculatuhuella.local") -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v170_support_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/support_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/soporte"' not in main_source\n    assert '@app.post("/soporte/' not in main_source\n    assert '@app.get("/api/soporte/resumen"' not in main_source\n    assert "register_support_routes(" in main_source\n    assert module_source.count("@app.") == 6\n    assert "from .support_workflow import" in module_source\n    for name in (\n        "support_summary", "route_assignment", "response_deadline",\n        "add_support_message", "ticket_context", "ticket_overdue",\n    ):\n        assert f"def {name}(" not in module_source\n\n\ndef test_v170_support_route_contract_is_unique_and_complete():\n    actual = []\n    relevant_paths = {path for _, path in SUPPORT_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant_paths:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == SUPPORT_ROUTES\n    assert len(actual) == len(SUPPORT_ROUTES)\n\n\ndef test_v170_support_page_and_api_remain_operational():\n    with TestClient(app) as client:\n        _login(client)\n        page = client.get("/soporte")\n        summary = client.get("/api/soporte/resumen")\n        assert page.status_code == 200\n        assert "Centro de conversaciones y requerimientos" in page.text\n        assert summary.status_code == 200\n        payload = summary.json()\n        assert payload["version"] == "1.0.0"\n        assert {"open", "critical", "closed", "overdue", "waiting_client", "methodology"} <= set(payload["summary"])\n'''
          Path("tests/test_v170_support_routing.py").write_text(test, encoding="utf-8")

          doc = '''# V1.7 · Support HTTP\n\n## Baseline\n\n`app/support_workflow.py` ya es la autoridad de SLA, asignación por categoría, referencia pública, conversación, visibilidad de mensajes, estados y resumen operativo.\n\n## Corte\n\nLas seis rutas de soporte pasan de `app/main.py` a `app/support_web.py`:\n\n- centro de soporte;\n- detalle de caso;\n- creación;\n- conversación;\n- actualización de gestión;\n- API resumen.\n\n## Regla crítica\n\nEl corte mueve HTTP, no reglas de soporte. No se duplican `response_deadline`, `route_assignment`, `add_support_message`, `support_summary` ni controles de visibilidad cliente/equipo.\n\n## Gates\n\n- `tests/test_v050_support_and_factor_governance.py` protege SLA, referencia, asignación, notas internas, conversación y estado.\n- `tests/test_v170_support_routing.py` protege autoridad HTTP, unicidad y disponibilidad del centro/API.\n- suite completa, arquitectura y smoke deben quedar verdes antes del commit.\n'''
          Path("docs/architecture/V1_7_SUPPORT_ROUTING.md").write_text(doc, encoding="utf-8")
          PY
          python -m py_compile app/support_web.py app/main.py tests/test_v170_support_routing.py
          git diff --check
      - name: Targeted support contracts
        run: pytest -q tests/test_v170_support_routing.py tests/test_v050_support_and_factor_governance.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit support routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/support_web.py app/main.py tests/test_v170_support_routing.py docs/architecture/V1_7_SUPPORT_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract support HTTP surface"
          git push origin HEAD:refactor/v1-7-0-domain-surfaces
