name: V2.0 · Materializar CSRF portal proveedor

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-supplier-csrf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inyectar token CSRF server-side en portal proveedor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          security = Path('app/security.py')
          text = security.read_text(encoding='utf-8')
          old = '''        if should_set_cookie:\n            token = secrets.token_urlsafe(32)\n\n        body = b""\n'''
          new = '''        if should_set_cookie:\n            token = secrets.token_urlsafe(32)\n        scope.setdefault("state", {})["csrf_token"] = token\n\n        body = b""\n'''
          if text.count(old) != 1:
              raise SystemExit('No se encontró el punto de generación CSRF esperado')
          security.write_text(text.replace(old, new, 1), encoding='utf-8')

          template = Path('app/templates/supplier_portal.html')
          text = template.read_text(encoding='utf-8')
          old = '''    <form action="/proveedor/responder/{{ data_request.access_token }}" method="post" enctype="multipart/form-data" class="stack-form supplier-response-form" id="supplier-response-form">\n      <label>Método de respuesta'''
          new = '''    <form action="/proveedor/responder/{{ data_request.access_token }}" method="post" enctype="multipart/form-data" class="stack-form supplier-response-form" id="supplier-response-form">\n      <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">\n      <label>Método de respuesta'''
          if text.count(old) != 1:
              raise SystemExit('No se encontró el formulario público esperado')
          template.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile app/security.py app/supply_chain_web.py
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-supplier-csrf.yml
          git add app/security.py app/templates/supplier_portal.html
          git commit -m "fix(v2.0): protect supplier portal submissions with csrf"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
