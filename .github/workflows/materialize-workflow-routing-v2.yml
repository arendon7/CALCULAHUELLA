name: Materialize workflow routing V2

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-workflow-routing-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply reviewed workflow extraction and reconcile contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          materializer = Path('.github/workflows/materialize-workflow-routing.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          start = materializer.index(opening) + len(opening)
          end = materializer.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(materializer[start:end]), 'workflow-routing-v1.py', 'exec'), {})

          test_path = Path('tests/test_v160_workflow_routing.py')
          test = test_path.read_text(encoding='utf-8')
          old = '''    assert "/mi-trabajo" not in experience\n    assert "workflow_service" not in experience\n    assert "workflow_bridge" not in experience\n'''
          new = '''    # La guía conserva legítimamente un enlace hacia Mi trabajo; lo que se\n    # separa es la autoridad HTTP y sus dependencias de dominio/servicio.\n    assert '@app.get("/mi-trabajo"' not in experience\n    assert '@app.post("/mi-trabajo' not in experience\n    assert '@app.get("/api/mi-trabajo"' not in experience\n    assert "workflow_service" not in experience\n    assert "workflow_bridge" not in experience\n    assert '"href": "/mi-trabajo"' in experience\n'''
          if test.count(old) != 1:
              raise SystemExit('expected obsolete routing assertion exactly once')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile app/experience_web.py app/workflow_web.py app/main.py tests/test_v160_workflow_routing.py
          git diff --check
      - name: Targeted workflow contracts
        run: >-
          pytest -q
          tests/test_v160_workflow_routing.py
          tests/test_iteration15_canonical_workflow.py
          tests/test_iteration16_area_assignment.py
          tests/test_iteration16_work_items.py
          tests/test_iteration17_integrated_workflow.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit workflow routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/experience_web.py app/workflow_web.py app/main.py tests/test_v160_workflow_routing.py docs/architecture/V1_6_WORKFLOW_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract workflow HTTP surface"
          git push origin HEAD:refactor/v1-6-0-consolidation
