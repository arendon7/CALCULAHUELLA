name: V2.0 · Materializar lock Mac

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - requirements.txt
      - .github/workflows/materialize-v20-mac-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Generar lock transitivo con hashes
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.1.2' 'pip-tools==7.6.0'
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file=requirements-lock.txt \
            requirements.txt
          python -m pip install --dry-run --require-hashes -r requirements-lock.txt
      - name: Materializar lock en la rama V2.0
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements-lock.txt
          if git diff --cached --quiet; then
            echo 'El lock ya estaba actualizado.'
            exit 0
          fi
          git commit -m 'build(v2.0): freeze transitive dependencies with hashes'
          git push origin HEAD:stabilization/v2-0-0-product-readiness
