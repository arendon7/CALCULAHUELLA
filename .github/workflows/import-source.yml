name: Importar fuente v0.45.5

on:
  push:
    branches:
      - migration/v0.45.5
    paths:
      - .migration/source_v0_45_5.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer fuente canónica
        run: |
          set -euo pipefail
          rm -rf /tmp/calculahuella-source
          mkdir -p /tmp/calculahuella-source
          unzip -q .migration/source_v0_45_5.zip -d /tmp/calculahuella-source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='render.yaml' \
            /tmp/calculahuella-source/ ./
          rm -rf .migration
          rm -f .github/workflows/import-source.yml
          chmod +x scripts/*.sh scripts/*.command 2>/dev/null || true
          find . -name '*.command' -exec chmod +x {} + 2>/dev/null || true

      - name: Confirmar importación
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: importar base canónica v0.45.5'
          git push
