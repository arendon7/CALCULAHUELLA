name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "migration/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-only
      DATABASE_URL: sqlite+pysqlite:///./instance/ci.sqlite3
      SEED_DEMO: "true"
      OPEN_BROWSER: "0"
      CSRF_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      DEPLOYMENT_STRICT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar árbol fuente
        run: |
          missing=0
          for path in requirements-dev.txt run.py alembic.ini app tests migrations Dockerfile migration/tests; do
            if [[ ! -e "$path" ]]; then
              echo "::error file=$path::Falta $path en esta rama."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validar Python y scripts
        run: |
          python -m compileall -q app scripts tests migration/tests run.py
          find . -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -r -n1 bash -n

      - name: Validar herramientas de migración V0.49
        run: python -m pytest -q migration/tests/test_v049_migration_tools.py

      - name: Detectar versión runtime
        id: runtime
        run: |
          version="$(python - <<'PY'
          from app.config import settings
          print(settings.version)
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Runtime detectado: $version"

      - name: Migrar base limpia
        run: |
          mkdir -p instance
          rm -f instance/ci.sqlite3
          python -m alembic upgrade head

      - name: Compilar plantillas Jinja
        run: |
          python - <<'PY'
          from app.main import templates
          names = sorted(templates.env.list_templates())
          for name in names:
              templates.env.get_template(name)
          print(f"Plantillas compiladas: {len(names)}")
          PY

      - name: Validar contrato runtime V0.49
        if: steps.runtime.outputs.version == '0.49.0'
        run: |
          current="$(python -m alembic current 2>/dev/null | tr -d '\r')"
          echo "$current"
          echo "$current" | grep -q '20260804_0030'
          python - <<'PY'
          from app.config import settings
          from app.database import Base
          from app.main import app, templates

          template_names = sorted(templates.env.list_templates())
          assert settings.version == "0.49.0", settings.version
          assert len(app.routes) == 287, len(app.routes)
          assert len(Base.metadata.tables) == 110, len(Base.metadata.tables)
          assert len(template_names) == 65, len(template_names)
          assert "activity_factor_selections" in Base.metadata.tables
          for name in (
              "logo-oficial.png",
              "logo-oficial-blanco.png",
              "favicon-64.png",
              "favicon-256.png",
          ):
              matches = list(__import__("pathlib").Path("app/static").glob(f"**/img/brand/{name}"))
              assert matches, name
          print("Contrato runtime V0.49 aprobado")
          PY
          test -f platform/windows/OVERLAY_MANIFEST.json
          grep -R -q "Potenciado por Greenatics" app/templates
          grep -R -q "Huella Esencial" app/templates

      - name: Probar vista previa HTTP
        env:
          HOST: 127.0.0.1
          PORT: "8765"
          OPEN_BROWSER: "0"
          SESSION_HTTPS_ONLY: "false"
        run: |
          python run.py > instance/ci-preview.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat instance/ci-preview.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8765/
          curl -fsS -o /dev/null http://127.0.0.1:8765/login

      - name: Ejecutar regresión provisional v0.45.x
        if: steps.runtime.outputs.version != '0.49.0'
        run: |
          python -m pytest -q \
            tests/test_v045_product_intelligence.py \
            tests/test_v0451_user_experience.py \
            tests/test_v0452_brand_navigation.py \
            tests/test_v0453_guided_onboarding.py \
            tests/test_v0454_first_inventory.py \
            tests/test_v0455_guided_imports.py

      - name: Ejecutar regresión focalizada V0.49
        if: steps.runtime.outputs.version == '0.49.0'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          patterns = (
              "test_v049*.py",
              "test_v048*.py",
              "test_v047*.py",
              "test_v046*.py",
              "test_security*.py",
          )
          selected = sorted({
              path
              for pattern in patterns
              for path in Path("tests").glob(pattern)
          })
          if not selected:
              raise SystemExit("No se localizaron pruebas V0.46–V0.49 o seguridad")
          for path in selected:
              print(f"Ejecutando {path}")
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", str(path)],
                  check=True,
              )
          PY

      - name: Construir imagen Docker
        run: docker build -t calcula-tu-huella:${{ github.sha }} .
