name: Validación canónica

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verificar estructura canónica limpia
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/calculahuella-canonical-check
          mkdir -p /tmp/calculahuella-canonical-check
          rsync -a --exclude='.git/' ./ /tmp/calculahuella-canonical-check/
          cd /tmp/calculahuella-canonical-check
          python tools/verify_canonical.py --skip-manifest
      - name: Impedir crecimiento de deuda arquitectónica V1.6
        run: python scripts/audit_architecture.py --enforce
      - run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - run: python -m alembic upgrade head
        env:
          APP_ENV: local
          SEED_DEMO: "false"
          INSTANCE_DIR: ${{ runner.temp }}/cth-instance
