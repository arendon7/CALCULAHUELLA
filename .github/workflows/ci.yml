name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "migration/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-only
      DATABASE_URL: sqlite+pysqlite:///./instance/ci.sqlite3
      SEED_DEMO: "true"
      OPEN_BROWSER: "0"
      CSRF_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      DEPLOYMENT_STRICT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar árbol fuente
        run: |
          missing=0
          for path in requirements-dev.txt run.py alembic.ini app tests migrations Dockerfile; do
            if [[ ! -e "$path" ]]; then
              echo "::error file=$path::Falta $path en esta rama."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validar Python y scripts
        run: |
          python -m compileall -q app scripts tests run.py
          find . -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -r -n1 bash -n

      - name: Validar contrato de migración V0.48
        run: python -m pytest -q tests/test_v048_migration_contract.py

      - name: Migrar base limpia
        run: |
          mkdir -p instance
          rm -f instance/ci.sqlite3
          python -m alembic upgrade head

      - name: Compilar plantillas Jinja
        run: |
          python - <<'PY'
          from app.main import templates
          names = sorted(templates.env.list_templates())
          for name in names:
              templates.env.get_template(name)
          print(f"Plantillas compiladas: {len(names)}")
          PY

      - name: Ejecutar regresión v0.45.x
        run: |
          python -m pytest -q \
            tests/test_v045_product_intelligence.py \
            tests/test_v0451_user_experience.py \
            tests/test_v0452_brand_navigation.py \
            tests/test_v0453_guided_onboarding.py \
            tests/test_v0454_first_inventory.py \
            tests/test_v0455_guided_imports.py

      - name: Construir imagen Docker
        run: docker build -t calcula-tu-huella:${{ github.sha }} .
