name: Validación canónica

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/verify_canonical.py --skip-manifest
      - run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - run: python -m alembic upgrade head
        env:
          APP_ENV: local
          SEED_DEMO: "false"
          INSTANCE_DIR: ${{ runner.temp }}/cth-instance
