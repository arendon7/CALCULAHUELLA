name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "migration/**"
      - "integration/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-only
      DATABASE_URL: sqlite+pysqlite:///./instance/ci.sqlite3
      SEED_DEMO: "true"
      OPEN_BROWSER: "0"
      CSRF_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      DEPLOYMENT_STRICT: "false"
      SESSION_HTTPS_ONLY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar árbol fuente
        run: |
          missing=0
          for path in requirements-dev.txt run.py alembic.ini app tests migrations Dockerfile migration/current-release.json migration/tests scripts/migration scripts/preview; do
            if [[ ! -e "$path" ]]; then
              echo "::error file=$path::Falta $path en esta rama."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validar Python, shell y contrato de release
        run: |
          python -m compileall -q app scripts tests migration/tests run.py
          find . -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -r -n1 bash -n
          python -m pytest -q migration/tests/test_current_release_tools.py
          python - <<'PY'
          import json
          contract = json.load(open('migration/current-release.json', encoding='utf-8'))
          assert contract['channel'] == 'canonical-integration'
          assert contract['archive']['filename'].endswith('.zip')
          assert len(contract['archive']['sha256']) == 64
          print(f"Contrato actual: V{contract['release']} · {contract['status']}")
          PY

      - name: Detectar versión runtime y versión objetivo
        id: runtime
        run: |
          runtime="$(python - <<'PY'
          from app.config import settings
          print(settings.version)
          PY
          )"
          target="$(python - <<'PY'
          import json
          print(json.load(open('migration/current-release.json', encoding='utf-8'))['release'])
          PY
          )"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Runtime: $runtime · objetivo: $target"

      - name: Migrar base limpia
        run: |
          mkdir -p instance
          rm -f instance/ci.sqlite3
          python -m alembic upgrade head

      - name: Compilar plantillas Jinja
        run: |
          python - <<'PY'
          from app.main import templates
          names = sorted(templates.env.list_templates())
          for name in names:
              templates.env.get_template(name)
          print(f"Plantillas compiladas: {len(names)}")
          PY

      - name: Validar runtime canónico importado
        if: steps.runtime.outputs.runtime == steps.runtime.outputs.target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.config import settings
          from app.database import Base
          from app.main import app, templates

          contract = json.load(open('migration/current-release.json', encoding='utf-8'))
          expected = contract['runtime_contract']
          names = sorted(templates.env.list_templates())
          assert settings.version == contract['release']
          assert len(app.routes) == expected['routes'], len(app.routes)
          assert len(Base.metadata.tables) == expected['orm_models'], len(Base.metadata.tables)
          assert len(names) == expected['jinja_templates'], len(names)
          for asset in contract['required_brand_assets']:
              assert list(Path('app/static').glob(f'**/img/brand/{asset}')), asset
          assert Path('platform/windows/OVERLAY_MANIFEST.json').is_file()
          print('Runtime canónico aprobado')
          PY
          head="$(python - <<'PY'
          import json
          print(json.load(open('migration/current-release.json', encoding='utf-8'))['runtime_contract']['alembic_head'])
          PY
          )"
          python -m alembic current | grep -q "$head"

      - name: Probar vista HTTP y construir snapshot Pages
        env:
          HOST: 127.0.0.1
          PORT: "8765"
        run: |
          python run.py > instance/ci-preview.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat instance/ci-preview.log
            exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8765/
          curl -fsS -o /dev/null http://127.0.0.1:8765/login
          python scripts/preview/build_static_preview.py --output _site --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME"
          test -f _site/index.html
          test -f _site/login/index.html
          test -f _site/preview-status.json

      - name: Ejecutar regresión provisional
        if: steps.runtime.outputs.runtime != steps.runtime.outputs.target
        run: |
          python -m pytest -q \
            tests/test_v045_product_intelligence.py \
            tests/test_v0451_user_experience.py \
            tests/test_v0452_brand_navigation.py \
            tests/test_v0453_guided_onboarding.py \
            tests/test_v0454_first_inventory.py \
            tests/test_v0455_guided_imports.py

      - name: Ejecutar regresión de la release canónica
        if: steps.runtime.outputs.runtime == steps.runtime.outputs.target
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          patterns = (
              'test_v052*.py', 'test_v051*.py', 'test_v050*.py',
              'test_v049*.py', 'test_v048*.py', 'test_v047*.py',
              'test_v046*.py', 'test_security*.py'
          )
          selected = sorted({path for pattern in patterns for path in Path('tests').glob(pattern)})
          if not selected:
              raise SystemExit('No se localizaron pruebas focalizadas de la release')
          for path in selected:
              subprocess.run([sys.executable, '-m', 'pytest', '-q', str(path)], check=True)
          PY

      - name: Construir imagen Docker
        run: docker build -t calcula-tu-huella:${{ github.sha }} .
