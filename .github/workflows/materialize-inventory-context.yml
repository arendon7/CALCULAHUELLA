name: Materialize inventory context

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-inventory-context.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract inventory context helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path("app/main.py")
          source = main_path.read_text(encoding="utf-8")
          start_marker = "def get_inventory(session: Session, user: dict[str, object], inventory_id: int | None = None) -> Inventory:\n"
          end_marker = "def review_gate_summary(session: Session, inventory: Inventory) -> dict[str, object]:\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("inventory context boundaries are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + "\n"
          required_defs = (
              "def get_inventory(",
              "def inventory_metrics(",
              "def ensure_inventory_editable(",
              "def get_source_for_user(",
          )
          if any(block.count(name) != 1 for name in required_defs):
              raise SystemExit("inventory context helper inventory is unexpected")

          module_header = '''from __future__ import annotations\n\nfrom fastapi import HTTPException\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .accounting import is_gross_source\nfrom .db.models import (\n    ActivityData,\n    ActivityIndicator,\n    EmissionSource,\n    Inventory,\n    InventoryFacility,\n    ReductionAction,\n    ReductionScenario,\n    ReductionScenarioAction,\n    VerificationFinding,\n)\n\n\n'''
          Path("app/inventory_context.py").write_text(module_header + block, encoding="utf-8")

          source = source[:start] + source[end:]
          import_anchor = "from .accounting import is_gross_source\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("accounting import anchor missing")
          source = source.replace(
              import_anchor,
              import_anchor + '''from .inventory_context import (\n    ensure_inventory_editable,\n    get_inventory,\n    get_source_for_user,\n    inventory_metrics,\n)\n''',
              1,
          )
          main_path.write_text(source, encoding="utf-8")

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\nimport pytest\nfrom fastapi import HTTPException\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nimport app.inventory_context as inventory_context\nimport app.main as main_module\nfrom app.accounting import is_gross_source\nfrom app.db.base import SessionLocal\nfrom app.db.models import EmissionSource, Inventory\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _login(client: TestClient) -> None:\n    response = client.post(\n        "/login",\n        data={"email": "admin@calculatuhuella.local", "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v160_inventory_context_has_dedicated_authority_and_compatible_facade_imports():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    context_source = (ROOT / "app/inventory_context.py").read_text(encoding="utf-8")\n    for name in ("get_inventory", "inventory_metrics", "ensure_inventory_editable", "get_source_for_user"):\n        assert f"def {name}(" not in main_source\n        assert f"def {name}(" in context_source\n        assert getattr(main_module, name) is getattr(inventory_context, name)\n    assert "from .db.models import" in context_source\n    assert "from .main import" not in context_source\n    assert "from .database import" not in context_source\n\n\ndef test_v160_inventory_and_source_access_remain_scoped_to_active_organization():\n    with SessionLocal() as session:\n        inventory = session.scalar(select(Inventory).order_by(Inventory.id))\n        source = session.scalar(select(EmissionSource).order_by(EmissionSource.id))\n        assert inventory is not None\n        assert source is not None\n\n        user = {"organization_id": inventory.organization_id}\n        loaded = inventory_context.get_inventory(session, user, inventory.id)\n        assert loaded.id == inventory.id\n        assert loaded.organization_id == inventory.organization_id\n\n        foreign_user = {"organization_id": int(inventory.organization_id) + 999999}\n        with pytest.raises(HTTPException) as inventory_error:\n            inventory_context.get_inventory(session, foreign_user, inventory.id)\n        assert inventory_error.value.status_code == 404\n        assert inventory_error.value.detail == "Inventario no encontrado"\n\n        source_inventory = session.get(Inventory, source.inventory_id)\n        assert source_inventory is not None\n        source_user = {"organization_id": source_inventory.organization_id}\n        loaded_source = inventory_context.get_source_for_user(session, source_user, source.id)\n        assert loaded_source.id == source.id\n        foreign_source_user = {"organization_id": int(source_inventory.organization_id) + 999999}\n        with pytest.raises(HTTPException) as source_error:\n            inventory_context.get_source_for_user(session, foreign_source_user, source.id)\n        assert source_error.value.status_code == 404\n        assert source_error.value.detail == "Fuente no encontrada"\n\n\ndef test_v160_inventory_editability_contract_is_unchanged():\n    inventory_context.ensure_inventory_editable(SimpleNamespace(locked=False, status="Borrador"))\n    for candidate in (\n        SimpleNamespace(locked=True, status="Borrador"),\n        SimpleNamespace(locked=False, status="Cerrado"),\n    ):\n        with pytest.raises(HTTPException) as error:\n            inventory_context.ensure_inventory_editable(candidate)\n        assert error.value.status_code == 409\n        assert "cerrado e inmutable" in error.value.detail\n\n\ndef test_v160_inventory_metrics_preserve_existing_semantics():\n    with SessionLocal() as session:\n        inventory = session.scalar(select(Inventory).order_by(Inventory.id))\n        assert inventory is not None\n        loaded = inventory_context.get_inventory(\n            session, {"organization_id": inventory.organization_id}, inventory.id\n        )\n        metrics = inventory_context.inventory_metrics(loaded)\n        included = [source for source in loaded.sources if is_gross_source(source)]\n        assert metrics["total"] == round(sum(source.emissions for source in included), 1)\n        assert metrics["scopes"] == {\n            scope: round(sum(source.emissions for source in included if source.scope == scope), 1)\n            for scope in (1, 2, 3)\n        }\n        assert len(metrics["monthly_series"]) == 12\n        assert {item["month"] for item in metrics["monthly_series"]} == {\n            "Ene", "Feb", "Mar", "Abr", "May", "Jun",\n            "Jul", "Ago", "Sep", "Oct", "Nov", "Dic",\n        }\n\n\ndef test_v160_inventory_routes_still_use_extracted_context():\n    with TestClient(app) as client:\n        _login(client)\n        inventories = client.get("/inventarios")\n        alias = client.get("/inventario", follow_redirects=False)\n        assert inventories.status_code == 200\n        assert alias.status_code == 303\n        detail = client.get(alias.headers["location"])\n        assert detail.status_code == 200\n'''
          Path("tests/test_v160_inventory_context.py").write_text(test, encoding="utf-8")

          doc = '''# V1.6 · Inventory Context\n\n## Estado previo\n\nLas rutas de organizaciones e inventarios ya estaban separadas en `organizations_web.py` e `inventories_web.py`. La deuda residual era transversal: `main.py` seguía siendo propietario de cuatro helpers de acceso y contexto que se inyectaban a múltiples módulos.\n\n## Corte materializado\n\n`app/inventory_context.py` pasa a ser la autoridad de:\n\n- `get_inventory`;\n- `get_source_for_user`;\n- `ensure_inventory_editable`;\n- `inventory_metrics`.\n\n`app/main.py` importa esas funciones y mantiene las mismas referencias que entrega a los registradores de rutas, por lo que no cambian sus firmas ni contratos.\n\n## Límites\n\n- No se mueven rutas HTTP en este corte.\n- No se modifican modelos ORM ni migraciones.\n- No se alteran emisiones, factores, GWP, fórmulas ni estados.\n- No se modifican `review_gate_summary`, `clone_inventory_version` ni otros helpers de negocio.\n- El nuevo módulo consume directamente los modelos canónicos de `app.db.models` y no importa `main.py` ni `database.py`.\n\n## Contratos\n\n1. Inventario y fuente siguen aislados por `organization_id`.\n2. Inventarios cerrados/bloqueados conservan HTTP 409.\n3. Las métricas conservan total, alcances y serie mensual.\n4. `/inventarios`, `/inventario` y el detalle de inventario permanecen operativos.\n5. Suite completa, arquitectura y smoke deben quedar verdes antes del commit.\n'''
          Path("docs/architecture/V1_6_INVENTORY_CONTEXT.md").write_text(doc, encoding="utf-8")
          PY
          python -m py_compile app/inventory_context.py app/main.py tests/test_v160_inventory_context.py
          git diff --check
      - name: Targeted inventory context contracts
        run: >-
          pytest -q
          tests/test_v160_inventory_context.py
          tests/test_v160_user_context.py
          tests/test_v160_org_context.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit inventory context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inventory_context.py app/main.py tests/test_v160_inventory_context.py docs/architecture/V1_6_INVENTORY_CONTEXT.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(inventory): extract shared context authority"
          git push origin HEAD:refactor/v1-6-0-consolidation
