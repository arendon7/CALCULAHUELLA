name: V2.60.7 · Monetary precision gate

on:
  pull_request:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - "app/money.py"
      - "app/commercial_pricing.py"
      - "app/commercial_web.py"
      - "app/payment_web.py"
      - "app/commercial_operations_web.py"
      - "app/saas_admin_web.py"
      - "app/db/models/commercial.py"
      - "app/db/models/revenue.py"
      - "migrations/versions/20260824_0042_v2607_monetary_precision.py"
      - "tests/test_v2605_commercial_authority.py"
      - "tests/test_v2606_revenue_operations_truth.py"
      - "tests/test_v2606_activation_invoice_integrity.py"
      - "tests/test_v2607_monetary_precision.py"
      - ".github/workflows/v2607-monetary-precision-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-monetary-precision:
    name: Monetary precision · SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local
      SEED_DEMO: "true"
      SCHEDULER_ENABLED: "0"
      STRUCTURED_LOGGING: "0"
      PBKDF2_ITERATIONS: "10000"
      CSRF_ENABLED: "1"
      STORAGE_BACKEND: local
      BACKUP_OFFSITE_ENABLED: "0"
      INSTANCE_DIR: /tmp/cth-v2607-sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Compilar superficie V2.60.7
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/cth-v2607-pycache" python -m compileall -q \
            app/money.py \
            app/commercial_pricing.py \
            app/commercial_web.py \
            app/payment_web.py \
            app/commercial_operations_web.py \
            app/saas_admin_web.py \
            app/db/models/commercial.py \
            app/db/models/revenue.py \
            migrations/versions/20260824_0042_v2607_monetary_precision.py \
            tests/test_v2607_monetary_precision.py

      - name: Contratos monetarios
        run: |
          pytest -q \
            tests/test_v2605_commercial_authority.py \
            tests/test_v2606_revenue_operations_truth.py \
            tests/test_v2606_activation_invoice_integrity.py \
            tests/test_v2607_monetary_precision.py \
            --junitxml=v2607-monetary-precision.xml

      - name: Fresh migration SQLite
        run: |
          rm -rf "${INSTANCE_DIR}"
          mkdir -p "${INSTANCE_DIR}"
          python -m alembic upgrade head
          python -m alembic current
          python - <<'PY'
          from sqlalchemy import Float, Numeric, inspect
          from app.db.base import ENGINE

          inspector = inspect(ENGINE)
          assert len(inspector.get_table_names()) == 124

          def check(table, column, precision, scale):
              item = next(entry for entry in inspector.get_columns(table) if entry["name"] == column)
              assert isinstance(item["type"], Numeric), (table, column, item["type"])
              assert item["type"].precision == precision, (table, column, item["type"])
              assert item["type"].scale == scale, (table, column, item["type"])

          for table, column in [
              ("service_plans", "monthly_fee"),
              ("service_plans", "annual_fee"),
              ("billing_invoices", "amount"),
              ("billing_invoices", "net_amount"),
              ("billing_invoices", "tax_amount"),
              ("billing_invoices", "total_amount"),
              ("commercial_proposals", "implementation_fee"),
              ("commercial_proposals", "recurring_fee"),
              ("commercial_proposals", "discount_amount"),
              ("commercial_proposals", "first_year_total"),
              ("payment_transactions", "amount"),
              ("service_contracts", "contract_value"),
              ("renewal_opportunities", "forecast_amount"),
          ]:
              check(table, column, 18, 2)
          check("commercial_proposals", "tax_rate", 9, 6)
          check("billing_invoices", "tax_rate_snapshot", 9, 6)
          check("organization_subscriptions", "custom_monthly_fee", 18, 6)

          usage = next(entry for entry in inspector.get_columns("usage_counters") if entry["name"] == "value")
          assert isinstance(usage["type"], Float)
          PY

      - name: Round-trip histórico 0041 a 0042 SQLite
        run: |
          python -m alembic downgrade 20260824_0041
          python -m alembic current
          python - <<'PY'
          from decimal import Decimal
          from sqlalchemy import Float, inspect
          from app.db.base import ENGINE, SessionLocal
          from app.db.models import ServicePlan

          inspector = inspect(ENGINE)
          monthly = next(entry for entry in inspector.get_columns("service_plans") if entry["name"] == "monthly_fee")
          assert isinstance(monthly["type"], Float), monthly["type"]

          with SessionLocal() as session:
              existing = session.query(ServicePlan).filter(ServicePlan.code == "V2607-LEGACY").first()
              if not existing:
                  session.add(ServicePlan(
                      code="V2607-LEGACY",
                      name="V2607 legacy float",
                      description="Representación previa a 0042",
                      monthly_fee=Decimal("0.10"),
                      annual_fee=Decimal("1200001.99"),
                      max_users=1,
                      max_facilities=1,
                      max_inventories=1,
                      max_storage_mb=100,
                      active=True,
                  ))
                  session.commit()
          PY
          python -m alembic upgrade head
          python -m alembic current
          python - <<'PY'
          from decimal import Decimal
          from sqlalchemy import Numeric, inspect, select
          from app.db.base import ENGINE, SessionLocal
          from app.db.models import ServicePlan

          inspector = inspect(ENGINE)
          monthly = next(entry for entry in inspector.get_columns("service_plans") if entry["name"] == "monthly_fee")
          assert isinstance(monthly["type"], Numeric)
          assert (monthly["type"].precision, monthly["type"].scale) == (18, 2)

          with SessionLocal() as session:
              plan = session.scalar(select(ServicePlan).where(ServicePlan.code == "V2607-LEGACY"))
              assert plan is not None
              assert isinstance(plan.monthly_fee, Decimal)
              assert plan.monthly_fee == Decimal("0.10")
              assert plan.annual_fee == Decimal("1200001.99")
          PY

      - name: Publicar evidencia SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2607-monetary-precision-sqlite
          path: v2607-monetary-precision.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-monetary-precision:
    name: Monetary precision · PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cth
          POSTGRES_PASSWORD: cthpass
          POSTGRES_DB: calculahuella_v2607
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cth -d calculahuella_v2607"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      SEED_DEMO: "false"
      SCHEDULER_ENABLED: "0"
      STRUCTURED_LOGGING: "0"
      PBKDF2_ITERATIONS: "10000"
      CSRF_ENABLED: "1"
      DATABASE_URL: postgresql+psycopg://cth:cthpass@127.0.0.1:5432/calculahuella_v2607
      INSTANCE_DIR: /tmp/cth-v2607-postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Fresh y round-trip histórico PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade 20260824_0041
          python - <<'PY'
          from decimal import Decimal
          from sqlalchemy import Float, inspect
          from app.db.base import ENGINE, SessionLocal
          from app.db.models import ServicePlan

          inspector = inspect(ENGINE)
          monthly = next(entry for entry in inspector.get_columns("service_plans") if entry["name"] == "monthly_fee")
          assert isinstance(monthly["type"], Float), monthly["type"]
          with SessionLocal() as session:
              session.add(ServicePlan(
                  code="V2607-PG-LEGACY",
                  name="V2607 PostgreSQL legacy float",
                  description="Representación previa a 0042",
                  monthly_fee=Decimal("0.10"),
                  annual_fee=Decimal("1200001.99"),
                  max_users=1,
                  max_facilities=1,
                  max_inventories=1,
                  max_storage_mb=100,
                  active=True,
              ))
              session.commit()
          PY
          python -m alembic upgrade head
          python -m alembic current
          python - <<'PY'
          from decimal import Decimal
          from sqlalchemy import Numeric, inspect, select
          from app.db.base import ENGINE, SessionLocal
          from app.db.models import ServicePlan

          inspector = inspect(ENGINE)
          assert len(inspector.get_table_names()) == 124
          monthly = next(entry for entry in inspector.get_columns("service_plans") if entry["name"] == "monthly_fee")
          assert isinstance(monthly["type"], Numeric)
          assert (monthly["type"].precision, monthly["type"].scale) == (18, 2)
          with SessionLocal() as session:
              plan = session.scalar(select(ServicePlan).where(ServicePlan.code == "V2607-PG-LEGACY"))
              assert plan is not None
              assert isinstance(plan.monthly_fee, Decimal)
              assert plan.monthly_fee == Decimal("0.10")
              assert plan.annual_fee == Decimal("1200001.99")
          PY

      - name: Publicar evidencia PostgreSQL
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("v2607-postgres-evidence.json").write_text(
              json.dumps({"migration": "20260824_0042", "round_trip": "0042->0041->0042", "status": "passed"}),
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2607-monetary-precision-postgres
          path: v2607-postgres-evidence.json
          if-no-files-found: warn
          retention-days: 14
