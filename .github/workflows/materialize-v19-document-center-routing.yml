name: Materialize V1.9 document center routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-document-center-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Document Center HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/centro-documental", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/alistamiento", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('document center boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 3:
              raise SystemExit(f"expected 3 document center routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom datetime import date\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import add_audit, get_db\nfrom .db.models import DocumentControlRecord, EvidenceDocument, Inventory, ReportArtifact\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_document_center_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date, get_inventory\n) -> None:\n' + indented
          Path('app/document_center_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .platform_admin_web import register_platform_admin_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('platform admin import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .document_center_web import register_document_center_routes\n', 1)
          register_anchor = '''register_platform_admin_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('platform admin registration anchor missing')
          registration = '''register_document_center_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date, get_inventory\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nDOCUMENT_ROUTES = {\n    ("GET", "/centro-documental"),\n    ("POST", "/centro-documental/registros/nuevo"),\n    ("POST", "/centro-documental/registros/{record_id}/actualizar"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_document_center_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/document_center_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/centro-documental"' not in main_source\n    assert '@app.post("/centro-documental/' not in main_source\n    assert "register_document_center_routes(" in main_source\n    assert module_source.count("@app.") == 3\n    assert "DocumentControlRecord" in module_source\n    assert "EvidenceDocument" in module_source\n    assert "ReportArtifact" in module_source\n    assert '@app.get("/alistamiento"' not in module_source\n\n\ndef test_v190_document_center_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in DOCUMENT_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == DOCUMENT_ROUTES\n    assert len(actual) == len(DOCUMENT_ROUTES)\n\n\ndef test_v190_document_center_remains_permission_bound():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/centro-documental").status_code == 403\n        client.post("/logout")\n        _login(client, "consultor@calculatuhuella.local")\n        assert client.get("/centro-documental").status_code == 200\n'''
          Path('tests/test_v190_document_center_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Document Center HTTP\n\n## Autoridad\n\n`app/document_center_web.py` pasa a ser la autoridad HTTP de tres contratos: registro maestro, alta de documento controlado y actualización de su estado/versionado.\n\n## Semántica preservada\n\nSe mantienen código único por organización, versión, dueño, confidencialidad, retención, fecha de revisión, vínculo opcional a inventario/evidencia/informe y propagación de SHA-256 desde artefactos vinculados.\n\n## Acceso e aislamiento\n\nLas tres rutas continúan exigiendo `manage_documents`; registros, evidencias e informes se restringen a la organización activa.\n\n## Gates\n\nV0.13 protege creación persistente, retención e inventario vinculado. El contrato V1.9 protege autoridad HTTP, unicidad y permisos.\n'''
          Path('docs/architecture/V1_9_DOCUMENT_CENTER_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/document_center_web.py app/main.py tests/test_v190_document_center_routing.py
          git diff --check
      - name: Targeted V1.9 Document Center authority
        run: pytest -q tests/test_v190_document_center_routing.py
      - name: Historical V0.13 document control contract
        run: pytest -q tests/test_app.py -k "v013_document_control_register"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Document Center routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/document_center_web.py app/main.py tests/test_v190_document_center_routing.py docs/architecture/V1_9_DOCUMENT_CENTER_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract document center HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
