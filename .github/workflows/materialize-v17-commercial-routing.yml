name: Materialize V1.7 commercial routing

on:
  push:
    branches: [refactor/v1-7-0-domain-surfaces]
    paths:
      - .github/workflows/materialize-v17-commercial-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-7-0-domain-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract commercial proposal HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _proposal_items(raw: str) -> list[str]:\n'
          end_marker = '@app.post("/propuesta/{token}/aceptar")\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('commercial proposal boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 5:
              raise SystemExit(f"expected 5 commercial proposal routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nimport json\nimport secrets\nfrom datetime import UTC, date, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .config import settings\nfrom .database import get_db\nfrom .db.models import CommercialLead, CommercialProposal, PaymentTransaction, ServicePlan\n\n\ndef register_commercial_routes(\n    app,\n    templates,\n    common_context,\n    require_user,\n    ensure_capability,\n    set_flash,\n    parse_date,\n) -> None:\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          Path('app/commercial_web.py').write_text(header + indented, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .support_web import register_support_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('support import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .commercial_web import register_commercial_routes\n', 1)

          register_anchor = '''register_support_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('support registration anchor missing')
          source = source.replace(
              register_anchor,
              register_anchor + '''register_commercial_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n''',
              1,
          )
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nfrom app.db.base import SessionLocal\nfrom app.db.models import CommercialProposal\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nCOMMERCIAL_ROUTES = {\n    ("GET", "/comercial"),\n    ("POST", "/comercial/leads/{lead_id}/estado"),\n    ("POST", "/comercial/propuestas/nueva"),\n    ("POST", "/comercial/propuestas/{proposal_id}/enviar"),\n    ("GET", "/propuesta/{token}"),\n}\n\n\ndef _login(client: TestClient) -> None:\n    response = client.post(\n        "/login",\n        data={"email": "admin@calculatuhuella.local", "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v170_commercial_proposals_have_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/commercial_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/comercial"' not in main_source\n    assert '@app.post("/comercial/leads/' not in main_source\n    assert '@app.post("/comercial/propuestas/' not in main_source\n    assert '@app.get("/propuesta/{token}"' not in main_source\n    # Acceptance/payment intentionally stay outside this cut.\n    assert '@app.post("/propuesta/{token}/aceptar"' in main_source\n    assert "register_commercial_routes(" in main_source\n    assert module_source.count("@app.") == 5\n    assert "PaymentTransaction" in module_source\n    assert '@app.post("/propuesta/{token}/aceptar"' not in module_source\n\n\ndef test_v170_commercial_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in COMMERCIAL_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == COMMERCIAL_ROUTES\n    assert len(actual) == len(COMMERCIAL_ROUTES)\n\n\ndef test_v170_commercial_center_and_public_proposal_remain_available():\n    with SessionLocal() as session:\n        proposal = session.scalar(select(CommercialProposal).order_by(CommercialProposal.id))\n        assert proposal is not None\n        token = proposal.public_token\n    with TestClient(app) as client:\n        _login(client)\n        assert client.get("/comercial").status_code == 200\n        public = client.get(f"/propuesta/{token}")\n        assert public.status_code == 200\n        assert proposal.reference in public.text\n'''
          Path('tests/test_v170_commercial_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.7 · Commercial proposal HTTP\n\n## Corte 1 de Commercial / Payments\n\nSe extraen a `app/commercial_web.py` únicamente las superficies de gestión y consulta de propuestas:\n\n- centro comercial;\n- estado del prospecto;\n- creación de propuesta;\n- marcado como enviada;\n- vista pública de propuesta.\n\n## Fuera de alcance\n\nAceptación/rechazo, creación de `PaymentTransaction`, pantalla de pago, confirmación y webhook permanecen en `app/main.py` para un segundo corte independiente.\n\n## Regla de riesgo\n\nLa vista pública puede leer la última transacción asociada, pero este módulo no crea ni concilia pagos. El test histórico `test_commercial_proposal_acceptance_and_demo_payment` debe seguir verde para demostrar compatibilidad end-to-end.\n'''
          Path('docs/architecture/V1_7_COMMERCIAL_PROPOSAL_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/commercial_web.py app/main.py tests/test_v170_commercial_routing.py
          git diff --check
      - name: Targeted commercial contracts
        run: >-
          pytest -q
          tests/test_v170_commercial_routing.py
          tests/test_app.py -k "commercial_proposal_acceptance_and_demo_payment"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit commercial routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/commercial_web.py app/main.py tests/test_v170_commercial_routing.py docs/architecture/V1_7_COMMERCIAL_PROPOSAL_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract commercial proposal HTTP surface"
          git push origin HEAD:refactor/v1-7-0-domain-surfaces
