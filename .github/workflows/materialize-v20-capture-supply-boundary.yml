name: V2.0 · Materializar frontera captura-proveedores

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-capture-supply-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Separar captura operativa de cadena de valor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guidance = Path('app/capture_guidance.py')
          text = guidance.read_text(encoding='utf-8')
          old = '''FREQUENCY_MONTHS = {
              "mensual": 1,
              "bimestral": 2,
              "trimestral": 3,
              "semestral": 6,
              "anual": 12,
          }
          '''
          new = old + '''\nSUPPLIER_MANAGED_CATEGORY = "Datos específicos de proveedores"\n\n\ndef is_activity_capture_source(source: Any) -> bool:\n    """Return whether a source is managed through operational activity capture.\n\n    Supplier-consolidated Scope 3 sources are synchronized from approved supplier\n    responses and must never be completed by creating ActivityData records.\n    """\n    return str(getattr(source, "category", "") or "").strip() != SUPPLIER_MANAGED_CATEGORY\n'''
          if text.count(old) != 1:
              raise SystemExit('No se encontró exactamente una vez FREQUENCY_MONTHS')
          text = text.replace(old, new, 1)
          old_cards = 'cards = [source_capture_card(inventory, source) for source in inventory.sources if source.included]'
          new_cards = 'cards = [source_capture_card(inventory, source) for source in inventory.sources if source.included and is_activity_capture_source(source)]'
          if text.count(old_cards) != 1:
              raise SystemExit('No se encontró exactamente una vez el selector de capture_summary')
          guidance.write_text(text.replace(old_cards, new_cards, 1), encoding='utf-8')

          web = Path('app/capture_web.py')
          text = web.read_text(encoding='utf-8')
          old_import = 'from .capture_guidance import capture_summary'
          new_import = 'from .capture_guidance import capture_summary, is_activity_capture_source'
          if text.count(old_import) != 1:
              raise SystemExit('Import de capture_summary inesperado')
          text = text.replace(old_import, new_import, 1)
          old_guard = '''        if not source:\n            raise HTTPException(400, "Fuente inválida")\n        if unit not in allowed_units or data_origin not in data_origins:\n'''
          new_guard = '''        if not source:\n            raise HTTPException(400, "Fuente inválida")\n        if not is_activity_capture_source(source):\n            raise HTTPException(409, "Esta fuente se gestiona desde Cadena de valor y no admite captura operativa directa")\n        if unit not in allowed_units or data_origin not in data_origins:\n'''
          if text.count(old_guard) != 1:
              raise SystemExit('Guard de fuente inesperado')
          web.write_text(text.replace(old_guard, new_guard, 1), encoding='utf-8')
          PY
          python -m py_compile app/capture_guidance.py app/capture_web.py scripts/browser_climate_journey_gate.py
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-capture-supply-boundary.yml
          git add app/capture_guidance.py app/capture_web.py
          git commit -m "fix(v2.0): separate activity capture from supplier consolidation"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
