name: Paquete Mac reproducible

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/package-mac-selfcontained.yml
      - packaging/mac/**
      - requirements.txt
      - requirements-lock.txt
      - tests/test_v200_mac_package_reproducibility.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_VERSION: "1.0.0"
  PYTHON_RUNTIME_VERSION: "3.12.13"
  PYTHON_BUILD_STANDALONE_TAG: "20260807"
  PYTHON_ARM64_ASSET: "cpython-3.12.13+20260807-aarch64-apple-darwin-install_only_stripped.tar.gz"
  PYTHON_ARM64_SHA256: "25baa97c65b3f0aa90e21131b4f9e80aef8899e8144006db8a9d2c1ab9e807e3"
  PYTHON_X86_64_ASSET: "cpython-3.12.13+20260807-x86_64-apple-darwin-install_only_stripped.tar.gz"
  PYTHON_X86_64_SHA256: "127053f1736f721e391ddb46f07585d05756e15bb8d757d3bbc0519738998ba1"

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Preparar herramientas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip rsync
          python -m pip install 'pip==26.1.2'

      - name: Verificar contratos del paquete
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          pytest -q tests/test_v200_mac_package_reproducibility.py
          python -m pip install --dry-run --require-hashes -r requirements-lock.txt

      - name: Descargar y verificar runtimes Python fijados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pack/downloads .pack/runtime/arm64 .pack/runtime/x86_64

          BASE_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_BUILD_STANDALONE_TAG}"
          curl --fail --location --retry 3 --output ".pack/downloads/${PYTHON_ARM64_ASSET}" "${BASE_URL}/${PYTHON_ARM64_ASSET}"
          curl --fail --location --retry 3 --output ".pack/downloads/${PYTHON_X86_64_ASSET}" "${BASE_URL}/${PYTHON_X86_64_ASSET}"

          printf '%s  %s\n' "$PYTHON_ARM64_SHA256" ".pack/downloads/${PYTHON_ARM64_ASSET}" | sha256sum -c -
          printf '%s  %s\n' "$PYTHON_X86_64_SHA256" ".pack/downloads/${PYTHON_X86_64_ASSET}" | sha256sum -c -

          export BASE_URL
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = {}
          for arch, name_key, sha_key in (
              ("arm64", "PYTHON_ARM64_ASSET", "PYTHON_ARM64_SHA256"),
              ("x86_64", "PYTHON_X86_64_ASSET", "PYTHON_X86_64_SHA256"),
          ):
              name = os.environ[name_key]
              path = Path(".pack/downloads") / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = os.environ[sha_key]
              if actual != expected:
                  raise SystemExit(f"Checksum inesperado para {arch}: {actual}")
              assets[arch] = {
                  "name": name,
                  "url": f"{os.environ['BASE_URL']}/{name}",
                  "sha256": actual,
              }

          payload = {
              "provider": "astral-sh/python-build-standalone",
              "release_tag": os.environ["PYTHON_BUILD_STANDALONE_TAG"],
              "python_version": os.environ["PYTHON_RUNTIME_VERSION"],
              "assets": assets,
          }
          Path(".pack/python-assets.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then
              ARCHIVE=".pack/downloads/${PYTHON_ARM64_ASSET}"
            else
              ARCHIVE=".pack/downloads/${PYTHON_X86_64_ASSET}"
            fi
            TMP=".pack/extract-${ARCH}"
            mkdir -p "$TMP"
            tar -xzf "$ARCHIVE" -C "$TMP"
            PYDIR="$(find "$TMP" -maxdepth 2 -type d -name python -print -quit)"
            test -n "$PYDIR"
            rsync -a "$PYDIR/" ".pack/runtime/${ARCH}/python/"
          done

      - name: Construir wheelhouse bloqueado para ambas arquitecturas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pack/wheelhouse/arm64 .pack/wheelhouse/x86_64

          python -m pip download \
            --require-hashes \
            --dest .pack/wheelhouse/arm64 \
            --only-binary=:all: \
            --platform macosx_11_0_arm64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            -r requirements-lock.txt

          python -m pip download \
            --require-hashes \
            --dest .pack/wheelhouse/x86_64 \
            --only-binary=:all: \
            --platform macosx_10_13_x86_64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            -r requirements-lock.txt

          (
            cd .pack/wheelhouse
            find . -type f -print0 | sort -z | xargs -0 sha256sum > ../WHEELHOUSE_SHA256.txt
          )

      - name: Construir distribución y procedencia verificable
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          VERSION_DIR="Calcula_Tu_Huella_Mac_Autocontenida_v1_0_0_${SHORT_SHA}"
          ROOT=".pack/${VERSION_DIR}"
          mkdir -p "$ROOT/source" "$ROOT/runtime" "$ROOT/wheelhouse"

          rsync -a ./ "$ROOT/source/" \
            --exclude '.git/' \
            --exclude '.pack/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.venv/' \
            --exclude 'instance/' \
            --exclude '*.db' \
            --exclude '.DS_Store'

          rsync -a .pack/runtime/ "$ROOT/runtime/"
          rsync -a .pack/wheelhouse/ "$ROOT/wheelhouse/"
          cp packaging/mac/* "$ROOT/"
          cp .pack/python-assets.json "$ROOT/PYTHON_RUNTIME_ORIGEN.json"
          cp .pack/WHEELHOUSE_SHA256.txt "$ROOT/WHEELHOUSE_SHA256.txt"

          LOCK_SHA="$(sha256sum requirements-lock.txt | awk '{print $1}')"
          WHEELHOUSE_MANIFEST_SHA="$(sha256sum .pack/WHEELHOUSE_SHA256.txt | awk '{print $1}')"
          SOURCE_COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          export LOCK_SHA WHEELHOUSE_MANIFEST_SHA SOURCE_COMMIT_TIME

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".pack") / f"Calcula_Tu_Huella_Mac_Autocontenida_v1_0_0_{os.environ['GITHUB_SHA'][:12]}"
          runtime = json.loads(Path(".pack/python-assets.json").read_text(encoding="utf-8"))
          payload = {
              "schema_version": 1,
              "product_version": os.environ["PRODUCT_VERSION"],
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF_NAME"],
              "source_commit_time": os.environ["SOURCE_COMMIT_TIME"],
              "requirements_lock_sha256": os.environ["LOCK_SHA"],
              "wheelhouse_manifest_sha256": os.environ["WHEELHOUSE_MANIFEST_SHA"],
              "python": {
                  "provider": runtime["provider"],
                  "release_tag": runtime["release_tag"],
                  "version": runtime["python_version"],
                  "assets": runtime["assets"],
              },
          }
          (root / "BUILD_PROVENANCE.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          find "$ROOT" -name '*.command' -exec chmod +x {} +
          find "$ROOT/runtime" -path '*/bin/python*' -exec chmod +x {} + || true

          (
            cd "$ROOT"
            find . -type f ! -name MANIFEST_SHA256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )

          COMMIT_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          find "$ROOT" -exec touch -h -d "@${COMMIT_EPOCH}" {} +

          (
            cd .pack
            find "$VERSION_DIR" -print | LC_ALL=C sort | zip -X -q -y "${VERSION_DIR}.zip" -@
            find "$VERSION_DIR" -print | LC_ALL=C sort | zip -X -q -y "${VERSION_DIR}.rebuild.zip" -@
          )
          cmp ".pack/${VERSION_DIR}.zip" ".pack/${VERSION_DIR}.rebuild.zip"
          rm ".pack/${VERSION_DIR}.rebuild.zip"

          ZIP_SHA="$(sha256sum ".pack/${VERSION_DIR}.zip" | awk '{print $1}')"
          ZIP_BYTES="$(stat -c '%s' ".pack/${VERSION_DIR}.zip")"
          printf '%s  %s\n' "$ZIP_SHA" "${VERSION_DIR}.zip" > ".pack/${VERSION_DIR}.zip.sha256"
          echo "$VERSION_DIR" > .pack/package-name.txt
          export VERSION_DIR ZIP_SHA ZIP_BYTES

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "artifact": f"{os.environ['VERSION_DIR']}.zip",
              "artifact_sha256": os.environ["ZIP_SHA"],
              "artifact_bytes": int(os.environ["ZIP_BYTES"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF_NAME"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "runtime_release": os.environ["PYTHON_BUILD_STANDALONE_TAG"],
              "runtime_version": os.environ["PYTHON_RUNTIME_VERSION"],
              "requirements_lock_sha256": os.environ["LOCK_SHA"],
              "built_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path(".pack/RELEASE_MANIFEST.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publicar paquete Mac reproducible
        uses: actions/upload-artifact@v4
        with:
          name: Calcula-Tu-Huella-Mac-${{ github.sha }}
          path: |
            .pack/Calcula_Tu_Huella_Mac_Autocontenida_v1_0_0_*.zip
            .pack/Calcula_Tu_Huella_Mac_Autocontenida_v1_0_0_*.zip.sha256
            .pack/RELEASE_MANIFEST.json
            .pack/package-name.txt
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
