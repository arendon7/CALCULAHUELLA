name: Materialize V1.9 analytics routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-analytics-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Analytics HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/analisis", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/escenarios", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('analytics boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 3:
              raise SystemExit(f"expected 3 analytics routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .analytics import full_analysis\nfrom .database import add_audit, get_db\nfrom .db.models import ActivityIndicator, Inventory\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_analytics_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date,\n    get_inventory, ensure_inventory_editable\n) -> None:\n' + indented
          Path('app/analytics_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .consolidation_web import register_consolidation_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('consolidation import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .analytics_web import register_analytics_routes\n', 1)
          register_anchor = '''register_consolidation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('consolidation registration anchor missing')
          registration = '''register_analytics_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date,\n    get_inventory, ensure_inventory_editable\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nANALYTICS_ROUTES = {\n    ("GET", "/analisis"),\n    ("POST", "/analisis/indicadores/nuevo"),\n    ("POST", "/analisis/indicadores/{indicator_id}/editar"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_analytics_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/analytics_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/analisis"' not in main_source\n    assert '@app.post("/analisis/indicadores/' not in main_source\n    assert "register_analytics_routes(" in main_source\n    assert module_source.count("@app.") == 3\n    assert "full_analysis" in module_source\n    assert "ActivityIndicator" in module_source\n    assert "_parse_excel_period" not in module_source\n    assert '@app.get("/escenarios"' not in module_source\n\n\ndef test_v190_analytics_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in ANALYTICS_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == ANALYTICS_ROUTES\n    assert len(actual) == len(ANALYTICS_ROUTES)\n\n\ndef test_v190_analytics_client_can_read_but_not_mutate():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        page = client.get("/analisis")\n        assert page.status_code == 200\n        denied = client.post(\n            "/analisis/indicadores/nuevo",\n            data={\n                "inventory_id": "1",\n                "indicator_type": "Producción",\n                "value": "10",\n                "unit": "t",\n                "period_start": "2025-01-01",\n                "period_end": "2025-01-31",\n                "source_name": "Prueba V1.9",\n            },\n            follow_redirects=False,\n        )\n        assert denied.status_code == 403\n'''
          Path('tests/test_v190_analytics_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Analytics HTTP\n\n## Autoridad\n\n`app/analytics_web.py` pasa a ser la autoridad HTTP de tres contratos: panel de análisis y creación/edición de indicadores operativos.\n\n## Dominio preservado\n\n`app/analytics.py` conserva `full_analysis` y las métricas derivadas. El corte no toca cálculo de emisiones, factores, escenarios ni reducción. `ActivityIndicator` mantiene persistencia y aislamiento por inventario/organización.\n\n## Separación deliberada\n\nDashboard no forma parte de este corte porque agrega workflow, entrega profesional, onboarding y configuración guiada. `_parse_excel_period` tampoco pertenece a Analytics y permanece en su ubicación actual hasta delimitar su consumidor real.\n\n## Gates\n\nEl contrato histórico V0.6 protege persistencia de indicadores e integración con reducción. El contrato V1.9 protege autoridad HTTP, unicidad y lectura sin permisos de mutación.\n'''
          Path('docs/architecture/V1_9_ANALYTICS_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/analytics_web.py app/main.py tests/test_v190_analytics_routing.py
          git diff --check
      - name: Targeted V1.9 Analytics authority
        run: pytest -q tests/test_v190_analytics_routing.py
      - name: Historical V0.6 indicator integration
        run: pytest -q tests/test_app.py -k "v06_indicators_and_reduction_are_persistent"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Analytics routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/analytics_web.py app/main.py tests/test_v190_analytics_routing.py docs/architecture/V1_9_ANALYTICS_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract analytics HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
