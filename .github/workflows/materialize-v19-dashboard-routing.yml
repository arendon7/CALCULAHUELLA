name: Materialize V1.9 dashboard routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-dashboard-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Dashboard and core workspace HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.post("/preferencias/vista")\n'
          end_marker = 'def _parse_excel_period(value: object, inventory: Inventory) -> tuple[date, date]:\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('dashboard boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 3:
              raise SystemExit(f"expected 3 dashboard/workspace routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom fastapi import Depends, Form, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .database import get_db\nfrom .db.models import CustomerOnboardingItem, DataRequest, Inventory\nfrom .delivery_readiness import professional_delivery_summary\nfrom .guided_onboarding import load_profile as load_guided_profile, decision_plan as guided_decision_plan\nfrom .onboarding_experience import onboarding_summary\nfrom .pilot_execution import guided_workspace\nfrom .product_experience import demo_story_for, journey_detail, normalize_view_mode\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_dashboard_routes(\n    app, templates, common_context, require_user, set_flash, get_inventory, inventory_metrics\n) -> None:\n' + indented
          Path('app/dashboard_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .methodology_governance_web import register_methodology_governance_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('methodology governance import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .dashboard_web import register_dashboard_routes\n', 1)
          register_anchor = '''register_methodology_governance_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date, get_inventory\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('methodology governance registration anchor missing')
          registration = '''register_dashboard_routes(\n    app, templates, common_context, require_user, set_flash, get_inventory, inventory_metrics\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nDASHBOARD_ROUTES = {\n    ("POST", "/preferencias/vista"),\n    ("GET", "/recorrido-inventario"),\n    ("GET", "/dashboard"),\n}\n\n\ndef _login(client: TestClient, email: str = "consultor@calculatuhuella.local") -> None:\n    response = client.post(\n        "/login", data={"email": email, "password": "Demo2026!"}, follow_redirects=False\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_dashboard_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/dashboard_web.py").read_text(encoding="utf-8")\n    for marker in (\n        '@app.post("/preferencias/vista"',\n        '@app.get("/recorrido-inventario"',\n        '@app.get("/dashboard"',\n    ):\n        assert marker not in main_source\n    assert "register_dashboard_routes(" in main_source\n    assert module_source.count("@app.") == 3\n    for authority in (\n        "guided_workspace", "professional_delivery_summary", "onboarding_summary",\n        "guided_decision_plan", "normalize_view_mode",\n    ):\n        assert authority in module_source\n    assert "def _parse_excel_period" not in module_source\n    for system_route in ('@app.get("/modulos"', '@app.get("/api/health"', '@app.get("/api/ready"'):\n        assert system_route in main_source\n\n\ndef test_v190_dashboard_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in DASHBOARD_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == DASHBOARD_ROUTES\n    assert len(actual) == len(DASHBOARD_ROUTES)\n\n\ndef test_v190_view_preference_preserves_safe_return_url_contract():\n    with TestClient(app) as client:\n        _login(client)\n        rejected = client.post(\n            "/preferencias/vista",\n            data={"mode": "essential", "return_url": "//evil.example"},\n            follow_redirects=False,\n        )\n        assert rejected.status_code == 303\n        assert rejected.headers["location"] == "/dashboard"\n        allowed = client.post(\n            "/preferencias/vista",\n            data={"mode": "full", "return_url": "/recorrido-inventario"},\n            follow_redirects=False,\n        )\n        assert allowed.status_code == 303\n        assert allowed.headers["location"] == "/recorrido-inventario"\n\n\ndef test_v190_dashboard_and_journey_remain_available_to_client():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/dashboard").status_code == 200\n        assert client.get("/recorrido-inventario").status_code == 200\n'''
          Path('tests/test_v190_dashboard_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Dashboard and core workspace HTTP\n\n## Autoridad\n\n`app/dashboard_web.py` pasa a ser la autoridad HTTP de tres contratos de experiencia núcleo: preferencia de vista, recorrido del inventario y dashboard.\n\n## Semántica preservada\n\nLa preferencia conserva normalización `essential/full`, flash y protección de `return_url`. El recorrido conserva `guided_workspace` + `journey_detail`. El dashboard mantiene métricas, solicitudes activas, siguiente acción por rol, readiness de entrega, onboarding, perfil guiado y relato demo.\n\n## Frontera\n\n`_parse_excel_period` y los helpers transversales permanecen fuera. `/modulos`, `/api/health` y `/api/ready` continúan en `main.py` como endpoints propios del composition root/sistema.\n\n## Gates\n\n`test_core_pages_load` protege disponibilidad histórica de dashboard y recorrido. Los contratos V1.9 protegen autoridad HTTP, unicidad, acceso de Cliente y la barrera contra retorno externo.\n'''
          Path('docs/architecture/V1_9_DASHBOARD_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/dashboard_web.py app/main.py tests/test_v190_dashboard_routing.py
          git diff --check
      - name: Targeted V1.9 Dashboard authority
        run: pytest -q tests/test_v190_dashboard_routing.py
      - name: Historical core pages contract
        run: pytest -q tests/test_app.py -k "core_pages_load"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Dashboard routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard_web.py app/main.py tests/test_v190_dashboard_routing.py docs/architecture/V1_9_DASHBOARD_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract dashboard HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
