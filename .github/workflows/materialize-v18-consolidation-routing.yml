name: Materialize V1.8 consolidation routing

on:
  push:
    branches: [refactor/v1-8-0-strategic-surfaces]
    paths:
      - .github/workflows/materialize-v18-consolidation-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-8-0-strategic-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Consolidation / Release Governance HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/consolidacion", response_class=HTMLResponse)\n'
          end_marker = 'register_public_routes(app, templates, current_user)\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('consolidation boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 7:
              raise SystemExit(f"expected 7 consolidation routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom datetime import UTC, datetime\nfrom pathlib import Path\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse, Response\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .architecture import domain_architecture_summary\nfrom .consolidation import build_consolidation_workbook, consolidation_summary, summary_json\nfrom .database import add_audit, get_db\nfrom .db.models import ConsolidationFinding, JourneyValidation, ReleaseGate\n\nBASE_DIR = Path(__file__).resolve().parent\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_consolidation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n) -> None:\n' + indented
          Path('app/consolidation_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .climate_disclosure_web import register_climate_disclosure_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('Climate Disclosure import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .consolidation_web import register_consolidation_routes\n', 1)
          register_anchor = '''register_climate_disclosure_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, parse_date\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('Climate Disclosure registration anchor missing')
          registration = '''register_consolidation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nCONSOLIDATION_ROUTES = {\n    ("GET", "/consolidacion"),\n    ("POST", "/consolidacion/hallazgos/{finding_id}"),\n    ("POST", "/consolidacion/puertas/{gate_id}"),\n    ("POST", "/consolidacion/recorridos/{validation_id}"),\n    ("GET", "/consolidacion/exportar.xlsx"),\n    ("GET", "/api/arquitectura/resumen"),\n    ("GET", "/api/consolidacion/resumen"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v180_consolidation_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/consolidation_web.py").read_text(encoding="utf-8")\n    for marker in (\n        '@app.get("/consolidacion"',\n        '@app.post("/consolidacion/',\n        '@app.get("/api/arquitectura/resumen"',\n        '@app.get("/api/consolidacion/resumen"',\n    ):\n        assert marker not in main_source\n    assert "register_consolidation_routes(" in main_source\n    assert module_source.count("@app.") == 7\n    assert "consolidation_summary" in module_source\n    assert "domain_architecture_summary" in module_source\n    assert "ReleaseGate" in module_source\n    assert "JourneyValidation" in module_source\n\n\ndef test_v180_consolidation_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in CONSOLIDATION_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == CONSOLIDATION_ROUTES\n    assert len(actual) == len(CONSOLIDATION_ROUTES)\n\n\ndef test_v180_consolidation_access_remains_internal():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/consolidacion").status_code == 403\n        client.post("/logout")\n        _login(client, "verificador@calculatuhuella.local")\n        assert client.get("/consolidacion").status_code == 200\n'''
          Path('tests/test_v180_consolidation_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.8 · Consolidation / Release Governance HTTP\n\n## Autoridad\n\n`app/consolidation_web.py` pasa a ser la autoridad HTTP de siete contratos: panel de consolidación, hallazgos, puertas de release, recorridos por rol, exportación XLSX y APIs de arquitectura/consolidación.\n\n## Dominio preservado\n\n`app/consolidation.py` conserva la autoridad de `consolidation_summary`, `build_consolidation_workbook` y `summary_json`; `app/architecture.py` conserva `domain_architecture_summary`. No se alteran criterios de readiness, evidencia de pruebas, estados de hallazgos, gates o recorridos.\n\n## Acceso\n\nLa lectura continúa exigiendo `view_consolidation`; las mutaciones exigen `manage_consolidation`. Cliente permanece sin acceso y Verificador mantiene lectura sin mutación.\n\n## Gates\n\n`tests/test_v021_consolidation.py` protege defaults, readiness controlado, permisos, mutaciones de hallazgos/gates/recorridos, XLSX y registro de producto. El contrato V1.8 protege autoridad y unicidad HTTP.\n'''
          Path('docs/architecture/V1_8_CONSOLIDATION_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/consolidation_web.py app/main.py tests/test_v180_consolidation_routing.py
          git diff --check
      - name: Targeted V1.8 Consolidation authority
        run: pytest -q tests/test_v180_consolidation_routing.py
      - name: Historical V0.21 Consolidation contracts
        run: pytest -q tests/test_v021_consolidation.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Consolidation routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/consolidation_web.py app/main.py tests/test_v180_consolidation_routing.py docs/architecture/V1_8_CONSOLIDATION_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract consolidation governance HTTP"
          git push origin HEAD:refactor/v1-8-0-strategic-surfaces
