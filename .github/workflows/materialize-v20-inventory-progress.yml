name: V2.0 · Materializar progreso agregado

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-inventory-progress.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      SEED_DEMO: "true"
      SCHEDULER_ENABLED: "0"
      STRUCTURED_LOGGING: "0"
      PBKDF2_ITERATIONS: "10000"
      INSTANCE_DIR: /tmp/cth-inventory-progress-v20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Centralizar progreso agregado y reforzar gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          database = Path('app/database.py')
          text = database.read_text(encoding='utf-8')
          old = '''SUPPLIER_MANAGED_CATEGORY = "Datos específicos de proveedores"\n\n\ndef refresh_progress(session: Session, inventory: Inventory) -> None:\n'''
          new = '''SUPPLIER_MANAGED_CATEGORY = "Datos específicos de proveedores"\n\n\ndef refresh_inventory_progress(session: Session, inventory: Inventory) -> None:\n    """Synchronize inventory progress from the persisted source authorities."""\n    session.flush()\n    progresses = list(session.scalars(\n        select(EmissionSource.progress).where(EmissionSource.inventory_id == inventory.id)\n    ))\n    inventory.progress = round(sum(progresses) / len(progresses)) if progresses else 0\n    if not inventory.locked and inventory.status != "Cerrado":\n        inventory.current_stage = "Recolección" if inventory.progress < 100 else "Cálculo"\n\n\ndef refresh_progress(session: Session, inventory: Inventory) -> None:\n'''
          if text.count(old) != 1:
              raise SystemExit('Punto de inserción de refresh_inventory_progress no encontrado')
          text = text.replace(old, new, 1)
          old_tail = '''    if inventory.sources:\n        inventory.progress = round(sum(source.progress for source in inventory.sources) / len(inventory.sources))\n    inventory.current_stage = "Recolección" if inventory.progress < 100 else "Cálculo"\n'''
          new_tail = '''    refresh_inventory_progress(session, inventory)\n'''
          if text.count(old_tail) != 1:
              raise SystemExit('Cola antigua de refresh_progress no encontrada')
          database.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')

          supply = Path('app/supply_chain.py')
          text = supply.read_text(encoding='utf-8')
          old_import = '''    SupplierResponse,\n)\n'''
          new_import = '''    SupplierResponse,\n    refresh_inventory_progress,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit('Import de supply_chain inesperado')
          text = text.replace(old_import, new_import, 1)
          old_sync = '''    source.progress = round(approved / requests * 100) if requests else 0\n    source.status = "Completado" if requests and approved == requests else ("En progreso" if approved else "Pendiente")\n    session.flush()\n    return source\n'''
          new_sync = '''    source.progress = round(approved / requests * 100) if requests else 0\n    source.status = "Completado" if requests and approved == requests else ("En progreso" if approved else "Pendiente")\n    session.flush()\n    inventory = session.get(Inventory, inventory_id)\n    if inventory is not None:\n        refresh_inventory_progress(session, inventory)\n    return source\n'''
          if text.count(old_sync) != 1:
              raise SystemExit('sync_supplier_source esperado no encontrado')
          supply.write_text(text.replace(old_sync, new_sync, 1), encoding='utf-8')

          gate = Path('scripts/browser_climate_journey_gate.py')
          text = gate.read_text(encoding='utf-8')
          old_gate = '''        sources = list(session.scalars(select(EmissionSource).where(EmissionSource.inventory_id == inventory.id)))\n        incomplete = [source.name for source in sources if source.included and source.progress < 100]\n        if incomplete:\n            raise AssertionError(f"Fuentes incompletas después del journey: {incomplete}")\n'''
          new_gate = '''        sources = list(session.scalars(select(EmissionSource).where(EmissionSource.inventory_id == inventory.id)))\n        incomplete = [source.name for source in sources if source.included and source.progress < 100]\n        if incomplete:\n            raise AssertionError(f"Fuentes incompletas después del journey: {incomplete}")\n        if inventory.progress != 100:\n            raise AssertionError(\n                f"El inventario conserva progreso agregado {inventory.progress}% pese a tener todas las fuentes completas."\n            )\n'''
          if text.count(old_gate) != 1:
              raise SystemExit('Contrato de persistencia del gate no encontrado')
          gate.write_text(text.replace(old_gate, new_gate, 1), encoding='utf-8')
          PY
          python -m py_compile app/database.py app/supply_chain.py scripts/browser_climate_journey_gate.py
          rm -rf "${INSTANCE_DIR}"
          python - <<'PY'
          from sqlalchemy import select
          from app.database import Inventory, EmissionSource, SessionLocal, init_db, refresh_inventory_progress
          from app.supply_chain import sync_supplier_source
          from app.database import SupplierDataRequest

          init_db()
          with SessionLocal() as session:
              inventory = session.scalar(select(Inventory).where(Inventory.name == "Inventario corporativo 2025"))
              assert inventory is not None
              sources = list(session.scalars(select(EmissionSource).where(EmissionSource.inventory_id == inventory.id)))
              supplier = next(source for source in sources if source.category == "Datos específicos de proveedores")
              for source in sources:
                  if source.id != supplier.id:
                      source.progress = 100
                      source.status = "Completado"
              # Dos solicitudes sin respuesta mantienen inicialmente 2/4 = 50 %.
              sync_supplier_source(session, inventory.id)
              assert supplier.progress == 50, supplier.progress
              assert inventory.progress == 93, inventory.progress

              # Reducir la campaña a las dos respuestas aprobadas prueba la transición 50 -> 100
              # usando la misma autoridad de sync_supplier_source.
              pending = list(session.scalars(
                  select(SupplierDataRequest).where(SupplierDataRequest.status.in_(["Enviada", "Pendiente"]))
              ))
              assert len(pending) == 2, len(pending)
              for request in pending:
                  session.delete(request)
              session.flush()
              sync_supplier_source(session, inventory.id)
              assert supplier.progress == 100, supplier.progress
              assert inventory.progress == 100, inventory.progress

              inventory.status = "Cerrado"
              inventory.locked = True
              inventory.current_stage = "Cerrado"
              supplier.progress = 50
              refresh_inventory_progress(session, inventory)
              assert inventory.current_stage == "Cerrado", inventory.current_stage
          print('aggregate inventory progress + closed-stage preservation OK')
          PY
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-inventory-progress.yml
          git add app/database.py app/supply_chain.py scripts/browser_climate_journey_gate.py
          git commit -m "fix(v2.0): synchronize aggregate inventory progress across source authorities"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
