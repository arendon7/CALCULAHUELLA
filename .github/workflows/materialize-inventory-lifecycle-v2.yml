name: Materialize inventory lifecycle V2

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-inventory-lifecycle-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply reviewed lifecycle extraction and reconcile governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          materializer = Path('.github/workflows/materialize-inventory-lifecycle.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          start = materializer.index(opening) + len(opening)
          end = materializer.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(materializer[start:end]), 'inventory-lifecycle-v1.py', 'exec'), {})

          governance = Path('tests/test_v160_architecture_governance.py')
          text = governance.read_text(encoding='utf-8')
          old = '''def test_architecture_audit_exposes_main_hotspots_for_incremental_refactor():\n    audit = _load_architecture_audit_module()\n    data = audit.snapshot()\n    hotspots = data["main_function_hotspots"]\n    assert hotspots\n    assert all(int(item["lines"]) > 0 for item in hotspots)\n    assert any(item["name"] == "clone_inventory_version" for item in hotspots)\n'''
          new = '''def test_architecture_audit_exposes_remaining_hotspots_and_recognizes_extracted_lifecycle():\n    audit = _load_architecture_audit_module()\n    data = audit.snapshot()\n    hotspots = data["main_function_hotspots"]\n    assert hotspots\n    assert all(int(item["lines"]) > 0 for item in hotspots)\n    # `clone_inventory_version` was the former ~190-line hotspot. Once its\n    # lifecycle service is extracted, governance must reward the reduction\n    # instead of requiring the debt to remain in main.py.\n    assert all(item["name"] != "clone_inventory_version" for item in hotspots)\n    assert max(int(item["lines"]) for item in hotspots) < 190\n    assert (ROOT / "app" / "inventory_lifecycle.py").is_file()\n'''
          if text.count(old) != 1:
              raise SystemExit('expected obsolete hotspot contract exactly once')
          governance.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile app/inventory_lifecycle.py app/main.py tests/test_v160_inventory_lifecycle.py tests/test_v160_architecture_governance.py
          git diff --check
      - name: Targeted lifecycle and governance contracts
        run: >-
          pytest -q
          tests/test_v160_inventory_lifecycle.py
          tests/test_v160_inventory_context.py
          tests/test_v160_architecture_governance.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Migration head
        run: python -m alembic upgrade head
      - name: Commit inventory lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/inventory_lifecycle.py \
            app/main.py \
            tests/test_v160_inventory_lifecycle.py \
            tests/test_v160_architecture_governance.py \
            docs/architecture/V1_6_INVENTORY_LIFECYCLE.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(inventory): extract lifecycle versioning service"
          git push origin HEAD:refactor/v1-6-0-consolidation
