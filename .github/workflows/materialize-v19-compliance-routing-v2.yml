name: Materialize V1.9 compliance routing V2

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-compliance-routing-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Compliance HTTP surface and reconcile authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _compliance_score(rows: list[ComplianceAssessment]) -> int:\n'
          route_marker = '@app.get("/cumplimiento", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/gobierno-metodologico", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(route_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('compliance boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 2:
              raise SystemExit(f"expected 2 compliance routes, found {block.count('@app.')}")
          route_start = block.index(route_marker)
          helper_block = block[:route_start].replace('def _compliance_score(', 'def compliance_score(', 1).rstrip() + '\n'
          route_block = block[route_start:].replace('_compliance_score(rows)', 'compliance_score(rows)', 1).rstrip() + '\n'

          header = '''from __future__ import annotations\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import add_audit, get_db\nfrom .db.models import ComplianceAssessment, ComplianceRequirement, EvidenceDocument, Inventory\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in route_block.splitlines(keepends=True))
          module = header + helper_block + '\n\ndef register_compliance_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, get_inventory\n) -> None:\n' + indented
          Path('app/compliance_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .executive_portfolio_web import register_executive_portfolio_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('executive portfolio import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .compliance_web import register_compliance_routes\n', 1)
          register_old = '''register_executive_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, _compliance_score\n)\n'''
          if source.count(register_old) != 1:
              raise SystemExit('executive registration with transitional score dependency missing')
          register_new = '''register_executive_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability\n)\nregister_compliance_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, get_inventory\n)\n'''
          source = source.replace(register_old, register_new, 1)
          main_path.write_text(source, encoding='utf-8')

          executive_path = Path('app/executive_portfolio_web.py')
          executive = executive_path.read_text(encoding='utf-8')
          model_anchor = '''from .db.models import (\n    ComplianceAssessment, DocumentControlRecord, EmissionSource, Inventory,\n    OrganizationMembership, ReductionAction, ReviewObservation,\n)\n'''
          if executive.count(model_anchor) != 1:
              raise SystemExit('executive model import anchor missing')
          executive = executive.replace(model_anchor, model_anchor + 'from .compliance_web import compliance_score\n', 1)
          old_signature = '''def register_executive_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability, _compliance_score\n) -> None:\n'''
          if executive.count(old_signature) != 1:
              raise SystemExit('executive transitional signature missing')
          executive = executive.replace(old_signature, '''def register_executive_portfolio_routes(\n    app, templates, common_context, require_user, ensure_capability\n) -> None:\n''', 1)
          executive = executive.replace('_compliance_score(assessments)', 'compliance_score(assessments)')
          executive_path.write_text(executive, encoding='utf-8')

          executive_test_path = Path('tests/test_v190_executive_portfolio_routing.py')
          executive_test = executive_test_path.read_text(encoding='utf-8')
          stale = '    assert "_compliance_score" in module_source\n'
          replacement = '    assert "from .compliance_web import compliance_score" in module_source\n    assert "_compliance_score" not in module_source\n'
          if executive_test.count(stale) != 1:
              raise SystemExit('stale executive compliance-score assertion not found exactly once')
          executive_test_path.write_text(executive_test.replace(stale, replacement, 1), encoding='utf-8')

          compliance_test = '''from __future__ import annotations\n\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\nfrom app.compliance_web import compliance_score\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nCOMPLIANCE_ROUTES = {\n    ("GET", "/cumplimiento"),\n    ("POST", "/cumplimiento/{assessment_id}/actualizar"),\n}\n\n\ndef test_v190_compliance_has_dedicated_http_and_score_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/compliance_web.py").read_text(encoding="utf-8")\n    executive_source = (ROOT / "app/executive_portfolio_web.py").read_text(encoding="utf-8")\n    assert 'def _compliance_score' not in main_source\n    assert '@app.get("/cumplimiento"' not in main_source\n    assert '@app.post("/cumplimiento/' not in main_source\n    assert "register_compliance_routes(" in main_source\n    assert module_source.count("@app.") == 2\n    assert "def compliance_score" in module_source\n    assert "from .compliance_web import compliance_score" in executive_source\n    assert "_compliance_score" not in executive_source\n    assert '@app.get("/gobierno-metodologico"' not in module_source\n\n\ndef test_v190_compliance_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in COMPLIANCE_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == COMPLIANCE_ROUTES\n    assert len(actual) == len(COMPLIANCE_ROUTES)\n\n\ndef test_v190_compliance_score_preserves_weights_and_no_aplica_exclusion():\n    rows = [\n        SimpleNamespace(status="Cumple"),\n        SimpleNamespace(status="Parcial"),\n        SimpleNamespace(status="Pendiente"),\n        SimpleNamespace(status="No cumple"),\n        SimpleNamespace(status="No aplica"),\n    ]\n    assert compliance_score(rows) == 38\n    assert compliance_score([SimpleNamespace(status="No aplica")]) == 0\n'''
          Path('tests/test_v190_compliance_routing.py').write_text(compliance_test, encoding='utf-8')

          doc = '''# V1.9 · Compliance HTTP\n\n## Autoridad\n\n`app/compliance_web.py` pasa a ser la autoridad de `/cumplimiento`, su actualización y `compliance_score`. El helper deja `main.py` y Executive Portfolio lo importa directamente.\n\n## Semántica preservada\n\n`No aplica` se excluye del denominador; `Cumple` pesa 100, `Parcial` 50 y `Pendiente`/`No cumple` 0. La actualización conserva estados válidos, propietario, evidencia, notas, `updated_by` y auditoría.\n\n## Acceso e integridad\n\nLa lectura exige `view_compliance`; la mutación `manage_compliance`. La evidencia opcional debe pertenecer al mismo inventario de la evaluación y toda evaluación se resuelve dentro de la organización activa.\n\n## Reconciliación\n\nEl contrato V1.9 de Executive Portfolio se actualiza desde la dependencia transitoria `_compliance_score` hacia la autoridad definitiva `compliance_web.compliance_score`; no se altera ningún comportamiento funcional.\n\n## Gates\n\nV0.13 protege que Consultor pueda actualizar y Verificador sea solo lectura. El contrato V1.9 protege autoridad HTTP, unicidad y la fórmula exacta del score.\n'''
          Path('docs/architecture/V1_9_COMPLIANCE_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/compliance_web.py app/executive_portfolio_web.py app/main.py tests/test_v190_compliance_routing.py tests/test_v190_executive_portfolio_routing.py
          git diff --check
      - name: Targeted V1.9 authority contracts
        run: pytest -q tests/test_v190_compliance_routing.py tests/test_v190_executive_portfolio_routing.py
      - name: Historical V0.13 compliance contract
        run: pytest -q tests/test_app.py -k "v013_compliance_update_and_verifier_read_only"
      - name: Executive Portfolio integration contract
        run: pytest -q tests/test_app.py -k "v013_executive_portfolio_contains_both_organizations"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Compliance routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/compliance_web.py app/executive_portfolio_web.py app/main.py tests/test_v190_compliance_routing.py tests/test_v190_executive_portfolio_routing.py docs/architecture/V1_9_COMPLIANCE_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract compliance HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
