name: Materialize V1.9 onboarding routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-onboarding-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Onboarding HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/onboarding", response_class=HTMLResponse)\n'
          end_marker = 'def _lead_complexity(employees_band: str, facilities_count: int, desired_scopes: str, has_previous_inventory: bool, objective: str, urgency: str) -> tuple[int, str]:\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('onboarding boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 2:
              raise SystemExit(f"expected 2 onboarding routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nfrom datetime import UTC, datetime\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom .database import add_audit, get_db\nfrom .db.models import CustomerOnboardingItem\nfrom .onboarding_experience import onboarding_summary\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_customer_onboarding_routes(\n    app, templates, common_context, require_user, set_flash, parse_date, get_inventory\n) -> None:\n' + indented
          Path('app/customer_onboarding_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .service_account_web import register_service_account_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('service account import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .customer_onboarding_web import register_customer_onboarding_routes\n', 1)
          register_anchor = '''register_service_account_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('service account registration anchor missing')
          registration = '''register_customer_onboarding_routes(\n    app, templates, common_context, require_user, set_flash, parse_date, get_inventory\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nONBOARDING_ROUTES = {\n    ("GET", "/onboarding"),\n    ("POST", "/onboarding/{item_id}/actualizar"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_onboarding_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/customer_onboarding_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/onboarding"' not in main_source\n    assert '@app.post("/onboarding/' not in main_source\n    assert "register_customer_onboarding_routes(" in main_source\n    assert module_source.count("@app.") == 2\n    assert "onboarding_summary" in module_source\n    assert "CustomerOnboardingItem.organization_id" in module_source\n    assert "_lead_complexity" not in module_source\n\n\ndef test_v190_onboarding_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in ONBOARDING_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == ONBOARDING_ROUTES\n    assert len(actual) == len(ONBOARDING_ROUTES)\n\n\ndef test_v190_onboarding_page_remains_available_to_client():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        page = client.get("/onboarding")\n        assert page.status_code == 200\n        assert "Calcula tu Huella" in page.text\n'''
          Path('tests/test_v190_onboarding_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Customer Onboarding HTTP\n\n## Autoridad\n\n`app/customer_onboarding_web.py` pasa a ser la autoridad HTTP de dos contratos: vista de onboarding y actualización de actividades.\n\n## Dominio preservado\n\n`app/onboarding_experience.py` conserva `onboarding_summary`. No se alteran score, estados (`Pendiente`, `En progreso`, `Completado`, `Bloqueado`), responsable, vencimiento ni marca temporal de completado.\n\n## Acceso e aislamiento\n\nLa lectura sigue disponible al usuario autenticado de la organización. La mutación conserva la regla histórica `can_manage_org` o `can_manage_inventory`, y cada ítem se filtra por `organization_id`.\n\n## Gates\n\nEl contrato histórico `test_onboarding_item_can_be_completed` protege persistencia y `completed_at`. El contrato V1.9 protege autoridad HTTP, unicidad y disponibilidad para Cliente.\n'''
          Path('docs/architecture/V1_9_ONBOARDING_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/customer_onboarding_web.py app/main.py tests/test_v190_onboarding_routing.py
          git diff --check
      - name: Targeted V1.9 Onboarding authority
        run: pytest -q tests/test_v190_onboarding_routing.py
      - name: Historical onboarding lifecycle
        run: pytest -q tests/test_app.py -k "onboarding_item_can_be_completed"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Onboarding routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/customer_onboarding_web.py app/main.py tests/test_v190_onboarding_routing.py docs/architecture/V1_9_ONBOARDING_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract customer onboarding HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
