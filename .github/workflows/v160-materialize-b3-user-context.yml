name: V1.6 · B3 contexto usuario multiempresa

on:
  push:
    branches:
      - refactor/v1-6-0-consolidation
    paths:
      - .github/workflows/v160-materialize-b3-user-context.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Capturar baseline real de suite completa
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/cth-b3-baseline HEAD
          pushd /tmp/cth-b3-baseline
          set +e
          python -m pytest -q > /tmp/cth-b3-baseline.log 2>&1
          BASELINE_RC=$?
          set -e
          popd
          grep '^FAILED ' /tmp/cth-b3-baseline.log | sed 's/^FAILED //' | sed 's/ - .*//' | sort -u > /tmp/cth-b3-baseline-failed.txt || true
          echo "Baseline pytest rc: $BASELINE_RC"
          echo "Fallos baseline: $(wc -l < /tmp/cth-b3-baseline-failed.txt)"
          cat /tmp/cth-b3-baseline-failed.txt

      - name: Materializar servicio de contexto de usuario
        shell: bash
        run: |
          set -euo pipefail
          cat > app/user_context.py <<'PY'
          from __future__ import annotations

          from fastapi import Request
          from sqlalchemy import select
          from sqlalchemy.orm import Session, selectinload

          from .access_control import ROLE_CAPABILITIES
          from .database import AppUser, Organization, OrganizationMembership, SessionLocal
          from .product_experience import normalize_view_mode, role_profile


          def _active_memberships(session: Session, db_user: AppUser) -> list[OrganizationMembership]:
              memberships = list(
                  session.scalars(
                      select(OrganizationMembership)
                      .where(
                          OrganizationMembership.user_id == db_user.id,
                          OrganizationMembership.active.is_(True),
                      )
                      .options(selectinload(OrganizationMembership.organization))
                      .order_by(OrganizationMembership.id)
                  )
              )
              if memberships:
                  return memberships

              membership = OrganizationMembership(
                  user_id=db_user.id,
                  organization_id=db_user.organization_id,
                  role=db_user.role,
                  active=True,
              )
              session.add(membership)
              session.commit()
              session.refresh(membership)
              membership.organization = session.get(Organization, membership.organization_id)
              return [membership]


          def _active_membership(
              request: Request,
              memberships: list[OrganizationMembership],
              primary_organization_id: int,
          ) -> OrganizationMembership:
              requested_org = request.session.get("active_org_id")
              active = next(
                  (item for item in memberships if item.organization_id == requested_org),
                  None,
              )
              if active:
                  return active

              active = next(
                  (item for item in memberships if item.organization_id == primary_organization_id),
                  memberships[0],
              )
              request.session["active_org_id"] = active.organization_id
              return active


          def _capability_flags(capabilities: set[str]) -> dict[str, bool]:
              return {
                  "can_manage_org": "manage_org" in capabilities,
                  "can_manage_inventory": "manage_inventory" in capabilities,
                  "can_manage_sources": "manage_sources" in capabilities,
                  "can_review": "review" in capabilities,
                  "can_approve": "approve" in capabilities,
                  "can_provide_data": "provide_data" in capabilities or "manage_sources" in capabilities,
                  "can_view_methodology": "view_methodology" in capabilities,
                  "can_external_audit": "external_audit" in capabilities,
                  "can_manage_supply_chain": "manage_supply_chain" in capabilities,
                  "can_manage_operations": "manage_operations" in capabilities,
                  "can_manage_automations": "manage_automations" in capabilities,
                  "can_manage_integrations": "manage_integrations" in capabilities,
                  "can_manage_portfolio": "manage_portfolio" in capabilities,
                  "can_manage_compliance": "manage_compliance" in capabilities,
                  "can_view_compliance": "view_compliance" in capabilities or "manage_compliance" in capabilities,
                  "can_manage_documents": "manage_documents" in capabilities,
                  "can_manage_methodology_governance": "manage_methodology_governance" in capabilities,
                  "can_manage_readiness": "manage_readiness" in capabilities,
                  "can_manage_subscription": "manage_subscription" in capabilities,
                  "can_manage_support": "manage_support" in capabilities,
                  "can_manage_saas": "manage_saas" in capabilities,
                  "can_manage_commercial": "manage_commercial" in capabilities,
                  "can_manage_customer_success": "manage_customer_success" in capabilities,
                  "can_view_customer_success": "view_customer_success" in capabilities or "manage_customer_success" in capabilities,
                  "can_manage_impact": "manage_impact" in capabilities,
                  "can_view_impact": "view_impact" in capabilities or "manage_impact" in capabilities,
                  "can_manage_climate_risk": "manage_climate_risk" in capabilities,
                  "can_view_climate_risk": "view_climate_risk" in capabilities or "manage_climate_risk" in capabilities,
                  "can_manage_climate_disclosure": "manage_climate_disclosure" in capabilities,
                  "can_view_climate_disclosure": "view_climate_disclosure" in capabilities or "manage_climate_disclosure" in capabilities,
                  "can_manage_consolidation": "manage_consolidation" in capabilities,
                  "can_view_consolidation": "view_consolidation" in capabilities or "manage_consolidation" in capabilities,
              }


          def resolve_current_user(request: Request) -> dict[str, object] | None:
              email = request.session.get("user_email")
              if not email:
                  return None

              with SessionLocal() as session:
                  db_user = session.scalar(
                      select(AppUser).where(
                          AppUser.email == email,
                          AppUser.active.is_(True),
                      )
                  )
                  if not db_user:
                      return None

                  memberships = _active_memberships(session, db_user)
                  active_membership = _active_membership(
                      request,
                      memberships,
                      db_user.organization_id,
                  )
                  role = active_membership.role
                  capabilities = ROLE_CAPABILITIES.get(role, set())
                  view_mode = normalize_view_mode(request.session.get("view_mode"))
                  initials = "".join(piece[0] for piece in db_user.name.split()[:2]).upper()
                  organization_options = [
                      {
                          "id": item.organization_id,
                          "name": item.organization.name,
                          "trade_name": item.organization.trade_name,
                          "role": item.role,
                      }
                      for item in memberships
                      if item.organization
                  ]
                  user = {
                      "id": db_user.id,
                      "organization_id": active_membership.organization_id,
                      "primary_organization_id": db_user.organization_id,
                      "email": db_user.email,
                      "role": role,
                      "name": db_user.name,
                      "initials": initials,
                      "organizations": organization_options,
                      "capabilities": capabilities,
                      "view_mode": view_mode,
                      "profile": role_profile(role),
                  }
                  user.update(_capability_flags(capabilities))
                  return user
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("app/main.py")
          source = path.read_text(encoding="utf-8")
          import_anchor = "from .auth_web import register_auth_routes\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("B3 abortado: import anchor inesperado")
          source = source.replace(
              import_anchor,
              import_anchor + "from .user_context import resolve_current_user\n",
              1,
          )
          start_marker = "def current_user(request: Request) -> dict[str, object] | None:\n"
          end_marker = "\ndef require_user(request: Request) -> dict[str, object]:\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("B3 abortado: bloque current_user no encontrado")
          old_block = source[start:end]
          if "OrganizationMembership" not in old_block or "can_manage_consolidation" not in old_block:
              raise SystemExit("B3 abortado: current_user no coincide con baseline esperada")
          replacement = (
              "def current_user(request: Request) -> dict[str, object] | None:\n"
              "    return resolve_current_user(request)\n"
          )
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY

          cat > tests/test_v160_user_context.py <<'PY'
          from __future__ import annotations

          from sqlalchemy import select
          from starlette.requests import Request

          from app.access_control import ROLE_CAPABILITIES
          from app.database import AppUser, Organization, OrganizationMembership, SessionLocal
          from app.user_context import resolve_current_user


          def _request(session_values: dict[str, object]) -> Request:
              return Request(
                  {
                      "type": "http",
                      "http_version": "1.1",
                      "method": "GET",
                      "scheme": "http",
                      "path": "/",
                      "raw_path": b"/",
                      "query_string": b"",
                      "root_path": "",
                      "headers": [],
                      "client": ("testclient", 50000),
                      "server": ("testserver", 80),
                      "session": session_values,
                  }
              )


          def test_user_context_returns_none_without_authenticated_session() -> None:
              assert resolve_current_user(_request({})) is None


          def test_user_context_resolves_primary_membership_and_capabilities() -> None:
              request = _request({"user_email": "admin@calculatuhuella.local"})
              user = resolve_current_user(request)
              assert user is not None
              assert request.session["active_org_id"] == user["organization_id"]
              assert user["capabilities"] == ROLE_CAPABILITIES[user["role"]]
              assert user["can_manage_org"] == ("manage_org" in user["capabilities"])
              assert user["can_provide_data"] == (
                  "provide_data" in user["capabilities"] or "manage_sources" in user["capabilities"]
              )


          def test_user_context_uses_role_from_active_organization_membership() -> None:
              with SessionLocal() as session:
                  db_user = session.scalar(
                      select(AppUser).where(AppUser.email == "admin@calculatuhuella.local")
                  )
                  assert db_user is not None
                  extra = Organization(
                      name="Organización B3 contexto",
                      trade_name="B3",
                      tax_id="B3-CTX-001",
                      sector="Servicios y oficinas",
                      city="Medellín",
                  )
                  session.add(extra)
                  session.flush()
                  session.add(
                      OrganizationMembership(
                          user_id=db_user.id,
                          organization_id=extra.id,
                          role="Cliente",
                          active=True,
                      )
                  )
                  session.commit()
                  extra_id = extra.id

              request = _request(
                  {
                      "user_email": "admin@calculatuhuella.local",
                      "active_org_id": extra_id,
                  }
              )
              user = resolve_current_user(request)
              assert user is not None
              assert user["organization_id"] == extra_id
              assert user["role"] == "Cliente"
              assert user["capabilities"] == ROLE_CAPABILITIES["Cliente"]
              assert user["can_manage_org"] is False
              assert any(item["id"] == extra_id and item["role"] == "Cliente" for item in user["organizations"])


          def test_user_context_rejects_unavailable_active_org_and_restores_primary() -> None:
              request = _request(
                  {
                      "user_email": "admin@calculatuhuella.local",
                      "active_org_id": 999999999,
                  }
              )
              user = resolve_current_user(request)
              assert user is not None
              assert user["organization_id"] == user["primary_organization_id"]
              assert request.session["active_org_id"] == user["primary_organization_id"]
          PY

      - name: Verificar alcance y reducción de concentración
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED=$'app/main.py\napp/user_context.py\ntests/test_v160_user_context.py'
          printf 'Archivos modificados:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$(wc -l < app/main.py)" -le 4493
          grep -F 'return resolve_current_user(request)' app/main.py
          python -m compileall -q app tests
          python scripts/audit_architecture.py --enforce

      - name: Regresión dirigida de identidad roles y multiempresa
        run: |
          python -m pytest -q \
            tests/test_v160_user_context.py \
            tests/test_app.py \
            tests/test_v024_security_hardening.py \
            tests/test_iteration12_role_ux.py \
            tests/test_iteration19_role_journeys.py \
            tests/test_v100_iteration_2_role_navigation.py \
            tests/test_v160_architecture_governance.py

      - name: Smoke integral
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300

      - name: Suite completa diferencial sin regresiones nuevas
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q > /tmp/cth-b3-after.log 2>&1
          AFTER_RC=$?
          set -e
          grep '^FAILED ' /tmp/cth-b3-after.log | sed 's/^FAILED //' | sed 's/ - .*//' | sort -u > /tmp/cth-b3-after-failed.txt || true
          BASELINE_COUNT=$(wc -l < /tmp/cth-b3-baseline-failed.txt)
          AFTER_COUNT=$(wc -l < /tmp/cth-b3-after-failed.txt)
          echo "After pytest rc: $AFTER_RC"
          echo "Baseline failures: $BASELINE_COUNT"
          echo "After failures: $AFTER_COUNT"
          NEW_FAILURES="$(comm -13 /tmp/cth-b3-baseline-failed.txt /tmp/cth-b3-after-failed.txt)"
          if [ -n "$NEW_FAILURES" ]; then
            echo "NUEVAS REGRESIONES DETECTADAS:"
            printf '%s\n' "$NEW_FAILURES"
            exit 1
          fi
          test "$AFTER_COUNT" -le "$BASELINE_COUNT"

      - name: Materializar B3 y retirar materializador
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force /tmp/cth-b3-baseline || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/user_context.py tests/test_v160_user_context.py
          git rm .github/workflows/v160-materialize-b3-user-context.yml
          git commit -m "refactor(v1.6): extraer contexto de usuario y multiempresa"
          git push origin HEAD:refactor/v1-6-0-consolidation
