name: Materialize V1.9 service account routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-service-account-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Service Account HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = 'def _service_usage(session: Session, organization_id: int, plan: ServicePlan | None) -> dict[str, object]:\n'
          route_marker = '@app.get("/cuenta-servicio", response_class=HTMLResponse)\n'
          end_marker = '@app.get("/onboarding", response_class=HTMLResponse)\n'
          if source.count(start_marker) != 1 or source.count(route_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('service account boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 2:
              raise SystemExit(f"expected 2 service account routes, found {block.count('@app.')}")
          route_start = block.index(route_marker)
          helper_block = block[:route_start].rstrip() + '\n'
          route_block = block[route_start:].rstrip() + '\n'

          header = '''from __future__ import annotations\n\nfrom datetime import date\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .database import add_audit, get_db\nfrom .db.models import (\n    BillingInvoice, EvidenceDocument, Facility, Inventory, OrganizationMembership,\n    OrganizationSubscription, ServicePlan, UsageCounter,\n)\n\n\n'''
          indented_routes = ''.join(('    ' + line if line.strip() else line) for line in route_block.splitlines(keepends=True))
          module = header + helper_block + '\n\ndef register_service_account_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n) -> None:\n' + indented_routes
          Path('app/service_account_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .automations_web import register_automation_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('automations import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .service_account_web import register_service_account_routes\n', 1)
          register_anchor = '''register_automation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, get_inventory\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('automations registration anchor missing')
          registration = '''register_service_account_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nfrom app.database import OrganizationSubscription, ServicePlan, SessionLocal\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nSERVICE_ACCOUNT_ROUTES = {\n    ("GET", "/cuenta-servicio"),\n    ("POST", "/cuenta-servicio/suscripcion"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_service_account_has_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/service_account_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/cuenta-servicio"' not in main_source\n    assert '@app.post("/cuenta-servicio/' not in main_source\n    assert "register_service_account_routes(" in main_source\n    assert module_source.count("@app.") == 2\n    assert "def _service_usage" in module_source\n    assert "UsageCounter" in module_source\n    assert '@app.get("/onboarding"' not in module_source\n\n\ndef test_v190_service_account_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in SERVICE_ACCOUNT_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == SERVICE_ACCOUNT_ROUTES\n    assert len(actual) == len(SERVICE_ACCOUNT_ROUTES)\n\n\ndef test_v190_service_account_subscription_update_persists_and_client_is_read_only():\n    with SessionLocal() as session:\n        subscription = session.scalar(select(OrganizationSubscription).where(OrganizationSubscription.organization_id == 1))\n        assert subscription is not None\n        plan = session.scalar(select(ServicePlan).where(ServicePlan.active.is_(True), ServicePlan.id != subscription.plan_id).order_by(ServicePlan.id))\n        if plan is None:\n            plan = session.get(ServicePlan, subscription.plan_id)\n        assert plan is not None\n        plan_id = plan.id\n\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/cuenta-servicio").status_code == 200\n        denied = client.post(\n            "/cuenta-servicio/suscripcion",\n            data={"plan_id": str(plan_id), "billing_cycle": "Mensual"},\n            follow_redirects=False,\n        )\n        assert denied.status_code == 403\n        client.post("/logout")\n        _login(client, "admin@calculatuhuella.local")\n        updated = client.post(\n            "/cuenta-servicio/suscripcion",\n            data={"plan_id": str(plan_id), "billing_cycle": "Mensual"},\n            follow_redirects=False,\n        )\n        assert updated.status_code == 303\n\n    with SessionLocal() as session:\n        subscription = session.scalar(select(OrganizationSubscription).where(OrganizationSubscription.organization_id == 1))\n        assert subscription.plan_id == plan_id\n        assert subscription.billing_cycle == "Mensual"\n        assert subscription.status == "Activa"\n'''
          Path('tests/test_v190_service_account_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Service Account HTTP\n\n## Autoridad\n\n`app/service_account_web.py` pasa a ser la autoridad HTTP de dos contratos: cuenta de servicio y actualización administrativa de suscripción. `_service_usage` se mueve con el contexto porque solo alimenta esta superficie.\n\n## Semántica preservada\n\nSe mantienen límites de usuarios, sedes, inventarios y almacenamiento; persistencia mensual de `UsageCounter`; planes activos; ciclo mensual/anual; y la aclaración de que el cambio de plan es administrativo y no procesa pagos.\n\n## Acceso\n\nLa cuenta continúa visible al usuario autenticado. La actualización de suscripción exige `manage_subscription` y se limita a la organización activa.\n\n## Gates\n\nEl contrato histórico `test_service_account_has_seeded_subscription_and_plans` protege la lectura semilla. El contrato V1.9 protege autoridad HTTP, unicidad, lectura de cliente y persistencia del cambio de plan.\n'''
          Path('docs/architecture/V1_9_SERVICE_ACCOUNT_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/service_account_web.py app/main.py tests/test_v190_service_account_routing.py
          git diff --check
      - name: Targeted V1.9 Service Account authority
        run: pytest -q tests/test_v190_service_account_routing.py
      - name: Historical service account contract
        run: pytest -q tests/test_app.py -k "service_account_has_seeded_subscription_and_plans"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Service Account routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/service_account_web.py app/main.py tests/test_v190_service_account_routing.py docs/architecture/V1_9_SERVICE_ACCOUNT_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract service account HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
