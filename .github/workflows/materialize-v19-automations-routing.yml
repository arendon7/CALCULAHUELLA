name: Materialize V1.9 automations routing

on:
  push:
    branches: [refactor/v1-9-0-core-surfaces]
    paths:
      - .github/workflows/materialize-v19-automations-routing.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-9-0-core-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract Automations HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          source = main_path.read_text(encoding='utf-8')
          start_marker = '@app.get("/automatizaciones", response_class=HTMLResponse)\n'
          end_marker = 'def _compliance_score(rows: list[ComplianceAssessment]) -> int:\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('automation boundaries are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker)
          block = source[start:end].rstrip() + '\n'
          if block.count('@app.') != 5:
              raise SystemExit(f"expected 5 automation routes, found {block.count('@app.')}")

          header = '''from __future__ import annotations\n\nimport json\n\nfrom fastapi import Depends, Form, HTTPException, Request\nfrom fastapi.responses import HTMLResponse, RedirectResponse\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session, selectinload\n\nfrom .automations import (\n    AUTOMATION_TYPES, CADENCES, ROLE_OPTIONS, calculate_next_run, execute_automation, process_due_automations,\n)\nfrom .config import settings\nfrom .database import add_audit, get_db\nfrom .db.models import AutomationRun, Inventory, ScheduledAutomation\n\n\n'''
          indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
          module = header + 'def register_automation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, get_inventory\n) -> None:\n' + indented
          Path('app/automations_web.py').write_text(module, encoding='utf-8')

          source = source[:start] + source[end:]
          import_anchor = 'from .verification_web import register_verification_routes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('verification import anchor missing')
          source = source.replace(import_anchor, import_anchor + 'from .automations_web import register_automation_routes\n', 1)
          register_anchor = '''register_verification_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash,\n    get_inventory, review_gate_summary\n)\n'''
          if source.count(register_anchor) != 1:
              raise SystemExit('verification registration anchor missing')
          registration = '''register_automation_routes(\n    app, templates, common_context, require_user, ensure_capability, set_flash, get_inventory\n)\n'''
          source = source.replace(register_anchor, register_anchor + registration, 1)
          main_path.write_text(source, encoding='utf-8')

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nfrom app.database import ScheduledAutomation, SessionLocal\nfrom app.main import app\n\nROOT = Path(__file__).resolve().parents[1]\n\nAUTOMATION_ROUTES = {\n    ("GET", "/automatizaciones"),\n    ("POST", "/automatizaciones/nueva"),\n    ("POST", "/automatizaciones/{automation_id}/estado"),\n    ("POST", "/automatizaciones/{automation_id}/ejecutar"),\n    ("POST", "/automatizaciones/procesar-vencidas"),\n}\n\n\ndef _login(client: TestClient, email: str) -> None:\n    response = client.post(\n        "/login",\n        data={"email": email, "password": "Demo2026!"},\n        follow_redirects=False,\n    )\n    assert response.status_code == 303\n\n\ndef test_v190_automations_have_dedicated_http_authority():\n    main_source = (ROOT / "app/main.py").read_text(encoding="utf-8")\n    module_source = (ROOT / "app/automations_web.py").read_text(encoding="utf-8")\n    assert '@app.get("/automatizaciones"' not in main_source\n    assert '@app.post("/automatizaciones/' not in main_source\n    assert "register_automation_routes(" in main_source\n    assert module_source.count("@app.") == 5\n    for authority in ("calculate_next_run", "execute_automation", "process_due_automations"):\n        assert authority in module_source\n    assert "def _compliance_score" not in module_source\n\n\ndef test_v190_automation_route_contract_is_unique_and_complete():\n    actual = []\n    relevant = {path for _, path in AUTOMATION_ROUTES}\n    for route in app.routes:\n        path = getattr(route, "path", None)\n        methods = getattr(route, "methods", set()) or set()\n        if path in relevant:\n            actual.extend((method, path) for method in methods if method in {"GET", "POST"})\n    assert set(actual) == AUTOMATION_ROUTES\n    assert len(actual) == len(AUTOMATION_ROUTES)\n\n\ndef test_v190_automation_permissions_and_creation_persist():\n    with TestClient(app) as client:\n        _login(client, "cliente@calculatuhuella.local")\n        assert client.get("/automatizaciones").status_code == 403\n        client.post("/logout")\n        _login(client, "consultor@calculatuhuella.local")\n        page = client.get("/automatizaciones")\n        assert page.status_code == 200\n        response = client.post(\n            "/automatizaciones/nueva",\n            data={\n                "name": "Automatización V1.9",\n                "automation_type": "Recordatorio de solicitudes",\n                "cadence": "Semanal",\n                "schedule_time": "08:00",\n                "inventory_id": "1",\n                "weekday": "1",\n                "days_before": "3",\n                "recipient_roles": ["Administrador", "Consultor"],\n            },\n            follow_redirects=False,\n        )\n        assert response.status_code == 303\n\n    with SessionLocal() as session:\n        row = session.scalar(select(ScheduledAutomation).where(ScheduledAutomation.name == "Automatización V1.9"))\n        assert row is not None\n        assert row.active is True\n        assert row.next_run_at is not None\n        assert row.timezone == "America/Bogota"\n'''
          Path('tests/test_v190_automations_routing.py').write_text(test, encoding='utf-8')

          doc = '''# V1.9 · Automations HTTP\n\n## Autoridad\n\n`app/automations_web.py` pasa a ser la autoridad HTTP de cinco contratos: panel, creación, activación/desactivación, ejecución manual y procesamiento de automatizaciones vencidas.\n\n## Dominio preservado\n\n`app/automations.py` conserva tipos, cadencias, cálculo de próxima ejecución, ejecución individual y procesamiento del scheduler. No se cambian reglas de tiempo, roles destinatarios, auditoría o semántica de `AutomationRun`.\n\n## Acceso\n\nTodas las rutas continúan exigiendo `manage_automations`. Las automatizaciones y sus ejecuciones permanecen aisladas por organización; el inventario opcional se valida mediante `get_inventory`.\n\n## Gates\n\nEl contrato histórico `test_manual_automation_execution_creates_run` protege ejecución real y cierre de `AutomationRun`. El contrato V1.9 protege autoridad HTTP, unicidad, permisos y creación persistente con `next_run_at`.\n'''
          Path('docs/architecture/V1_9_AUTOMATIONS_ROUTING.md').write_text(doc, encoding='utf-8')
          PY
          python -m py_compile app/automations_web.py app/main.py tests/test_v190_automations_routing.py
          git diff --check
      - name: Targeted V1.9 Automations authority
        run: pytest -q tests/test_v190_automations_routing.py
      - name: Historical automation execution
        run: pytest -q tests/test_app.py -k "manual_automation_execution_creates_run"
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Commit Automations routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/automations_web.py app/main.py tests/test_v190_automations_routing.py docs/architecture/V1_9_AUTOMATIONS_ROUTING.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(routes): extract automations HTTP"
          git push origin HEAD:refactor/v1-9-0-core-surfaces
