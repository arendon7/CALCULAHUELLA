name: V2.0 · Certificación final integral

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/certify-v20-final.yml

permissions:
  contents: write
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      SEED_DEMO: "false"
      SCHEDULER_ENABLED: "0"
      STRUCTURED_LOGGING: "0"
      PBKDF2_ITERATIONS: "10000"
      CSRF_ENABLED: "1"
      INSTANCE_DIR: /tmp/cth-v20-final-cert
      PRODUCT_SHA: cef1168d8d8744600a660c90160a95bd442f10fd
      PRODUCT_READINESS_RUN: "31501902412"
      CANONICAL_RUN: "31501902400"
      PACKAGE_RUN: "31501895998"
      PACKAGE_ARTIFACT_ID: "9105414995"
      PACKAGE_OUTER_SHA256: da739408a9f23c5601602fe0361db462c7ee421a722702eb9692b3513f025fc9
      PACKAGE_INNER_SHA256: 6368dbd77f3286196e7167b554322b7ade8b9bf44784ae77b19542d94d7755dd
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validar gates externos del SHA de producto
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_sha = os.environ["PRODUCT_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path):
              request = urllib.request.Request(f"https://api.github.com/repos/{repo}/{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          evidence = {}
          for key, run_id in (
              ("product_readiness", os.environ["PRODUCT_READINESS_RUN"]),
              ("canonical_ci", os.environ["CANONICAL_RUN"]),
              ("mac_package", os.environ["PACKAGE_RUN"]),
          ):
              run = api(f"actions/runs/{run_id}")
              assert run["conclusion"] == "success", (key, run["status"], run["conclusion"])
              assert run["head_sha"] == expected_sha, (key, run["head_sha"], expected_sha)
              evidence[key] = {
                  "run_id": int(run_id),
                  "conclusion": run["conclusion"],
                  "head_sha": run["head_sha"],
              }

          artifact = api(f"actions/artifacts/{os.environ['PACKAGE_ARTIFACT_ID']}")
          assert artifact["expired"] is False
          assert artifact.get("digest") == "sha256:" + os.environ["PACKAGE_OUTER_SHA256"], artifact.get("digest")
          evidence["package_artifact"] = {
              "artifact_id": int(os.environ["PACKAGE_ARTIFACT_ID"]),
              "name": artifact["name"],
              "size_in_bytes": artifact["size_in_bytes"],
              "digest": artifact["digest"],
          }
          open("v20-external-evidence.json", "w", encoding="utf-8").write(
              json.dumps(evidence, indent=2, ensure_ascii=False)
          )
          print(json.dumps(evidence, indent=2, ensure_ascii=False))
          PY

      - name: Verificar criptográficamente el paquete final
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PACKAGE_ARTIFACT_ID}/zip" \
            --output /tmp/v20-final-mac-actions.zip
          echo "${PACKAGE_OUTER_SHA256}  /tmp/v20-final-mac-actions.zip" | sha256sum --check --strict
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import zipfile

          outer_path = "/tmp/v20-final-mac-actions.zip"
          product_sha = os.environ["PRODUCT_SHA"]
          expected_inner = os.environ["PACKAGE_INNER_SHA256"]
          with zipfile.ZipFile(outer_path) as outer:
              release = json.loads(outer.read("RELEASE_MANIFEST.json"))
              assert release["source_commit"] == product_sha, release
              assert release["workflow_run"] == int(os.environ["PACKAGE_RUN"]), release
              inner_name = release["artifact"]
              inner_bytes = outer.read(inner_name)
              inner_sha = hashlib.sha256(inner_bytes).hexdigest()
              assert inner_sha == expected_inner == release["artifact_sha256"], (
                  inner_sha,
                  expected_inner,
                  release["artifact_sha256"],
              )

          checked = 0
          with zipfile.ZipFile(io.BytesIO(inner_bytes)) as inner:
              provenance_name = next(name for name in inner.namelist() if name.endswith("/BUILD_PROVENANCE.json"))
              provenance = json.loads(inner.read(provenance_name))
              assert provenance["source_commit"] == product_sha, provenance
              assert provenance["python_runtime"]["version"] == "3.12.13", provenance
              assert provenance["python_runtime"]["release_tag"] == "20260807", provenance
              manifest_name = next(name for name in inner.namelist() if name.endswith("/MANIFEST_SHA256.txt"))
              prefix = manifest_name[: -len("MANIFEST_SHA256.txt")]
              manifest = inner.read(manifest_name).decode("utf-8")
              for raw in manifest.splitlines():
                  raw = raw.strip()
                  if not raw:
                      continue
                  digest, rel = raw.split("  ", 1)
                  target = prefix + rel
                  actual = hashlib.sha256(inner.read(target)).hexdigest()
                  assert actual == digest, (target, actual, digest)
                  checked += 1
              names = inner.namelist()
              forbidden = ("/source/tests/", "/source/.github/", "/source/packaging/")
              assert not any(any(marker in name for marker in forbidden) for name in names)

          result = {
              "outer_sha256": os.environ["PACKAGE_OUTER_SHA256"],
              "inner_sha256": expected_inner,
              "manifest_entries_verified": checked,
              "source_commit": product_sha,
              "runtime": "CPython 3.12.13 / 20260807",
          }
          open("v20-package-verification.json", "w", encoding="utf-8").write(
              json.dumps(result, indent=2, ensure_ascii=False)
          )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Verificar estructura canónica limpia
        shell: bash
        run: |
          rm -rf /tmp/calculahuella-v20-canonical
          mkdir -p /tmp/calculahuella-v20-canonical
          rsync -a --exclude='.git/' ./ /tmp/calculahuella-v20-canonical/
          cd /tmp/calculahuella-v20-canonical
          python tools/verify_canonical.py --skip-manifest

      - name: Verificar higiene, contratos y snapshot
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from app.db.base import Base
          import app.db.models  # noqa: F401

          root = Path('.')
          workflows = sorted(path.name for path in (root / '.github/workflows').glob('*.yml'))
          expected = sorted([
              'ci.yml',
              'iteration4-stabilization.yml',
              'package-mac-selfcontained.yml',
              'pages.yml',
              'certify-v20-final.yml',
          ])
          assert workflows == expected, (workflows, expected)
          assert not list((root / '.github/workflows').glob('materialize-*.yml'))
          assert not list((root / '.github/workflows').glob('diagnose-*.yml'))

          methods = {'get', 'post', 'put', 'delete', 'patch', 'options', 'head'}
          routes = []
          main_routes = []
          app_files = list((root / 'app').rglob('*.py'))
          for path in app_files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for decorator in node.decorator_list:
                      if not isinstance(decorator, ast.Call) or not isinstance(decorator.func, ast.Attribute):
                          continue
                      method = decorator.func.attr.lower()
                      if method not in methods or not decorator.args:
                          continue
                      first = decorator.args[0]
                      if not isinstance(first, ast.Constant) or not isinstance(first.value, str):
                          continue
                      pair = (method.upper(), first.value)
                      routes.append(pair)
                      if path == root / 'app/main.py':
                          main_routes.append(pair)

          seen = set()
          duplicates = set()
          for pair in routes:
              if pair in seen:
                  duplicates.add(pair)
              seen.add(pair)
          assert not duplicates, sorted(duplicates)
          assert len(routes) == 344, len(routes)
          assert sorted(main_routes) == sorted([
              ('GET', '/modulos'),
              ('GET', '/api/health'),
              ('GET', '/api/ready'),
          ]), main_routes

          main_lines = len((root / 'app/main.py').read_text(encoding='utf-8').splitlines())
          assert main_lines == 639, main_lines
          table_count = len(Base.metadata.tables)
          assert table_count == 124, table_count
          metrics = {
              'app_python_files': len(app_files),
              'app_python_lines': sum(len(path.read_text(encoding='utf-8').splitlines()) for path in app_files),
              'main_lines': main_lines,
              'main_direct_routes': len(main_routes),
              'http_routes': len(routes),
              'orm_tables': table_count,
              'workflows_during_certification': workflows,
          }
          Path('v20-architecture-metrics.json').write_text(
              json.dumps(metrics, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(metrics, indent=2))
          PY
          git diff --check

      - name: Suite pytest integral directa
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=v20-final-pytest.xml 2>&1 | tee v20-final-pytest.log

      - name: Gate arquitectónico
        run: python scripts/audit_architecture.py --enforce

      - name: Suite smoke independiente
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_test_tier.py smoke --durations 10 --timeout 420 2>&1 | tee v20-final-smoke.log

      - name: Alembic desde base vacía
        shell: bash
        run: |
          rm -rf "${INSTANCE_DIR}"
          mkdir -p "${INSTANCE_DIR}"
          python -m alembic upgrade head
          python -m alembic current | tee v20-final-alembic.log
          grep -q '20260810_0039' v20-final-alembic.log

      - name: Generar acta V2.0 únicamente tras todos los PASS
        shell: bash
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          metrics = json.loads(Path('v20-architecture-metrics.json').read_text(encoding='utf-8'))
          package = json.loads(Path('v20-package-verification.json').read_text(encoding='utf-8'))
          external = json.loads(Path('v20-external-evidence.json').read_text(encoding='utf-8'))
          root = ET.parse('v20-final-pytest.xml').getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          passed = tests - failures - errors - skipped
          assert failures == 0 and errors == 0

          lines = [
              '# V2.0 · Certificación final de product readiness',
              '',
              '## Estado',
              '',
              '**CERTIFICADA** para cierre técnico sobre la rama `stabilization/v2-0-0-product-readiness`.',
              '',
              'Esta acta se generó únicamente después de superar de nuevo los gates integrales y de verificar criptográficamente el artefacto Mac correspondiente al mismo SHA de producto.',
              '',
              '## Baseline y gobierno',
              '',
              '- Baseline V1.9 certificada: `19d46ba63dfc243d69c7aa42f94e58d4576435d0`.',
              f'- SHA de producto V2.0 certificado: `{external["product_readiness"]["head_sha"]}`.',
              '- PR: **#23**, permanece **draft**.',
              '- `main` permanece fuera de alcance; esta certificación **no autoriza merge automático**.',
              '',
              '## Evidencia integral',
              '',
              f'- Pytest integral directo: **{passed} passed / {skipped} skipped**.',
              f'- Product-readiness completo: **run {external["product_readiness"]["run_id"]} · success**, con 8 jobs: regresión/seguridad/continuidad, PostgreSQL restore, Chromium, Firefox, WebKit, cinco roles, handoff y huella climática completa.',
              f'- CI canónico del SHA de producto: **run {external["canonical_ci"]["run_id"]} · success**.',
              '- Arquitectura: **green**.',
              '- Smoke independiente: **56 passed**.',
              '- Alembic desde instancia vacía hasta `20260810_0039`: **green**.',
              '- Estructura canónica comprobada sobre copia sin `.git`: **green**.',
              f'- Contratos HTTP: **{metrics["http_routes"]} únicos**, sin duplicados `(method, path)`.',
              f'- Tablas ORM: **{metrics["orm_tables"]}**.',
              f'- `app/main.py`: **{metrics["main_lines"]} líneas / {metrics["main_direct_routes"]} rutas directas**.',
              '',
              '## Artefacto Mac reproducible',
              '',
              f'- Workflow de empaquetado: **run {external["mac_package"]["run_id"]} · success**.',
              f'- Artifact ID: **{external["package_artifact"]["artifact_id"]}**.',
              f'- SHA-256 del ZIP de Actions: `{package["outer_sha256"]}`.',
              f'- SHA-256 del ZIP entregable interno: `{package["inner_sha256"]}`.',
              f'- Entradas verificadas contra `MANIFEST_SHA256.txt`: **{package["manifest_entries_verified"]}**, sin discrepancias.',
              f'- Runtime: **{package["runtime"]}**.',
              '- El runtime del paquete declara exactamente el SHA de producto certificado.',
              '- El runtime excluye `tests/`, `.github/` y `packaging/` de la carga distribuida.',
              '',
              '## Capacidades de promotion-readiness cerradas en V2.0',
              '',
              '1. Gate moderno de product readiness asociado al PR actual.',
              '2. Continuidad PostgreSQL con backup, restore aislado y auditoría.',
              '3. Paquete Mac reproducible, hash-locked y con procedencia explícita.',
              '4. Journey climático completo en navegador real: captura operativa, cadena de proveedores, cálculo, revisión, segregación de aprobación, informe, cierre y paquete de verificación.',
              '5. Frontera correcta entre captura de actividad y fuente consolidada de proveedores, con progreso agregado coherente.',
              '6. Portal de proveedores protegido por CSRF sin romper el flujo público seguro.',
              '7. Liveness/readiness separados: el servidor abre puerto sin bloquearse por Storage externo; `/api/ready` conserva diagnóstico estricto.',
              '8. Timeouts y reintentos S3 acotados; configuración inválida falla antes de tocar red.',
              '',
              '## Composition root',
              '',
              'Se preserva la frontera V1.9. Las únicas rutas HTTP directas en `app/main.py` son:',
              '',
              '- `GET /api/health`',
              '- `GET /api/ready`',
              '- `GET /modulos`',
              '',
              '## Higiene de workflows',
              '',
              'Durante la certificación existen los cuatro workflows permanentes y este certificador temporal. El certificador se elimina en el mismo commit que persiste esta acta. El estado limpio debe volver a:',
              '',
              '- `.github/workflows/ci.yml`',
              '- `.github/workflows/iteration4-stabilization.yml`',
              '- `.github/workflows/package-mac-selfcontained.yml`',
              '- `.github/workflows/pages.yml`',
              '',
              '## Alcance de la afirmación',
              '',
              'Esta certificación demuestra **readiness técnico y operativo controlado del ciclo V2.0**. No convierte por sí sola una demo o configuración sin servicios externos reales en producción pública certificada, ni sustituye verificación independiente de inventarios de carbono.',
              '',
              'La siguiente y única acción de gobierno es: limpiar el certificador, ejecutar CI canónico sobre el SHA limpio y actualizar PR #23 manteniéndolo draft. No se autoriza promoción a `main` mediante esta acta.',
          ]
          text = '\n'.join(lines) + '\n'
          Path('docs/architecture/V2_0_FINAL_CERTIFICATION.md').write_text(text, encoding='utf-8')
          print(text)
          PY
          git diff --check

      - name: Persistir acta y autoeliminar certificador
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/certify-v20-final.yml
          git add docs/architecture/V2_0_FINAL_CERTIFICATION.md
          git commit -m "docs(v2.0): record final product readiness certification"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
