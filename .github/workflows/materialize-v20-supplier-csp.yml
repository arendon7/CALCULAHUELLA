name: V2.0 · Materializar CSP portal proveedor

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-supplier-csp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Externalizar comportamiento del portal para cumplir CSP
        shell: bash
        run: |
          cat > app/static/js/supplier_portal.js <<'JS'
          (() => {
            const method = document.getElementById('supplier-method');
            if (!method) return;
            const activity = document.getElementById('activity-fields');
            const factor = document.getElementById('factor-fields');
            const total = document.getElementById('total-fields');
            const sync = () => {
              const value = method.value;
              activity.hidden = value === 'Huella total suministrada' || value === 'Factor por gasto';
              factor.hidden = value === 'Huella total suministrada';
              total.hidden = value !== 'Huella total suministrada';
            };
            method.addEventListener('change', sync);
            sync();
          })();
          JS
          python - <<'PY'
          from pathlib import Path
          path = Path('app/templates/supplier_portal.html')
          text = path.read_text(encoding='utf-8')
          old = '''<script>\n(() => {\n  const method = document.getElementById('supplier-method');\n  if (!method) return;\n  const activity = document.getElementById('activity-fields');\n  const factor = document.getElementById('factor-fields');\n  const total = document.getElementById('total-fields');\n  const sync = () => {\n    const value = method.value;\n    activity.hidden = value === 'Huella total suministrada' || value === 'Factor por gasto';\n    factor.hidden = value === 'Huella total suministrada';\n    total.hidden = value !== 'Huella total suministrada';\n  };\n  method.addEventListener('change', sync);\n  sync();\n})();\n</script>'''
          new = '''<script src="{{ url_for('static', path='js/supplier_portal.js') }}" defer></script>'''
          if text.count(old) != 1:
              raise SystemExit('Script inline del portal no encontrado exactamente una vez')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if grep -q '<script>' app/templates/supplier_portal.html; then
            echo 'Persistió un script inline en supplier_portal.html' >&2
            exit 1
          fi
          grep -q "js/supplier_portal.js" app/templates/supplier_portal.html
          test -s app/static/js/supplier_portal.js
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-supplier-csp.yml
          git add app/templates/supplier_portal.html app/static/js/supplier_portal.js
          git commit -m "fix(v2.0): make supplier portal compatible with strict csp"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
