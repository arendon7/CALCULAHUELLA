name: V2.0 · Materializar regresiones rápidas

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-targeted-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Incorporar regresiones V2 al gate dirigido
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/iteration4-stabilization.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '''            tests/test_v200_product_readiness_gate.py \\\n            tests/test_v200_postgres_continuity_gate.py \\\n'''
          replacement = '''            tests/test_v200_product_readiness_gate.py \\\n            tests/test_v200_capture_supply_boundary.py \\\n            tests/test_v200_supplier_portal_csrf.py \\\n            tests/test_v200_refresh_progress.py \\\n            tests/test_v200_mac_package_reproducibility.py \\\n            tests/test_v200_postgres_continuity_gate.py \\\n'''
          if text.count(anchor) != 1:
              raise SystemExit('Ancla del gate dirigido no encontrada exactamente una vez')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          grep -q 'tests/test_v200_capture_supply_boundary.py' .github/workflows/iteration4-stabilization.yml
          grep -q 'tests/test_v200_supplier_portal_csrf.py' .github/workflows/iteration4-stabilization.yml
          grep -q 'tests/test_v200_refresh_progress.py' .github/workflows/iteration4-stabilization.yml
          grep -q 'tests/test_v200_mac_package_reproducibility.py' .github/workflows/iteration4-stabilization.yml
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-targeted-regressions.yml
          git add .github/workflows/iteration4-stabilization.yml
          git commit -m "ci(v2.0): fail fast on product readiness regressions"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
