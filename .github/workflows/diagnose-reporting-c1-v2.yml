name: Diagnose reporting C1 V2

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/diagnose-reporting-c1-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Reapply exact C1 workspace patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/materialize-reporting-c1.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(source[start:end]), 'c1.py', 'exec'), {})
          PY
      - name: Enumerate full regression failures
        shell: bash
        run: |
          set +e
          pytest -q --tb=no 2>&1 | tee /tmp/pytest-c1-short.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/pytest-c1-short.log').read_text(encoding='utf-8', errors='replace').splitlines()
          failed = [line for line in lines if line.startswith('FAILED ')]
          summary = [line for line in lines if ' failed' in line and (' passed' in line or line.startswith('='))]
          payload = '\n'.join(failed + summary[-2:])
          escaped = payload.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=C1 failure inventory::{escaped}')
          PY
          fi
          exit "$status"
