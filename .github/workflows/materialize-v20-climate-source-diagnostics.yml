name: V2.0 · Materializar diagnóstico de fuentes

on:
  push:
    branches:
      - stabilization/v2-0-0-product-readiness
    paths:
      - .github/workflows/materialize-v20-climate-source-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v2-0-0-product-readiness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Añadir diagnóstico preciso de progreso antes de recomendación
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/browser_climate_journey_gate.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _recommend(page: Page) -> None:\n    page.goto(f"{BASE_URL}/control", wait_until="networkidle")\n    if "Listo para aprobar" not in page.locator(".approval-panel").inner_text():\n        raise AssertionError(f"Las puertas de calidad no quedaron listas: {page.locator('.approval-panel').inner_text()}")\n'''
          new = '''def _recommend(page: Page) -> None:\n    page.goto(f"{BASE_URL}/control", wait_until="networkidle")\n    if "Listo para aprobar" not in page.locator(".approval-panel").inner_text():\n        with SessionLocal() as session:\n            inventory = session.scalar(select(Inventory).where(Inventory.name == INVENTORY_NAME))\n            source_state = [\n                {"name": item.name, "category": item.category, "included": item.included, "progress": item.progress}\n                for item in session.scalars(\n                    select(EmissionSource).where(EmissionSource.inventory_id == inventory.id).order_by(EmissionSource.id)\n                )\n            ] if inventory else []\n        raise AssertionError(\n            f"Las puertas de calidad no quedaron listas: {page.locator('.approval-panel').inner_text()} | "\n            f"Estado de fuentes: {source_state}"\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit('Bloque _recommend esperado no encontrado exactamente una vez')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/browser_climate_journey_gate.py
          git diff --check

      - name: Commit limpio y autoeliminación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-v20-climate-source-diagnostics.yml
          git add scripts/browser_climate_journey_gate.py
          git commit -m "test(v2.0): expose source progress in climate gate failures"
          git push origin HEAD:stabilization/v2-0-0-product-readiness
