name: V1.6 · CSP3 política de estilos

on:
  push:
    branches:
      - refactor/v1-6-0-consolidation
    paths:
      - .github/workflows/v160-materialize-csp3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Capturar baseline completa
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/cth-csp3-baseline HEAD
          pushd /tmp/cth-csp3-baseline
          set +e
          python -m pytest -q > /tmp/cth-csp3-baseline.log 2>&1
          BASELINE_RC=$?
          set -e
          popd
          grep '^FAILED ' /tmp/cth-csp3-baseline.log | sed 's/^FAILED //' | sed 's/ - .*//' | sort -u > /tmp/cth-csp3-baseline-failed.txt || true
          echo "Baseline pytest rc: $BASELINE_RC"
          echo "Fallos baseline: $(wc -l < /tmp/cth-csp3-baseline-failed.txt)"
          cat /tmp/cth-csp3-baseline-failed.txt

      - name: Aplicar CSP3 y prueba de header real
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/security.py")
          source = path.read_text(encoding="utf-8")
          old = (
              "b\"default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; \"\n"
              "                        b\"font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'\""
          )
          new = (
              "b\"default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-elem 'self'; \"\n"
              "                        b\"style-src-attr 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; \"\n"
              "                        b\"frame-ancestors 'none'; base-uri 'self'; form-action 'self'\""
          )
          if source.count(old) != 1:
              raise SystemExit("CSP3 abortado: política CSP base no coincide exactamente")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          cat > tests/test_v160_csp_headers.py <<'PY'
          from __future__ import annotations

          from fastapi.testclient import TestClient

          from app.main import app


          def _directives(policy: str) -> dict[str, str]:
              parsed: dict[str, str] = {}
              for raw in policy.split(";"):
                  part = raw.strip()
                  if not part:
                      continue
                  name, *rest = part.split(None, 1)
                  parsed[name] = rest[0] if rest else ""
              return parsed


          def test_csp3_real_response_separates_element_and_attribute_styles() -> None:
              with TestClient(app) as client:
                  response = client.get("/login")
              assert response.status_code == 200
              policy = response.headers["content-security-policy"]
              directives = _directives(policy)

              assert directives["default-src"] == "'self'"
              assert directives["script-src"] == "'self'"
              assert directives["style-src"] == "'self'"
              assert directives["style-src-elem"] == "'self'"
              assert directives["style-src-attr"] == "'unsafe-inline'"
              assert "'unsafe-eval'" not in policy
              assert policy.count("'unsafe-inline'") == 1
          PY

      - name: Verificar alcance y política exacta
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(printf '%s\n%s\n' "$(git diff --name-only)" "$(git ls-files --others --exclude-standard)" | sed '/^$/d' | sort -u)"
          EXPECTED=$'app/security.py\ntests/test_v160_csp_headers.py'
          printf 'Archivos modificados:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          python -m compileall -q app tests
          python scripts/audit_architecture.py --enforce
          grep -F "style-src-elem 'self'" app/security.py
          grep -F "style-src-attr 'unsafe-inline'" app/security.py

      - name: Regresión dirigida de seguridad
        run: |
          python -m pytest -q \
            tests/test_v160_csp_headers.py \
            tests/test_v024_security_hardening.py \
            tests/test_iteration9_architecture_performance_security.py \
            tests/test_v057_production_readiness.py

      - name: Smoke integral
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300

      - name: Suite completa diferencial sin regresiones nuevas
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q > /tmp/cth-csp3-after.log 2>&1
          AFTER_RC=$?
          set -e
          grep '^FAILED ' /tmp/cth-csp3-after.log | sed 's/^FAILED //' | sed 's/ - .*//' | sort -u > /tmp/cth-csp3-after-failed.txt || true
          BASELINE_COUNT=$(wc -l < /tmp/cth-csp3-baseline-failed.txt)
          AFTER_COUNT=$(wc -l < /tmp/cth-csp3-after-failed.txt)
          echo "After pytest rc: $AFTER_RC"
          echo "Baseline failures: $BASELINE_COUNT"
          echo "After failures: $AFTER_COUNT"
          NEW_FAILURES="$(comm -13 /tmp/cth-csp3-baseline-failed.txt /tmp/cth-csp3-after-failed.txt)"
          if [ -n "$NEW_FAILURES" ]; then
            echo "NUEVAS REGRESIONES DETECTADAS:"
            printf '%s\n' "$NEW_FAILURES"
            exit 1
          fi
          test "$AFTER_COUNT" -le "$BASELINE_COUNT"

      - name: Materializar CSP3 y retirar materializador
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force /tmp/cth-csp3-baseline || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/security.py tests/test_v160_csp_headers.py
          git rm .github/workflows/v160-materialize-csp3.yml
          git commit -m "security(v1.6): separar CSP de estilos por elemento y atributo"
          git push origin HEAD:refactor/v1-6-0-consolidation
