name: Materialize D2a seed bootstrap

on:
  push:
    branches: [refactor/v1-6-0-consolidation]
    paths:
      - .github/workflows/materialize-d2a-seed-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v1-6-0-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extract bootstrap seed from database facade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          database = Path("app/database.py")
          source = database.read_text(encoding="utf-8")
          marker = "def init_db() -> None:\n"
          if source.count(marker) != 1:
              raise SystemExit(f"expected one init_db marker, found {source.count(marker)}")
          start = source.index(marker)
          init_source = source[start:].rstrip() + "\n"
          if "Industrias Andinas Demo S.A.S." not in init_source:
              raise SystemExit("seed demo body was not captured")

          seed_header = '''from __future__ import annotations\n\nimport hashlib\nimport json\nimport math\nimport secrets\nfrom datetime import UTC, date, datetime\nfrom pathlib import Path\n\nfrom openpyxl import Workbook\nfrom sqlalchemy import delete, select\n\nfrom .audit import add_audit, audit_event_digest, backfill_audit_chain\nfrom .config import INSTANCE_DIR, PROJECT_DIR, settings\nfrom .db.base import Base, ENGINE, SessionLocal, UPLOAD_DIR\nfrom .db.models import *  # noqa: F401,F403 - bootstrap consumes the canonical ORM models\nfrom .database import (\n    _ensure_v020_defaults,\n    _ensure_v021_defaults,\n    _ensure_v022_defaults,\n    _ensure_v023_defaults,\n    _ensure_v024_defaults,\n    _ensure_v025_defaults,\n    _ensure_v026_defaults,\n    _ensure_v027_defaults,\n    _ensure_v028_defaults,\n    _ensure_v030_defaults,\n    _ensure_v031_defaults,\n    _ensure_v032_defaults,\n    _ensure_v033_defaults,\n    _ensure_v034_defaults,\n    _ensure_v035_defaults,\n    _ensure_v036_defaults,\n    _ensure_v037_defaults,\n    _ensure_v043_defaults,\n    _ensure_v044_defaults,\n    _ensure_v045_defaults,\n    _ensure_v050_defaults,\n    _ensure_v100_final_defaults,\n    _seed_methodology,\n    _seed_sector_templates,\n    hash_password,\n    refresh_progress,\n    write_simple_pdf,\n)\n\n'''
          Path("app/seed.py").write_text(seed_header + init_source, encoding="utf-8")

          facade = '''def init_db() -> None:\n    """Initialize persistence through the dedicated bootstrap module.\n\n    Kept here as a compatibility facade because application modules and external\n    callers historically import ``init_db`` from ``app.database``.\n    """\n    from .seed import init_db as bootstrap_init_db\n\n    bootstrap_init_db()\n'''
          database.write_text(source[:start].rstrip() + "\n\n\n" + facade, encoding="utf-8")

          test = '''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom sqlalchemy import func, select\n\nfrom app.database import Base, ENGINE, Organization, SessionLocal, init_db\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_v160_d2a_database_keeps_init_db_as_compatibility_facade():\n    database = (ROOT / "app/database.py").read_text(encoding="utf-8")\n    seed = (ROOT / "app/seed.py").read_text(encoding="utf-8")\n    assert "from .seed import init_db as bootstrap_init_db" in database\n    assert "Industrias Andinas Demo S.A.S." not in database\n    assert "def init_db() -> None:" in seed\n    assert "Industrias Andinas Demo S.A.S." in seed\n    assert len(database.splitlines()) < 1750\n\n\ndef test_v160_d2a_bootstrap_remains_idempotent_on_seeded_database():\n    with SessionLocal() as session:\n        before = session.scalar(select(func.count()).select_from(Organization))\n    init_db()\n    with SessionLocal() as session:\n        after = session.scalar(select(func.count()).select_from(Organization))\n    assert after == before\n    assert len(Base.metadata.tables) == 124\n    assert ENGINE is not None\n'''
          Path("tests/test_v160_seed_bootstrap_extraction.py").write_text(test, encoding="utf-8")

          doc = '''# V1.6 · D2 seed/defaults\n\n## Objetivo\n\nReducir la concentración de `app/database.py` sin modificar modelos ORM, migraciones, cálculos ni datos funcionales.\n\n## D2a · bootstrap de semilla\n\n- `app/seed.py` pasa a ser la autoridad del bootstrap y de la carga demostrativa ejecutada por `init_db()`.\n- `app.database.init_db()` permanece como fachada pública compatible.\n- Los modelos continúan en `app/db/models`; `Base`, `ENGINE`, `SessionLocal` y rutas de almacenamiento continúan en `app/db/base`.\n- Los defaults históricos permanecen temporalmente en `app/database.py`; su extracción corresponde a D2b y no se mezcla con este corte.\n- No se modifican factores, GWP, fórmulas, emisiones, tablas ORM ni migraciones.\n\n## Contratos de aceptación\n\n1. La inicialización completa de la suite sigue creando la misma semilla demostrativa.\n2. Ejecutar `init_db()` sobre una base ya sembrada no duplica organizaciones.\n3. El esquema conserva 124 tablas.\n4. `database.py` reduce materialmente su tamaño y deja de contener el dataset principal de `Industrias Andinas Demo`.\n5. Regresión completa, deuda arquitectónica, smoke y Alembic deben quedar verdes antes del commit.\n\n## Siguiente corte\n\nD2b extraerá la cadena `_ensure_v012_defaults` → `_ensure_v100_final_defaults` a una autoridad específica de defaults, conservando fachadas privadas solo si existe dependencia real comprobada.\n'''
          Path("docs/architecture/V1_6_D2_SEED_DEFAULTS.md").write_text(doc, encoding="utf-8")
          PY
          python -m py_compile app/database.py app/seed.py tests/test_v160_seed_bootstrap_extraction.py
          git diff --check
      - name: Targeted D2a contracts
        run: >-
          pytest -q
          tests/test_v160_seed_bootstrap_extraction.py
          tests/test_iteration18_canonical_regressions.py
          tests/test_v021_consolidation.py
      - name: Full regression suite
        run: pytest -q
      - name: Architecture debt gate
        run: python scripts/audit_architecture.py --enforce
      - name: Canonical smoke tier
        run: python scripts/run_test_tier.py smoke --durations 10 --timeout 300
      - name: Migration head
        run: python -m alembic upgrade head
      - name: Commit D2a
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/database.py app/seed.py tests/test_v160_seed_bootstrap_extraction.py docs/architecture/V1_6_D2_SEED_DEFAULTS.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(database): extract D2a seed bootstrap"
          git push origin HEAD:refactor/v1-6-0-consolidation
