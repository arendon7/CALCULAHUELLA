services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calculatuhuella}
      POSTGRES_USER: ${POSTGRES_USER:-calculatuhuella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calculatuhuella} -d ${POSTGRES_DB:-calculatuhuella}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Define S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Define S3_SECRET_KEY}
    volumes: [object_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc version enable local/$$S3_BUCKET
    environment:
      S3_BUCKET: ${S3_BUCKET:-calculatuhuella-documentos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-calculatuhuella}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calculatuhuella}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_HEALTH_URL: http://minio:9000/minio/health/ready
      PROMETHEUS_HEALTH_URL: http://prometheus:9090/-/ready
      ALERTMANAGER_HEALTH_URL: http://alertmanager:9093/-/ready
      GRAFANA_HEALTH_URL: http://grafana:3000/api/health
      APP_ENV: production
      SEED_DEMO: "false"
      SCHEDULER_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    expose: ["8765"]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-calculatuhuella}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calculatuhuella}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      APP_ENV: production
      SEED_DEMO: "false"
      SCHEDULER_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && python scripts/run_automations.py"]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./deployment/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deployment/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  postgres_data:
  object_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
